let mapOpen=false;
function updateTitle(){
  if (yesTap()){ newGame(); cityGrid=buildCity(); game.state="base";
    if (("ontouchstart" in window) || (window.matchMedia && window.matchMedia("(pointer:coarse)").matches)) toggleFS();
    say(["Vharn does not greet you. Vharn does not notice you.",
         "You are one more body that owns a knife and an appetite. Unless you become more."]); }
}
function updateBase(){
  updTownfolk();
  if (uiBlocked()){ updateUI(); return; }
  const mv=dirTap();
  if (mv){ stopWalk(); tryBaseMove(mv[0],mv[1]); maybeMugged(); return; }
  if (walkPath && walkPath.length){
    if (yesTap()||noTap()){ stopWalk(); return; }
    if (++walkTick>=5){
      walkTick=0;
      const st=walkPath.shift();
      if (citySolid(st[0],st[1])){ stopWalk(); }
      else {
        game.base.px=st[0]; game.base.py=st[1];
        if (!walkPath.length && walkCb){ const cb=walkCb; walkCb=null; cb(); }
      }
    }
    return;
  }
  walkPath=null; walkCb=null;
  if (yesTap()){
    for (const b of BUILDINGS){
      if (b.home && !game.player.house) continue;
      if (nearBuilding(b, game.base.px, game.base.py)){ enterBuilding(b); return; }
    }
    say(["Cobblestones, drizzle, the smell of tallow and meat going off.",
         "Nothing needs you here. The city keeps its appointments elsewhere."]);
  }
}
function updateDungeon(){
  if (mapOpen){ if (tap("m")||noTap()||yesTap()) mapOpen=false; return; }
  if (uiBlocked()){ updateUI(); return; }
  const d=game.dungeon, f=curFloor();
  const mv=dirTap();
  if (mv){ stopWalk(); tryMove(mv[0],mv[1]); return; }
  if (walkPath && walkPath.length){
    if (yesTap()||noTap()){ stopWalk(); return; }
    if (tap("m")){ stopWalk(); mapOpen=true; return; }
    if (++walkTick>=6){
      walkTick=0;
      const st=walkPath.shift();
      if (f.grid[st[1]] && f.grid[st[1]][st[0]]==="#"){ stopWalk(); }
      else {
        tryMove(st[0]-d.px, st[1]-d.py);
        if (!walkPath){ stopWalk(); }
        else if (!walkPath.length){ walkPath=null; const cb=walkCb; walkCb=null; }
      }
    }
    return;
  }
  walkPath=null; walkCb=null;
  if (tap("m")){ mapOpen=true; return; }
  if (!yesTap()) return;
  const ch=f.grid[d.py][d.px];
  if (ch==="<"){
    if (d.floorIx===0){
      if (temptClimb()) return;
      leaveDungeon(); return;
    }
    d.floorIx--;
    const fr=curFloor();
    d.px=fr.rooms[0].cx; d.py=fr.rooms[0].cy;
    markSeen();
    say(["You climb back up. The air is one level less ancient."]);
    return;
  }
  if (ch===">"){
    if (gateReady()){ openTheGate(); return; }
    d.depth++;
    game.player.deep=Math.max(game.player.deep,d.depth);
    maybeDepthLore(d.depth);
    genFloor(d);
    advanceWeeks(1);
    saveGame();
    say(["Down. The stone gets older. The things in it get less pretend."]);
    return;
  }
  showMenu("DELVE", [
        ...(countItem("Ration")? [{ t:"Camp (eat a ration, restore)", fn:()=>{
            useFromInv("Ration",1);
            game.player.stam=clamp(game.player.stam+45,0,maxStam());
            game.player.hp=clamp(game.player.hp+4,0,game.player.maxhp);
            advanceWeeks(1);
            say(["Cold food, colder company. The dark watches you chew.","Stamina +45, HP +4."]);
            mapOpen=false; saveGame(); } }]:[]),
        { t:"Study the walls (map)", fn:()=>{ mapOpen=true; } },
        { t:"Feel your wounds", fn:()=>{
            const p=game.player;
            say(p.wounds.length? ["Your "+p.wounds.join(" and your ")+((p.wounds.length>1)?" throb":" throbs")+" in time with your pulse. A flesh-setter would be wise."]
                               : ["Holding together. For Vharn, that is a good day."]); } },
        { t:"Nothing", fn:()=>{} }
      ]);
}
function leaveDungeon(){
  game.dungeon=null; mapOpen=false; game.state="base";
  advanceWeeks(1);
  const p=game.player;
  const lines=["You climb out into Vharn drizzle. The city resumes ignoring you, which is its way of saying hello.",
       "Delves: "+p.delves+"  |  kills: "+p.kills+"  |  purse: "+fmt(p.gold)];
  const news=drainNews();
  if (news.length) lines.push("Word from the surface:", ...news);
  say(lines, ()=>saveGame());
}
function updateCombat(){
  const c=game.combat;
  if (!c) return;
  if (c.intro>0){
    if (yesTap()||tap("x")) c.intro=0;
    else c.intro--;
    return;
  }
  if (c.dice){
    if (game.player.hp<=game.player.maxhp*0.25 && worldTick%26===0) sfx("heart");
    rollDiceFrame(); return;
  }
  if (c.turn==="player"){
    const acts=quickActs();
    if (tap("arrowup")||tap("w")) c.choice=(c.choice+acts.length-1)%acts.length;
    if (tap("arrowdown")||tap("s")) c.choice=(c.choice+1)%acts.length;
    if (yesTap()) combatPlayerAction(acts[c.choice]);
  } else if (c.turn==="won"){
    if (c.kcine>0){ c.kcine--; if (yesTap()) c.kcine=Math.min(c.kcine,3); return; }
    if (yesTap()) endCombat();
  }
}
function updateDead(){
  if (!yesTap()) return;
  if (game.state==="legacy"){ continueAsChild(); return; }
  game=null; titleTick=0; mapOpen=false;
}
/* the heir takes over the save */
function continueAsChild(){
  const old=game.player, c=old.child;
  if (!c){ game=null; return; }
  if (old.spouse) old.spouse.parentOfYou=true;
  const spark=c.spark;
  game.player={
    name:c.name,
    str: Math.max(2, Math.floor(old.str*0.5)+Math.ceil(spark/3)),
    agi: Math.max(2, Math.floor(old.agi*0.5)+Math.ceil(spark/3)),
    wit: Math.max(2, Math.floor(old.wit*0.5)+Math.ceil(spark/4)),
    wll: Math.max(2, Math.floor(old.wll*0.5)+Math.ceil(spark/2)),
    hp:22, maxhp:22, stam:100, maxstam:100,
    gold:15,
    weapon: old.weapon.d>2? {n:old.weapon.n, d:old.weapon.d} : {n:"Rusted Knife", d:2},
    armor: {n:old.armor.n, a:old.armor.a},
    inv:[{n:"Ration", v:8, qty:2, kind:"food"},{n:"Bandage", v:10, qty:1, kind:"heal"}],
    wounds:[],
    house:old.house, upgrades:old.upgrades.slice(),
    spouse:null, partner:null, tryChild:0, child:null,
    kills:0, delves:0, deep:0,
    streak:0, gambleWins:0, lastAction:null,
    titles:[], killsByKind:{}, bestiary:old.bestiary, maneuvers:[]
  };
  game.week=c.weeks;
  game.dungeon=null; game.combat=null; game.base={px:20,py:15};
  closeUI(); game.state="base"; mapOpen=false;
  game.flags.news=[];
  cityGrid=buildCity();
  say(["The lamp is relit. "+game.player.name+" of the leaning house takes up the knife at "+Math.floor(game.week/52)+" years old.",
       "Strong as half a dead parent and some of their habits. The house stands because somebody kept paying for it.",
       "The Openings will remember your old name soon enough. The Gate has not moved."], ()=>saveGame());
}
function updateUI(){
  const u=game.ui;
  if (u.mode==="text"){
    if (yesTap()){
      u.dialog.i++;
      if (u.dialog.i>=u.dialog.lines.length){
        const cb=u.onclose; closeUI();
        if (cb) cb();
      }
    }
  } else if (u.mode==="menu"){
    const m=u.menu;
    if (tap("arrowup")||tap("w")) m.sel=(m.sel-1+m.opts.length)%m.opts.length;
    if (tap("arrowdown")||tap("s")) m.sel=(m.sel+1)%m.opts.length;
    if (yesTap()){
      const fn=m.opts[m.sel].fn;
      closeUI();
      fn();
    } else if (noTap()){
      const oc=u.oncancel;
      closeUI();
      if (oc) oc();
    }
  }
}

/* ---------------- main loop ---------------- */
function frame(){
  uiHits=[];
  worldTick++;
  pollGamepad();
  updateAmbience();
  updateBattleMusic();
  if (critPulse>0) critPulse--;
  if (gDice){ rollDiceFrame(); }
  else if (!game) updateTitle();
  else {
    if (game.state==="base") updateBase();
    else if (game.state==="dungeon") updateDungeon();
    else if (game.state==="combat") updateCombat();
    else if (game.state==="dead"||game.state==="legacy") updateDead();
  }
  const shk = (shakeT>0 || critPulse>0) && !gDice;
  if (shk){
    ctx.save(); ctx.translate(irnd(3)-1, irnd(3)-1);
    if (critPulse>0 && ctx.scale){
      const ps=1+critPulse/90;
      ctx.translate(W/2,H/2); ctx.scale(ps,ps); ctx.translate(-W/2,-H/2);
    }
  }
  if (!game) renderTitle();
  else {
    if (game.state==="base") drawBase();
    else if (game.state==="dungeon") drawDungeon();
    else if (game.state==="combat") renderCombat();
    else if (game.state==="dead"||game.state==="legacy") renderDead();
    if (game.dungeon && mapOpen && game.state==="dungeon") drawMinimap();
    if (game.state!=="combat" && game.state!=="dead" && !mapOpen) renderUI();
  }
  if (shk) ctx.restore();
  if (gDice) drawGambleBoard();
  drawJuice();
  if (hintT>0 && hintMsg){
    hintT--;
    ctx.font="bold 9px 'Courier New',monospace"; ctx.textBaseline="top";
    const hm=hintMsg.slice(0,52), hw=ctx.measureText(hm).width;
    ctx.fillStyle="rgba(8,6,10,0.92)"; ctx.fillRect(W/2-hw/2-3, 1, hw+6, 14);
    txt(hm, W/2-hw/2, 3, "#e0b95a");
  }
  endFrame();
}
function loop(){ frame(); requestAnimationFrame(loop); }
loop();
