        ...(countItem("Ration")? [{ t:"Share a ration & trade news", fn:()=>{
            useFromInv("Ration",1); p.stam=clamp(p.stam+10,0,maxStam());
            const hint=pick(OPENINGS);
            say(["You split a ration in the dark. "+who+" trades you a rumor about "+hint.name+".",
                 "Good company. Rare down here."]);
            saveGame(); } }]:[]),
        { t:"Trade - sell loot at a good price", fn:()=>{
            const lo=p.inv.filter(i=>i.kind==="loot");
            if (!lo.length){ say(["Nothing worth a trade."]); return; }
            const it=lo[0]; const val=Math.round(it.v*1.3);
            p.gold+=val; p.inv.splice(p.inv.indexOf(it),1);
            say([who+" pays "+fmt(val)+" for your "+it.n+". \"Ward 6 collectors. Don't ask.\""]);
            saveGame(); } },
        { t:"Part ways", fn:()=>{} }
      ]);
    });
  } else if (kind<0.75){
    showText(["A voice from an alcove: \"Toll. Thirty percent. Or we discuss the alternative.\"",
              "Numbers resolve into bodies. You are in the math now."], ()=>{
      showMenu(who.toUpperCase()+"'S BOYS", [
        { t:"Pay the toll", fn:()=>{
            const heavy=p.gold>=300;
            let toll=Math.floor(p.gold*(heavy?0.4:0.3));
            let line=who+" counts your coin with professional boredom. \"Lovely doing business.\"";
            if (heavy) line=who+" weighs your purse a moment longer than needed. \"You looked heavy.\"";
            const lo2=p.inv.filter(i=>i.kind==="loot");
            if (p.gold<40 && lo2.length){
              const it=lo2[lo2.length-1]; toll=0; p.inv.splice(p.inv.indexOf(it),1);
              line=who+" shrugs at your near-empty purse and takes the "+it.n+" instead. \"In kind, then.\"";
            }
            p.gold-=toll;
            say([line]); saveGame(); } },
        { t:"Talk them down (Wits)", fn:()=>{
            if (check("wit",11)) say(["You convince them you are cursed - inhabited by something with opinions. Nobody wants that cargo."]);
            else say(["They laugh. Then they beat the toll out of you, and a little extra."], ()=>{
              hurt(4,null); p.gold=Math.floor(p.gold*0.6); });
            saveGame(); } },
        { t:"Fight", fn:()=>{ startCombat({ n:who+"'s Cutter", mhp:12+game.dungeon.tierNow*4, hp:12+game.dungeon.tierNow*4,
            atk:2+game.dungeon.tierNow, tr:null, artSeed:irnd(2147483647), human:true }); } },
        { t:"Run (Agility)", fn:()=>{
            if (check("agi",10)) say(["You melt into the dark. Footsteps curse behind you."]);
            else say(["They catch your pack strap."], ()=>{ hurt(2,null); p.gold=Math.floor(p.gold*0.85); });
            saveGame(); } }
      ]);
    });
  } else {
    showText([who+" blocks the corridor, blade drawn, grinning like it is a festival.",
              "\"Beat me and take my kit. Lose and I take yours. Rules are rules.\""], ()=>{
      showMenu(who.toUpperCase(), [
        { t:"Accept the duel", fn:()=>{ startCombat({ n:who+" the Duelist", mhp:14+game.dungeon.tierNow*3, hp:14+game.dungeon.tierNow*3,
            atk:2+game.dungeon.tierNow, tr:null, artSeed:irnd(2147483647), human:true, duel:true }); } },
        { t:"Talk it out (Wits)", fn:()=>{
            if (check("wit",9)){ say(["You point out that screaming draws the things with many opinions.",
              who+" concedes and shares a flask."]); p.stam=clamp(p.stam+10,0,maxStam()); }
            else say(["\"Coward, then.\" The word follows you deeper than the corridor does."]); } },
        { t:"Walk away", fn:()=>{ stepBack(); } }
      ]);
    });
  }
}

/* ----- the Kindly Fellows: money has a collection schedule ----- */
function sharkTrigger(){
  const fl=game.flags;
  if (fl.loan) return;
  fl.sharkDrip=(fl.sharkDrip||0)+1;
}
function sharkMeet(){
  const p=game.player, fl=game.flags;
  fl.sharkDrip=0;
  sfx("click");
  showMenu("A PATIENT MAN", [
    { t:"Take the loan (100 gold now; 300 owed)", fn:()=>{
        p.gold+=100; fl.loan={ owe:300, took:game.week };
        say(["Coins, counted out slow, like a kindness he plans to describe later.",
             "\"The Fellows collect the day you come up. Three hundred. Bring it breathing.\""],
            ()=>saveGame()); } },
    { t:"Refuse him", fn:()=>{
        say(["He does not move, exactly. \"Someday soon, then. Your face is easier to remember than most.\""],
            ()=>saveGame()); } }
  ]);
}
function fellowsBeat(owe){
  const p=game.player;
  hurt(Math.max(1,Math.ceil(p.maxhp*0.10)), "The Fellows' hands are patient and professional.");
  if (game.state==="dead") return;
  const fee=Math.max(1,Math.round(p.gold*0.2));
  p.gold=Math.max(0,p.gold-fee);
  say(["They take "+fee+"g as the waiting fee. It is not called interest. It is not called anything.",
       "(-"+owe+"g still owed. They will be outside the Gate the day you climb out.)"], ()=>fellowsMenu(owe));
}
function fellowsMenu(owe){
  const p=game.player;
  const pay=()=>{ p.gold-=owe; game.flags.loan=null;
      say(["Coins across a palm, counted twice, pocketed slow.",
           "\"The Fellows mark it paid. A rarity: a closed line in their book.\""], ()=>saveGame()); };
  const opts=[];
  if (p.gold>=owe) opts.push({ t:"Pay the "+owe+"g you owe", fn:pay });
  opts.push({ t:"Talk your way into paying later (Wits)", fn:()=>{
      if (check("wit",11)){
        say(["Your story about the weather, the market, the next dive - and it buys you this once, exactly one more dive.",
             "\"Later, then. The Fellows keep a patient book.\""], ()=>saveGame());
      } else fellowsBeat(owe); } });
  opts.push({ t:"Take the beating", fn:()=>fellowsBeat(owe) });
  showMenu("THE KINDLY FELLOWS WAIT", opts);
}
function fellowsCollect(){
  const owe=game.flags.loan.owe;
  sfx("growl");
  say(["Three shy gentlemen wait outside the Gate of Openings. It is collection day.",
       "The one holding the ledger-book taps the cover: "+owe+"g, as agreed."], ()=>fellowsMenu(owe));
}

/* ----- floor landlord events ----- */
function flagsPacts(){ if (!game.flags.pacts || typeof game.flags.pacts!=="object") game.flags.pacts={}; return game.flags.pacts; }
function flagsErrands(){ if (!game.flags.errands || typeof game.flags.errands!=="object") game.flags.errands={}; return game.flags.errands; }
function miniFoe(B,tierNow){
  const t=clamp(tierNow,1,3)-1;
  const hp=ngHp(Math.round(B.hp[t]*(0.9+Math.random()*0.25)));
  return { n:B.name, mhp:hp, hp:hp, atk:B.atk[t]+ngAtkBump(), tr:null, artSeed:irnd(2147483647), human:false, bossArt:B.id };
}
function grantBossLore(B,via){
  if (B.lore && !hasLore(B.lore)){ findLore(B.lore,via); return true; }
  const unf=LORE_FRAG.filter(f=>!hasLore(f.id));
  if (unf.length){ findLore(pick(unf).id,via); return true; }
  return false;
}
function repOf(B){ return (game.flags.bossRep||{})[B.id]||0; }
function bumpRep(B){ if (!game.flags.bossRep) game.flags.bossRep={}; game.flags.bossRep[B.id]=(game.flags.bossRep[B.id]||0)+1; }
function bossReqOk(B){
  const p=game.player;
  if (B.id==="auditor") return p.gold>=25;
  if (B.id==="veins"){ const met=Object.keys(p.bestiary||{}).filter(n=>p.bestiary[n]&&p.bestiary[n].met).length; return met>=4; }
  if (B.id==="drowse") return p.wounds.length+(p.ills? p.ills.length:0)>=2;
  if (B.id==="lamp") return countItem("Ration")>0 || (game.flags.candles||0)>=3;
  return true;
}
function bossErrandState(B){
  const er=flagsErrands()[B.id]; if (!er) return "none";
  if (er.kind==="kill") return er.have>=er.need? "ready":"active";
  return countItem(er.item)>0? "ready":"active";
}
function bossOptions(ev,B){
  const p=game.player, opts=[];
  if (B.kind==="beast"){
    opts.push({ t:"Attack it", d:"It would rather not be spoken to.", fn:()=>{ ev.done=true; startCombat(miniFoe(B,game.dungeon.tierNow)); } });
    opts.push({ t:"Back out of its room slowly", fn:()=>{ ev.done=false; stepBack(); } });
    return opts;
  }
  if (B.kind==="sentient" && !repOf(B)){
    const reqOk0=bossReqOk(B);
    opts.push({ t: reqOk0? "Speak with it":"Speak with it ("+B.reqText+")",
      d: reqOk0? "Its attention is a weather. You step under it." : "It has not decided you are real yet. Push it and learn.",
      fn:()=>{
      ev.talked=true;
      if (!reqOk0){
        if (Math.random()<0.70){
          say(B.reqDeny, ()=>{ ev.done=true; startCombat(miniFoe(B,game.dungeon.tierNow)); });
        } else {
          say(["It looks through you, unhurried, the way weather does, and decides you are tomorrow's problem, not today's."],
              ()=>showMenu(B.name.toUpperCase(), bossOptions(ev,B)));
        }
        return;
      }
      if (check(B.stat,B.dc)){
      bumpRep(B);
      say(B.talk, ()=>{
        const got=grantBossLore(B,"the "+cap(B.id)+"'s strange arithmetic");
        const back=got? ["It considers you a little longer, in whatever way such things consider.",
                          "Something true was handed across the gap, in whatever passes for hands, and quietly pocketed by your mind."]
                      : ["It considers you a little longer, in whatever way such things consider.",
                          "It has said its say; the rest of it is figures you cannot read."];
        say(back, ()=>showMenu(B.name.toUpperCase(), bossOptions(ev,B)));
      });
      } else if (B.harsh){
      say(B.talkFail, ()=>{ ev.done=true; startCombat(miniFoe(B,game.dungeon.tierNow)); });
    } else {
      say(B.talkFail, ()=>{ showHint("It dims, wounded, and keeps its own counsel."); showMenu(B.name.toUpperCase(), bossOptions(ev,B)); });
    }
  } });
  }
  if (B.trade && repOf(B)>=1 && !ev.traded && countItem(B.trade.want)>0){
    opts.push({ t:"Trade: "+B.trade.want+" for "+fmt(B.trade.giveG), fn:()=>{
      ev.traded=true; useFromInv(B.trade.want,1); p.gold+=B.trade.giveG; sfx("gain");
      say(B.trade.line, ()=>showMenu(B.name.toUpperCase(), bossOptions(ev,B))); } });
  }
  const st=bossErrandState(B);
  if (B.errand && st==="none" && repOf(B)>=1 && !flagsPacts()[B.id]){
    opts.push({ t:"Hear its errand", fn:()=>{
      const er=B.errand.kind==="kill"? {kind:"kill",need:B.errand.need,have:0} : {kind:"item",item:B.errand.item};
      flagsErrands()[B.id]=er;
      say(B.errand.assign, ()=>showMenu(B.name.toUpperCase(), bossOptions(ev,B))); } });
  } else if (B.errand && st==="active"){
    const pr=B.errand.kind==="kill"? flagsErrands()[B.id].have+"/"+flagsErrands()[B.id].need : "not in hand yet";
    opts.push({ t:"Ask about the errand ("+pr+")", fn:()=>{
      say(B.errand.kind==="kill"? ["It points, with several of itself, at everywhere the small hungry things are. The tally stands. It waits."]
                                : ["Its want does not change while it isn't counting you. Bring the "+B.errand.item+". It has already budgeted for this."],
        ()=>showMenu(B.name.toUpperCase(), bossOptions(ev,B))); } });
  }
  opts.push({ t:"Attack it", d:"Whatever world it lives in, your knife lives in this one.", fn:()=>{ ev.done=true; startCombat(miniFoe(B,game.dungeon.tierNow)); } });
  opts.push({ t:"Leave it to its own little world", fn:()=>{ ev.done=false; stepBack(); } });
  return opts;
}
function bossDeliver(ev,B){
  const er=flagsErrands()[B.id], p=game.player;
  if (er.kind==="item") useFromInv(er.item,1);
  delete flagsErrands()[B.id];
  flagsPacts()[B.id]=1;
  p.gold+=B.errand.g; sfx("gain");
  const out=B.errand.done.slice();
  if (er.kind==="kill") p.hp=clamp(p.hp+10,0,p.maxhp);
  const got=grantBossLore(B,"errand complete, honored below");
  if (got) out.push("And, as if renting space in another world's mind were a trade good - a truth comes with the wage.");
  out.push("You are, from this floor on, an arrangement. The dark goes easier on known debtors.");
  say(out, ()=>saveGame());
}
function bossFriendly(ev,B){
  ev.done=true;
  const p=game.player;
  const opts=[];
  opts.push({ t:"Sit with it a while", fn:()=>{
    say(B.pact, ()=>showMenu(B.name.toUpperCase(), bossFriendlyOpts(ev,B))); } });
  if (B.trade && !ev.traded && countItem(B.trade.want)>0){
    opts.push({ t:"Trade: "+B.trade.want+" for "+fmt(B.trade.giveG), fn:()=>{
      ev.traded=true; useFromInv(B.trade.want,1); p.gold+=B.trade.giveG; sfx("gain");
      say(B.trade.line, ()=>showMenu(B.name.toUpperCase(), bossFriendlyOpts(ev,B))); } });
  }
  opts.push({ t:"Take your leave", fn:()=>saveGame() });
  showText(B.pact, ()=>showMenu(B.name.toUpperCase(), opts));
}
function bossFriendlyOpts(ev,B){ return [ { t:"Leave it be", fn:()=>saveGame() } ]; }
function bossEvent(ev){
  const d=game.dungeon, p=game.player;
  const B=BOSS_BY_ID[ev.boss]; if (!B) return;
  const st=bossErrandState(B);
  if (B.kind==="sentient" && st==="ready"){ bossDeliver(ev,B); return; }
  if (flagsPacts()[B.id]){ bossFriendly(ev,B); return; }
  showText(B.intro, ()=>{
    ev.met=true;
    showMenu(B.name.toUpperCase(), bossOptions(ev,B));
  });
}

/* ----- checks, wounds, death ----- */
function check(stat, dc){
  const p=game.player;
  return d10()+p[stat]-p.wounds.length-(p.ills? p.ills.length : 0)>=dc;
}
function hurt(n, msg){
  const p=game.player;
  p.hp-=n;
  const lines=[];
  if (msg) lines.push(msg);
  lines.push("(-"+n+" HP. "+p.hp+"/"+p.maxhp+")");
  if (p.hp<=0){
    if (p.armor && p.armor.lastStand && !game.flags.plateUsed){ game.flags.plateUsed=true; p.hp=1; say(["Yes-Plate has never said no. It does not start today.","(held at 1 HP)"]); }
    else if (p.echo && !p.echoUsed){ p.echoUsed=true; p.hp=1; say(["The dream catches you. You died once already, and refused the second time.","(the Gate-Touched holds you at 1 HP)"]); }
    else if (p.gatekeeper){ p.hp=1; say(["The Gate refuses. Whatever finished you, it was not enough.","(+held at 1 HP)"]); }
    else { die("Something in "+(game.dungeon? game.dungeon.opening.name : "Jericho")+" finished you."); return; }
  }
  if (p.hp<=p.maxhp*0.3 && Math.random()<0.4){
    const limb=pick(["arm","ribs","leg","hand","eye"]);
    if (p.wounds.indexOf(limb)<0){
      p.wounds.push(limb);
      lines.push("A wound you will feel a long time: your "+limb+".");
    }
  }
  say(lines);
  saveGame();
}
const HEIR_NAMES=["Toma","Oren","Wren","Silla","Bray","Neme","Cass","Ivo","Petra","Lun","Mote","Ansk"];
function heirName(sp){
  const m=sp.name.match(/of the [A-Za-z' ]+/);
  return pick(HEIR_NAMES)+(m? " "+m[0].trim() : "");
}
function die(cause){
  const p=game.player;
  game.combat=null; deadPage=0;
  sfx("lose");
  setTimeout(()=>sfx("bell"), 700); setTimeout(()=>sfx("bell"), 1400); setTimeout(()=>sfx("bell"), 2100);
  const age=Math.floor(game.week/52);
  const ep=[ "You die at "+age+". "+cause ];
  if (p.child && p.child.weeks>=728){
    ep.push("But blood remembers: "+p.child.name+", "+Math.floor(p.child.weeks/52)+" years old, old enough to hate the doors and grown enough to open them.");
    ep.push("What is inherited: the house and its improvements, " + (p.weapon.d>2? "your "+p.weapon.n+", ":"") + "the leanings of your body, and a spark of "+p.child.spark+".");
    ep.push("The save stands. Jericho shrugs. The lamp is relit.");
    ep.push("[ENTER] take up the knife as "+p.child.name+".");
    game.state="legacy";
    game.flags.epilogue=ep;
    return;
  }
  if (p.spouse && !p.spouse.dead && !p.child){
    const sp=p.spouse;
    game.flags.posthumous=1;
    ep.push("The wax is barely dry on your name when the midwife climbs the stair: "+sp.name.split(" ")[0]+" is with child. Yours. Counted back, it was conceived the same week you went down.");
    p.child={ name:heirName(sp), weeks:0, spark:2 };
    for (let yr=0; yr<17; yr++) advanceWeeks(52);
    game.townfolk=[];
    const news=drainNews();
    if (news.length){
      const crownish=news.filter(x=>/capital|crown|Soldier|banner|regent|the king|coup|war|houses/i.test(x));
      const local=news.filter(x=>!/capital|crown|Soldier|banner|regent|the king|coup|war|houses/i.test(x));
      ep.push("The seventeen years, briefly:");
      ep.push(...crownish.slice(0,4), ...local.slice(0,5));
    }
    if (sp.dead) ep.push(sp.name+" did not live to see it grown. Jericho raised "+p.child.name+" the way Jericho raises everything: on other people's leavings, and tough as boot leather.");
    else ep.push(sp.name+" ("+Math.floor(sp.ageWeeks/52)+" winters now) raised "+p.child.name+" on your stories and her own addenda, most of them unkind and all of them true.");
    ep.push("What is inherited: the house and its improvements, "+(p.weapon.d>2? "your "+p.weapon.n+", ":"")+"the leanings of your body, and a spark of "+p.child.spark+" - bright, for a child conceived against arithmetic.");
    ep.push("[ENTER] take up the knife as "+p.child.name+".");
    game.state="legacy";
    game.flags.epilogue=ep;
    return;
  }
  game.state="dead";
  wipeSave();
  if (p.child){
    ep.push(p.spouse? p.spouse.name+" keeps the lamp lit for a child too young to hate the doors yet. The house leans. The city waits."
                    : "Your child will be told you drowned. In water, in dark - the story grows teeth either way.");
  } else if (p.spouse){
    ep.push(p.spouse.name+" sells your kit, keeps the house, and tells the Lamp you died rich. Widows survive Jericho. She will.");
  } else {
    ep.push("No family, no legend. The wall in the Guild Hall gains a name it will lose in a month's rain.");
  }
  ep.push("Kills "+p.kills+" | delves "+p.delves+" | deepest depth "+p.deep+" | "+fmt(p.gold)+" unspent");
  if (p.titles.length) ep.push("The wards knew you as: "+p.titles.join(", ")+".");
  ep.push("Press ENTER for a new name in the book.");
  game.flags.epilogue=ep;
}

/* ============================================================
   COMBAT
   ============================================================ */
function startCombat(enemy){
  enemy.maxhp=enemy.mhp||enemy.hp;
  const p=game.player;
  if (!p.bestiary[enemy.n]) p.bestiary[enemy.n]={ met:game.week, killed:false };
  const lore=BESTIARY_DESC[enemy.n] || (enemy.human? "A delver with a knife and an argument. Jericho breeds them faster than grief does." : "Something the city never bothered to name twice.");
  const origin= game.state==="base"? "base":"dungeon";
  if (game.dungeon){ const cf=curFloor(); if (cf && cf.lurker) cf.lurker=null; }
  game.combat={ e:enemy, log:[(String(enemy.n).indexOf("The ")===0? enemy.n : "The "+enemy.n)+" comes out of the dark.", lore], turn:"player", choice:0, guard:false, won:false, critKill:false, riposte:false, origin:origin };
  if (!foeKnown(enemy.n)) game.combat.log.push("You have never seen its like up close. Survive it, and you will know it.");
  game.combat.intro = foeKnown(enemy.n)? 0 : 46;
  sfx("growl");
  game.state="combat";
}
function clog(s){ const c=game.combat; if(!c) return; c.log.push(s); if (c.log.length>4) c.log.shift(); }
function playerAtk(){ const p=game.player; return p.weapon.d + irnd(3) + Math.floor(p.str/2); }
/* gear specials: props are attached to the carried pieces by name, so old
   saves and shop buys both resolve to full behaviour. */
const WPROPS={
  "Crude Spear":{ first:1 },          /* your first strike of a fight goes unanswered */
  "Bone Saw":{ bleed:1 },             /* the wound keeps working: -1 at each of its turns */
  "Wardriver Maul":{ stagger:1 },     /* 28% on a hit: the thing loses its beat */
  "Surgeon's Scalpel":{ precise:1 }   /* a crowned die reads +4 instead of +2 on the edge */
};
const APROPS={
  "Widow's Mail":{ under:1 },           /* a second slot: worn UNDER whatever else you wear */
  "Quilted Jerkin":{ fleebonus:2 },     /* light: +2 on the run for it */
  "Wall-Sergeant's Harness":{ fleepenalty:-1 }, /* heavy: -1 on the run for it */
  "Yes-Plate":{ lastStand:1 }           /* once a fight, refuses to let you fall */
};
function normGear(){
  const p=game.player;
  if (p.weapon && WPROPS[p.weapon.n]) for (const k in WPROPS[p.weapon.n]) p.weapon[k]=WPROPS[p.weapon.n][k];
  if (p.armor && APROPS[p.armor.n]) for (const k in APROPS[p.armor.n]) p.armor[k]=APROPS[p.armor.n][k];
  if (p.mail && APROPS[p.mail.n]) for (const k in APROPS[p.mail.n]) p.mail[k]=APROPS[p.mail.n][k];
  if (!p.mail) p.mail=null;
}
function isMail(it){ return !!it && ((it.under||0)===1 || !!(APROPS[it.n]&&APROPS[it.n].under)); }
function playerDef(){ const p=game.player; return p.armor.a+(p.mail? p.mail.a:0); }
function fleeMod(){ const p=game.player; const f=c=>c? (c.fleebonus||0)+(c.fleepenalty||0) : 0; return f(p.armor)+f(p.mail); }
function wProp(k){ const p=game&&game.player, w=p&&p.weapon; return w&&w[k]; }
/* ----- the dice (dopamine layer) ----- */
let worldTick=0;
function armDice(kind, seed){
  const c=game.combat;
  c.dice={ kind:kind, v1:1+irnd(6), v2:1+irnd(6), s1:6, s2:10, st1:false, st2:false, seed:seed };
  if (game.player.hp<=game.player.maxhp*0.25){ c.dice.s1=13; c.dice.s2=22; c.lastStand=true; }
  else if (c.lastStand && hasManeuver("calm")){ c.dice.s1=13; c.dice.s2=22; }
}
function stopDie(d,ix){
  const was= ix===0? d.st1 : d.st2;
  if (ix===0 && !d.st1) d.st1=true;
  if (ix===1 && !d.st2) d.st2=true;
  if (!was && d["v"+(ix+1)]===6 && game && game.combat){
    const c=game.combat;
    c.edge=Math.min(3,(c.edge||0)+1);
    addFloat("EDGE +"+c.edge, "#e0b95a", ix===0? 126: 186, 130);
  }
}
function rollDiceFrame(){
  const c=game.combat, d= gDice || (c&&c.dice);
  if (!d) return false;
  if (tap("z")||tap(" ")||tap("enter")){ if (!d.st1) stopDie(d,0); else stopDie(d,1); }
  if (tap("x")){ if (!d.st2) stopDie(d,1); else stopDie(d,0); }
  if (worldTick%4===0) sfx("tick");

function ac(){

function beep(freq, dur, type, vol, slide){
  if (!sndOn) return;
  const a=ac(); if (!a) return;

    const o=a.createOscillator(), g=a.createGain();
    o.type=type||"square"; o.frequency.value=freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, a.currentTime+dur);
    g.gain.setValueAtTime(vol||0.04, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime+dur);
  } catch(e){}
}

function stopDrone(){

    for (const n of droneNodes){
      try {
        n.g.gain.cancelScheduledValues(AC.currentTime);
        n.g.gain.setValueAtTime(n.g.gain.value||0.0001, AC.currentTime);
        n.g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+0.5);
        n.s.stop(AC.currentTime+0.6);

function startDrone(name, depth){
  stopDrone(); droneOpen=name; droneDepth=Math.min(6,depth||1);
  if (!sndOn) return;
  const a=ac(); if (!a) return;
  try {
    const f0= name.indexOf("Cessgate")>=0? 55 : name.indexOf("Ossuary")>=0? 65.41 : 49;
    const dep=droneDepth;
    const f= f0*Math.pow(0.94, dep-1);
    for (const v of [["sawtooth",1,0.02],["sine",1.007,0.03]]){
      const o=a.createOscillator(), g=a.createGain();
      o.type=v[0]; o.frequency.value=f*v[1];
      g.gain.setValueAtTime(0.0001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(v[2], a.currentTime+2.2);
      const lfo=a.createOscillator(), lg=a.createGain();
      lfo.type="sine"; lfo.frequency.value=0.11+Math.random()*0.22+(dep-1)*0.06; lg.gain.value=f*0.015;
      lfo.connect(lg); lg.connect(o.frequency);

      if (a.createBiquadFilter){
        const lp=a.createBiquadFilter(); lp.type="lowpass";
        lp._d=Math.max(230, 430-40*(dep-1));

        g.connect(lp); tail=lp;

      }
      o.connect(g); tail.connect(a.destination);
      o.start(); lfo.start();
      droneNodes.push({s:o,g:g,main:true,base:v[2]},{s:lfo,g:lg});
    }
  } catch(e){ if (droneNodes.length) stopDrone(); }
}
function startRain(){
  if (!sndOn || rainNodes) return;
  const a=ac(); if (!a || !a.createBuffer) return;
  try {
    const len=Math.floor(2*a.sampleRate), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const s=a.createBufferSource(); s.buffer=buf; s.loop=true;
    const g=a.createGain();
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.012, a.currentTime+1.4);
    if (a.createBiquadFilter){
      const lp=a.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=900;
      s.connect(lp); lp.connect(g);
    } else s.connect(g);
    g.connect(a.destination); s.start();
    rainNodes={s:s,g:g};
  } catch(e){ rainNodes=null; }
}
function stopRain(){
  if (!rainNodes) return;

/* taking a stair down: the whole drone holds its breath for a moment,
   sinking then rising again like an exhale you hear in stone */
function droneHush(){
  const a=AC; if (!a) return;
  let touched=false;
  for (const n of droneNodes){
    if (!n.main||!n.g) continue;
    try {
      const g=n.g.gain, t=a.currentTime, base=n.base||0.02;
      g.cancelScheduledValues(t);
      const cur=Math.max(0.0001, g.value||base);
      g.setValueAtTime(cur, t);
      g.exponentialRampToValueAtTime(Math.max(0.0001,base*0.1), t+0.3);
      g.exponentialRampToValueAtTime(base, t+2.4);

function updateBattleMusic(){

  else if (hbM.on){ hbM.tail++; if (hbM.tail>460){ hbM.on=false; return; } }
  else return;
  let want, vol, ease;
  if (fighting){
    want=heartIv();
    ease=0.035;
    vol=0.078+0.05*(1-clamp(game.player.hp/game.player.maxhp,0,1));
  } else {
    // the fight is over: the heart settles in stages - slows past calm,
    // every beat quieter and further apart, until the ears accept the silence
    const tt=clamp(hbM.tail/460,0,1);
    want=66+150*Math.pow(tt,1.6);
    ease=0.05;
    vol=0.085*(1-tt*tt);
  }
  if (hbM.jolt>0){ hbM.jolt--; want*=0.55; }
  hbM.iv += (want-hbM.iv)*ease;
  hbM.acc++;
  if (hbM.acc>=Math.round(hbM.iv)){
    hbM.acc=0;
    hbThrob=6;
    heartThump(vol);
  }
}
function drawHeartVignette(){
  if (!hbM.on || hbThrob<=0) return;
  const a=(0.055*(hbThrob/6)).toFixed(3);
  const vg=ctx.createRadialGradient(W/2,H/2,80,W/2,H/2,210);
  vg.addColorStop(0,"rgba(0,0,0,0)");
  vg.addColorStop(1,"rgba(122,18,30,"+a+")");
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}
/* greed is a heartbeat too: quicker, thinner, higher - it rises in your
   ears as you close on treasure you can actually see */
const heartEcho={ on:false, iv:70, acc:0, dist:9 };
function updateTreasureEcho(){
  heartEcho.on=false;
  if (!game || !sndOn || hbM.on || game.state!=="dungeon" || game.ui.mode){ heartEcho.acc=0; return; }
  const d=game.dungeon; if (!d) return;
  const f=curFloor(); if (!f) return;
  let best=9;
  for (const ev of f.events){
    if (ev.done || (ev.type!=="loot" && ev.type!=="bait" && ev.type!=="shrine")) continue;
    if (!f.seen.has(ev.x+","+ev.y)) continue;
    const dd=Math.abs(ev.x-d.px)+Math.abs(ev.y-d.py);
    if (dd<best) best=dd;
  }
  if (best>8) return;
  heartEcho.on=true; heartEcho.dist=best;
  if (!game.flags) game.flags={};
  if (!game.flags.earsHinted){
    game.flags.earsHinted=true;
    showHint("Your ears start to ring. Something worth having is close.");
  }
  heartEcho.iv=28+best*4.5;
  heartEcho.acc++;
  if (heartEcho.acc>=Math.round(heartEcho.iv)){
    heartEcho.acc=0;
    const vol=0.016+0.02*(1-best/8);
    beep(84, 0.09, "sine", vol);
    beep(168, 0.09, "sine", vol*0.55);
    setTimeout(()=>{ beep(63, 0.1, "sine", vol*0.7); beep(126, 0.1, "sine", vol*0.4); }, 90);
  }
}
function updateAmbience(){
  if (!game || !sndOn){ stopDrone(); stopRain(); return; }
  if (game.state==="dungeon" || (game.state==="combat" && game.dungeon)){
    stopRain();
    const nm=game.dungeon.opening.name;
    if (droneOpen!==nm || droneDepth!==Math.min(6,game.dungeon.depth)) startDrone(nm, game.dungeon.depth);
    const fl=curFloor();
    if (fl && fl.lurker){
      const dd=game.dungeon;
      const dist=Math.abs(fl.lurker.x-dd.px)+Math.abs(fl.lurker.y-dd.py);
      if (dist<=8){ if (worldTick%11===0 && Math.random()<(8-dist)*0.03) sfx("creak"); }
      else if (worldTick%23===0 && Math.random()<0.02) sfx("creak");
    }
    if (fl && droneLPs.length){
      let sd=8;
      for (const ev of fl.events){
        if (ev.type!=="secret" || ev.done) continue;
        const dd=Math.abs(ev.x-game.dungeon.px)+Math.abs(ev.y-game.dungeon.py);
        if (dd<sd) sd=dd;
      }
      for (const lp of droneLPs){
        const tgt= lp._d * (sd<7? (0.5+sd*0.05) : 1);
        lp.frequency.value += (tgt-lp.frequency.value)*0.05;
      }
    }
  } else if (game.state==="base" || game.state==="home"){
    stopDrone(); startRain();
  } else {
    stopDrone(); stopRain();
  }
}
function voiceSfx(who){
  if (!sndOn) return;
  const a=ac(); if (!a) return;
  const semis=[0,3,5,7,10,12,15,17];
  let h=0; for (let i=0;i<who.length;i++) h=(h*31+who.charCodeAt(i))>>>0;
  const base=200+(h%200);
  for (let i=0;i<3;i++){
    const st=semis[(h>>>(i*4))%semis.length];
    setTimeout(()=>beep(base*Math.pow(2,st/12), 0.09, "triangle", 0.028), i*110);
  }
}

function freeTile(f){
  const d=game.dungeon;
  for (let tries=0; tries<80; tries++){
    const x=1+irnd(f.w-2), y=1+irnd(f.h-2);
    if (f.grid[y][x]==="#") continue;
    if (f.events.some(e=>e.x===x&&e.y===y)) continue;
    if (d && x===d.px && y===d.py) continue;
    return [x,y];
  }
  return null;
}

function txt(s,x,y,col,big){
  ctx.font=(big? "bold 11px":"bold 9px")+" 'Courier New', monospace";
  ctx.textBaseline="top";
  ctx.fillStyle="#0a0710";
  ctx.fillText(s,x+1,y); ctx.fillText(s,x-1,y); ctx.fillText(s,x,y+1); ctx.fillText(s,x,y-1);
  ctx.fillStyle=col||PAL.bone;
  ctx.fillText(s,x,y);
}
function box(x,y,w,h,fill,border){
  ctx.fillStyle=fill||"rgba(10,7,12,0.94)";
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=border||PAL.rust;
  ctx.lineWidth=1;
  ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}
function spr(art, map, x, y){
  for (let r=0;r<art.length;r++) for (let c=0;c<art[r].length;c++){
    const ch=art[r][c];
    if (ch==="."||ch===" ") continue;
    ctx.fillStyle=map[ch]||PAL.bone;
    ctx.fillRect(x+c, y+r, 1, 1);
  }
}
/* ----- CE1-style humanoid sprites: hand-authored string arts, dark outer
   outline added by the renderer, big heads, few-tone garments, signature gear.
   Feet anchor on the tile's bottom row; the outline spills one px around. ----- */
function shadeHex(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,Math.round(((n>>16)&255)*f)), g=Math.min(255,Math.round(((n>>8)&255)*f)), bl=Math.min(255,Math.round((n&255)*f));
  return "#"+((r<<16)|(g<<8)|bl).toString(16).padStart(6,"0");
}
const SPRO_OUT="#15101b";
function sprO(art, map, x, y, scale, flip){
  const s=scale||1, w=art[0].length, h=art.length;
  const filled=(r,c)=>{ if(r<0||r>=h||c<0||c>=w) return false; const ch=art[r][c]; return ch!=="."&&ch!==" "; };
  for (let r=-1;r<=h;r++) for (let c=-1;c<=w;c++){
    if (filled(r,c)) continue;
    if (filled(r-1,c)||filled(r+1,c)||filled(r,c-1)||filled(r,c+1)){
      ctx.fillStyle=SPRO_OUT; ctx.fillRect(x+c*s, y+r*s, s, s);
    }
  }
  for (let r=0;r<h;r++) for (let c=0;c<w;c++){
    const ch0=art[r][c];
    if (ch0==="."||ch0===" ") continue;
    const ch=flip? art[r][w-1-c] : ch0;
    ctx.fillStyle=map[ch]||PAL.bone;
    ctx.fillRect(x+c*s, y+r*s, s, s);
  }
}
/* draw an anchored person: 12-wide art, feet on the tile bottom row */
function sprP(art, map, x, y, scale, flip){ sprO(art, map, x-2, y+8-art.length, scale||1, flip); }

/* abomination generator - every horror looks different, seeded */
function drawAbomination(cx,cy,seed,scale){
  const rg=mulberry(seed);
  const fs=["#6e2f38","#7c3540","#54303a","#8a3a44","#5f4a3a","#74504c"];
  const body=fs[Math.floor(rg()*fs.length)];
  const dark="#2a141c";
  const S=scale||2.0;
  const Wd=Math.round(20*S), Hd=Math.round(17*S);
  for (let r=0;r<Hd;r++){
    const t=r/Hd;
    const wob=1+0.35*Math.sin((r+seed%13)*0.9);
    let ww=Math.round(Math.sin(Math.PI*t)*Wd*0.5*wob);
    if (ww<=0) continue;
    ctx.fillStyle=body;
    ctx.fillRect(cx-ww, cy+r, ww*2, 1);
    if (r%4===0){ ctx.fillStyle=dark; ctx.fillRect(cx-ww+Math.floor(rg()*ww), cy+r, Math.ceil(ww*(0.2+rg()*0.3)), 1); }
  }
  const legs=3+Math.floor(rg()*5);
  ctx.fillStyle=body;
  for (let i=0;i<legs;i++){
    const lx=cx-Wd*0.4+rg()*Wd*0.8;
    const len=3+Math.floor(rg()*5);
    ctx.fillRect(Math.round(lx), cy+Hd-1, 1, len);
    ctx.fillRect(Math.round(lx)+(rg()<0.5?-1:1), cy+Hd+len-1, 1, 2);
  }
  const eyes=1+Math.floor(rg()*4);
  for (let i=0;i<eyes;i++){
    const ex=cx-Math.round(Wd*0.4)+Math.floor(rg()*Wd*0.8);
    const ey=cy+2+Math.floor(rg()*Hd*0.4);
    ctx.fillStyle=rg()<0.5? PAL.gold : "#d8d3c0";
    ctx.fillRect(ex,ey,Math.max(1,1+Math.floor(rg()*2)),1);
    if (rg()<0.5){ ctx.fillStyle=dark; ctx.fillRect(ex,ey+1,1,1+Math.floor(rg()*3)); }
  }
  const mouths=1+Math.floor(rg()*2);
  for (let i=0;i<mouths;i++){
    const mx=cx-Math.floor(Wd*0.3)+Math.floor(rg()*Wd*0.6);
    const my=cy+Math.floor(Hd*0.45)+Math.floor(rg()*Hd*0.3);
    const mw=2+Math.floor(rg()*4);
    ctx.fillStyle=dark;
    ctx.fillRect(mx,my,mw,1);
    ctx.fillStyle=PAL.bone;
    for (let t2=0;t2<mw;t2++){ if (rg()<0.6) ctx.fillRect(mx+t2,my-1,1,1); }
  }
  if (rg()<0.6){
    ctx.fillStyle=PAL.bone;
    for (let i2=-3;i2<=3;i2++) ctx.fillRect(cx+i2*2, cy-2-(3-Math.abs(i2)), 1, 2);
  }
}

/* ----- base render ----- */
function blobShadow(sx,sy,wd,al){
  ctx.fillStyle="rgba(0,0,0,"+(al===undefined?0.30:al)+")";
  ctx.beginPath();
  ctx.ellipse(sx,sy,wd/2,Math.max(1.2,wd/5),0,0,Math.PI*2);
  ctx.fill();
}
function glow(cx,cy,r,rgb,base){
  const g=ctx.createRadialGradient(cx,cy,1,cx,cy,r);
  const a=base+0.035*Math.sin(worldTick/11+cx*0.7);
  g.addColorStop(0,"rgba("+rgb[0]+","+rgb[1]+","+rgb[2]+","+a.toFixed(3)+")");
  g.addColorStop(1,"rgba("+rgb[0]+","+rgb[1]+","+rgb[2]+",0)");
  ctx.save(); ctx.globalCompositeOperation="lighter";
  ctx.fillStyle=g; ctx.fillRect(cx-r,cy-r,r*2,r*2);
  ctx.restore();
  ctx.globalCompositeOperation="source-over";
}
/* every lamp stands clear of every building's cast shadow - a lamp post
   cannot stand in a shadow (standing design law; verified by the lamp
   geometry check against all 18 shadow ellipses, home included) */
/* lamps stand BESIDE the roadways (never on the cobbles or the plaza), clear
   of every building's cast shadow - a lamp post cannot stand in a shadow, nor
   in the middle of the walk (standing design law; geometric check: lamps vs
   18 shadow ellipses, all building walls, and the road/plaza tiles) */
const LAMPS=[
  [18,3],[18,11],[18,17],[16,27],[23,11],[23,15],
  [46,5],[46,11],[46,17],[46,25],[8,24],[31,21],[41,22],
  [10,11],[36,12],[52,11],[9,27],[31,30],[56,27]
];
/* ----- the city keeps house: lamplight pools, street trash, cooking fires ----- */
let TRASH=null, trashMap=null, cityLight=null, FIRE_SPOTS=null;
function computeCityProps(){
  trashMap=new Map(); TRASH=[];
  const rndT=mulberry(9137);
  for (let y=1;y<CH-1;y++) for (let x=1;x<CW-1;x++){
    if (cityGrid[y][x]!==".") continue;
    const r1=rndT();
    if (r1<0.048){
      const kind=Math.floor(rndT()*5);
      TRASH.push([x,y,kind]);
      trashMap.set(x+","+y,kind);
    }
  }
  cityLight=[];
  for (let y=0;y<CH;y++) cityLight.push(new Array(CW).fill(0));
  for (const lp of LAMPS){
    for (let y=Math.max(0,lp[1]-4);y<=Math.min(CH-1,lp[1]+4);y++)
      for (let x=Math.max(0,lp[0]-4);x<=Math.min(CW-1,lp[0]+4);x++){
        const dd=Math.hypot(x-lp[0],y-lp[1]);
        const b=Math.max(0,1-dd/3.8);
        if (b>cityLight[y][x]) cityLight[y][x]=b;
      }
  }
  FIRE_SPOTS=[];
  for (const id of ["tavern","market","guild","wash","tallow"]){
    const bl=BUILDINGS.find(b2=>b2.id===id);
    if (!bl) continue;
    const dpos=bldDoor(bl);
    if (dpos) FIRE_SPOTS.push([dpos[0],dpos[1], (id==="tavern"||id==="market")?1:0]);
  }
}
function fireSpotTarget(fs){
  const cand=[[fs[0]+1,fs[1]],[fs[0]-1,fs[1]],[fs[0],fs[1]+1],[fs[0],fs[1]-1]]
    .filter(c=>c[0]>=1&&c[1]>=1&&c[0]<CW-1&&c[1]<CH-1&&!citySolid(c[0],c[1]));
  return cand.length? cand[irnd(cand.length)] : null;
}

  if (!FIRE_SPOTS) return;

    if (fx<-24||fy<-24||fx>Wz+24||fy>Hz+24) continue;

/* how dark is it meant to feel right now (0 noon .. 1 deep night) */
function dayDark(){
  if (!game || game.state==="combat"||game.state==="dead"||game.state==="legacy"||game.state==="soldout") return 0;
  if (game.state==="dungeon") return 0.55;
  if (game.state==="home"||game.state==="cellar") return 0.70;
  if (game.state==="base") return clamp((dayTint()[3]-0.14)/(0.66-0.14),0,1);
  return 0.5;
}
/* the Gate of Openings as masonry, not a teleporter: twin towers, a round arch,
   oaken doors under a raised portcullis, a torch at each jamb, the opening's
   sigil cut into the stone - one lamp of notoriety, no pulse */
function drawGatehouse(sx,sy,w,h){
  const twn=Math.max(12,Math.floor(w*0.27));
  /* center-span wall first (the arch will be carved out of it) */
  ctx.fillStyle="#635b69"; ctx.fillRect(sx+twn,sy,w-2*twn,Math.floor(h*0.55));
  for (let yy=sy+4;yy<sy+h*0.55;yy+=5){ ctx.fillStyle="#574f5c"; ctx.fillRect(sx+twn+1,yy,w-2*twn-2,1); }
  /* twin towers */
  for (const x0 of [sx, sx+w-twn]){
    ctx.fillStyle="#5c5462"; ctx.fillRect(x0,sy,twn,h);
    for (let yy=sy+5;yy<sy+h;yy+=5){ ctx.fillStyle="#4a4351"; ctx.fillRect(x0+2,yy,twn-4,1); }
    ctx.fillStyle="#756c7c"; ctx.fillRect(x0,sy,1,h); ctx.fillRect(x0+twn-1,sy,1,h);
    for (let mx=x0-1;mx<x0+twn;mx+=6){
      ctx.fillStyle="#837a8a"; ctx.fillRect(mx,sy-6,4,6);
      ctx.fillStyle="rgba(255,255,255,0.10)"; ctx.fillRect(mx,sy-6,4,1);
      ctx.fillStyle="rgba(0,0,0,0.25)"; ctx.fillRect(mx+3,sy-6,1,6);
    }
    ctx.fillStyle="#17121c"; ctx.fillRect(x0+Math.floor(twn/2)-1,sy+13,2,7);
    ctx.fillRect(x0+Math.floor(twn/2)-1,sy+30,2,6);
  }
  /* the arch: walls, passage, ring */
  const aw=w-2*twn+4, ax=sx+twn-2, ay=sy+2, ah=sy+h-ay-1;
  ctx.fillStyle="#0a060f";
  ctx.beginPath();
  ctx.moveTo(ax,ay+ah); ctx.lineTo(ax,ay+aw/2);
  ctx.arc(ax+aw/2,ay+aw/2,aw/2,Math.PI,0);
  ctx.lineTo(ax+aw,ay+ah); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="#8b8291"; ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(ax-1,ay+ah); ctx.lineTo(ax-1,ay+aw/2);
  ctx.arc(ax+aw/2,ay+aw/2,aw/2+1,Math.PI,0);
  ctx.lineTo(ax+aw+1,ay+ah); ctx.stroke();
  ctx.lineWidth=1;
  /* oaken doors, closed, iron-banded */
  const dy=ay+Math.floor(aw/2)+4, dh=ay+ah-dy;
  for (let px=ax+2;px<ax+aw-2;px+=3){ ctx.fillStyle=(px/3|0)%2?"#3a2919":"#452f1e"; ctx.fillRect(px,dy,2,dh); }
  ctx.fillStyle="#2a1c10"; ctx.fillRect(ax+2,dy,aw-4,1);
  for (const by of [dy+Math.floor(dh*0.30), dy+Math.floor(dh*0.72)]){
    ctx.fillStyle="#26242a"; ctx.fillRect(ax+1,by,aw-2,2);
    for (let rx=ax+4;rx<ax+aw-4;rx+=5){ ctx.fillStyle="#48444c"; ctx.fillRect(rx,by,1,2); ctx.fillStyle="#5c5762"; ctx.fillRect(rx,by,1,1); }
  }
  /* portcullis, raised but not gone: teeth in the arch's dark */
  for (let px=ax+Math.floor(aw/2)-4;px<=ax+Math.floor(aw/2)+4;px+=8){ ctx.fillStyle="#1d181f"; ctx.fillRect(px,ay-2,2,Math.floor(aw/2)-2); }
  ctx.fillStyle="#1d181f"; ctx.fillRect(ax+1,ay+2,aw-2,1);
  /* torches at each jamb - the only light this thing owns */
  const ty2=sy+h-Math.floor(h*0.28);
  for (const tx of [sx+twn-5, sx+w-twn+3]){
    ctx.fillStyle="#241812"; ctx.fillRect(tx+1,ty2,2,4);
    const ff=(worldTick+tx*5)%9;
    ctx.fillStyle= ff<4?"#f2a23c":"#e07b2c"; ctx.fillRect(tx,ty2-3,3,3);
    ctx.fillStyle=(worldTick%11<5)?"#f7d95e":"#f2a23c"; ctx.fillRect(tx+1,ty2-4,1,2);
    glow(tx+1.5,ty2-2,17,[255,160,60],0.15);
  }
  /* the sigil of the opening: a cut circle of gold in a stone plaque - no glow */
  const cxg=sx+w/2;
  ctx.fillStyle="#544c5c"; ctx.fillRect(cxg-6,ay-6,12,9);
  ctx.fillStyle="rgba(255,255,255,0.12)"; ctx.fillRect(cxg-6,ay-6,12,1);
  ctx.strokeStyle="#c9a24a"; ctx.strokeRect(cxg-3.5,ay-3.5,7,6);
  ctx.fillStyle="#c9a24a"; ctx.fillRect(cxg-1,ay-2,2,4);
  /* hanging banner on the right tower */
  {
    const bx=sx+w-twn+2, swy=(Math.floor(worldTick/37)%2);
    ctx.fillStyle="#6d2530"; ctx.fillRect(bx,sy+3+swy,8,15);
    ctx.fillStyle="rgba(0,0,0,0.30)"; ctx.fillRect(bx+7,sy+3+swy,1,15);
    ctx.fillStyle="#c9a24a"; ctx.fillRect(bx+4,sy+6+swy,1,9); ctx.fillRect(bx+3,sy+9+swy,3,2);
    ctx.fillStyle="#4b4351"; ctx.fillRect(bx-1,sy+2+swy,10,2);
  }
}
function drawBuilding(bl, sx, sy){
  const w=bl.w*T, h=bl.h*T;
  blobShadow(sx+w/2, sy+h+1.5, w*0.92, 0.30);
  const rnd=mulberry(bl.x*131+bl.y*17);
  ctx.font="bold 9px 'Courier New',monospace"; ctx.textBaseline="top";
  const tw=ctx.measureText(bl.label).width;
  txt(bl.label, sx+w/2-tw/2, sy-10, "#efe7d4");
  if (bl.gate){ drawGatehouse(sx,sy,w,h); return; }
  /* ---- walls: warm roughcast between dark timber posts, on a stone footing ---- */
  const wash=["#8a7a5e","#94856a","#877566","#7e7a66","#8f7f62","#82705c"][(bl.x*7+bl.y*3)%6];
  ctx.fillStyle=wash; ctx.fillRect(sx,sy+10,w,h-10);
  for (let i=0;i<Math.floor(w*h/90);i++){
    ctx.fillStyle="rgba(0,0,0,0.07)";
    ctx.fillRect(sx+2+Math.floor(rnd()*(w-4)), sy+11+Math.floor(rnd()*(h-15)), 1, 1);
  }
  ctx.fillStyle="rgba(0,0,0,0.38)"; ctx.fillRect(sx,sy+h-3,w,3);
  ctx.fillStyle="rgba(0,0,0,0.25)"; ctx.fillRect(sx,sy+h-4,w,1);
  /* stone seams on the footing: it reads as plain stones, not noise */
  ctx.fillStyle="rgba(0,0,0,0.3)";
  for (let x=sx+((bl.x*3)%7);x<sx+w-2;x+=7) ctx.fillRect(x,sy+h-3,1,3);
  /* timber corner posts and head beam */
  ctx.fillStyle="#2e2628";
  ctx.fillRect(sx,sy+10,2,h-13); ctx.fillRect(sx+w-2,sy+10,2,h-13);
  ctx.fillRect(sx,sy+10,w,1);
  /* ---- roof: pitched ridged tiles with a real eave overhang ---- */
  ctx.fillStyle=bl.roof; ctx.fillRect(sx-2,sy-2,w+4,12);

/* ----- street freight: barrels and crates leaned against walls (the city hauls things, all day) ----- */
const STALLS=[ { x:7, y:21, label:"MEAL CART" }, { x:29, y:8, label:"KETTLE STALL" } ];
let PROPS=null;
function computeProps(){
  PROPS=[];
  const rp=mulberry(5521);
  const used=new Set();
  for (const t of TRASH||[]) used.add(t[0]+","+t[1]);
  for (const st of STALLS) used.add(st.x+","+st.y);
  for (const bl of BUILDINGS){
    if (bl.home) continue;
    const spots=[];
    for (let x=bl.x-1;x<=bl.x+bl.w;x++) spots.push([x,bl.y-1],[x,bl.y+bl.h]);
    for (let y=bl.y;y<bl.y+bl.h;y++) spots.push([bl.x-1,y],[bl.x+bl.w,y]);
    for (const sp of spots){
      if (sp[0]<1||sp[1]<1||sp[0]>CW-2||sp[1]>CH-2) continue;
      if (sp[0]==7&&sp[1]==21) continue;
      if (cityGrid[sp[1]][sp[0]]!==".") continue;
      if (used.has(sp[0]+","+sp[1])) continue;
      if (LAMPS.some(lp=>lp[0]===sp[0]&&lp[1]===sp[1]) || (FIRE_SPOTS||[]).some(fs=>fs[0]===sp[0]&&fs[1]===sp[1])) continue; /* a barrel never shares a tile with a lamp post or a cooking fire */
      const r=rp();
      if (r<0.085){ PROPS.push({x:sp[0],y:sp[1],k:0,v:(rp()*2|0)}); used.add(sp[0]+","+sp[1]); }
      else if (r<0.17){ PROPS.push({x:sp[0],y:sp[1],k:1,v:(rp()*2|0)}); used.add(sp[0]+","+sp[1]); }
      else if (r<0.215){ PROPS.push({x:sp[0],y:sp[1],k:2,v:(rp()*2|0)}); used.add(sp[0]+","+sp[1]); }
    }
  }
  /* deliberate freight corners: a load waiting by the Grave-Market, drift by the Pawnbroker */
  const fix=[[33,8,1],[34,8,0],[34,7,1],[48,35,2],[55,30,1],[9,23,0]];
  for (const fp of fix){
    if (cityGrid[fp[1]]&&cityGrid[fp[1]][fp[0]]==="."&&!used.has(fp[0]+","+fp[1]) && !LAMPS.some(lp=>lp[0]===fp[0]&&lp[1]===fp[1]) && !(FIRE_SPOTS||[]).some(fs=>fs[0]===fp[0]&&fs[1]===fp[1])) PROPS.push({x:fp[0],y:fp[1],k:fp[2],v:(fp[0]+fp[1])%2});
  }
}
function drawStreetProps(camX,camY){
  if (!PROPS) computeProps();
  for (const pr of PROPS){
    const px=(pr.x-camX)*T, py=(pr.y-camY)*T;
    if (px<-12||py<-12||px>Wz+12||py>Hz+12) continue;
    ctx.fillStyle="rgba(0,0,0,0.22)"; ctx.fillRect(px+1,py+6,7,1);
    if (pr.k===0){
      ctx.fillStyle= pr.v? "#50402b":"#5c4830"; ctx.fillRect(px+1,py+1,6,6);
      ctx.fillStyle= pr.v? "#66533a":"#73603f"; ctx.fillRect(px+2,py,4,1);
      ctx.fillStyle="#2c2318"; ctx.fillRect(px+1,py+2,6,1); ctx.fillRect(px+1,py+5,6,1);
      ctx.fillStyle="rgba(255,255,255,0.05)"; ctx.fillRect(px+2,py+1,1,6);
    } else {
      const hgt= pr.k===2? 5:6, top= py+10-hgt;
      ctx.fillStyle= pr.v? "#5c4a2e":"#53432a"; ctx.fillRect(px,top,7,hgt);
      ctx.fillStyle="#6a5638"; ctx.fillRect(px,top,7,1);
      if (pr.k===2){ ctx.fillStyle= pr.v? "#50402b":"#4a3d27"; ctx.fillRect(px,top-5,6,5); ctx.fillStyle="#63513a"; ctx.fillRect(px,top-5,6,1); }
      ctx.strokeStyle="#3a2e1c";
      ctx.beginPath(); ctx.moveTo(px+1,top+1); ctx.lineTo(px+6,top+hgt-1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px+6,top+1); ctx.lineTo(px+1,top+hgt-1); ctx.stroke();
      ctx.strokeRect(px+0.5,top+0.5,6,hgt-1);
    }
  }
  for (const st of STALLS){
    const px=(st.x-camX)*T, py=(st.y-camY)*T;
    if (px<-24||py<-28||px>Wz+24||py>Hz+28) continue;
    blobShadow(px+4,py+8,9,0.30);
    /* cart body and wheels */
    ctx.fillStyle="#3c2d1d"; ctx.fillRect(px,py+3,8,5);
    ctx.fillStyle="#54402a"; ctx.fillRect(px,py+3,8,1);
    ctx.fillStyle="#241a12"; ctx.fillRect(px,py+7,2,2); ctx.fillRect(px+6,py+7,2,2);
    ctx.fillStyle="#171016"; ctx.fillRect(px+1,py+7,1,1); ctx.fillRect(px+7,py+7,1,1);
    /* awning, striped, wind-stirred */
    const swo= Math.floor(worldTick/130)%2;
    ctx.fillStyle="#241a12"; ctx.fillRect(px+1,py-1,1,4); ctx.fillRect(px+6,py-1,1,4);
    for (let si=0;si<8;si++){ ctx.fillStyle= si%2? "#7d4a3a":"#c9b9a0"; ctx.fillRect(px+si,py-3+swo,1,2); }
    /* goods: pot with steam, bread, hanging links */
    ctx.fillStyle="#22262c"; ctx.fillRect(px+2,py+2,4,2);
    ctx.fillStyle="#b98a4a"; ctx.fillRect(px+1,py+2,1,1); ctx.fillRect(px+6,py+3,1,1);
    ctx.fillStyle="#6e3a30"; ctx.fillRect(px+2,py-5+swo,1,2); ctx.fillRect(px+4,py-5+swo,1,2);
    const sy2=((worldTick/40|0)%2);
    ctx.fillStyle=(worldTick%80<40)?"rgba(215,215,220,0.28)":"rgba(215,215,220,0.14)";
    ctx.fillRect(px+3,py-2-sy2,1,1); ctx.fillRect(px+4,py-1+sy2-1,1,1);
    ctx.fillStyle="#e8d7a8"; ctx.fillRect(px+5,py+4,2,1);
  }
}

    hit(0,0,W,H,(gx,gy)=>{
      if (game.state!=="base" || game.ui.mode) return;
      const wx=clamp(Math.floor(gx/(T*camZ))+camX,0,CW-1), wy=clamp(Math.floor(gy/(T*camZ))+camY,0,CH-1);
      if (citySolid(wx,wy)) return;
      walkTo(wx,wy,null, (x,y)=>!citySolid(x,y), CW, CH);
    });
    for (const bl of BUILDINGS){
      if (bl.home && !game.player.house) continue;
      const sx=(bl.x-camX)*T, sy=(bl.y-camY)*T;
      if (sx>Wz||sy>Hz||sx+b.w*T<0||sy+b.h*T<0) continue;
      hit(sx*camZ, sy*camZ, bl.w*T*camZ, bl.h*T*camZ, ()=>{ /* no clamp: a clamped rect would bleed the tap over the street beside an off-screen building */
        if (game.state!=="base" || game.ui.mode) return;
        if (nearBuilding(bl, game.base.px, game.base.py)){ stopWalk(); enterBuilding(bl); return; }
        const cands=[];
        if (bl.home){
          const dx0=bl.door[0], dy0=bl.door[1];
          cands.push([dx0,dy0]);
          cands.push([dx0+1,dy0],[dx0-1,dy0],[dx0,dy0+1],[dx0,dy0-1]);
        } else {
          for (let x=bl.x;x<bl.x+bl.w;x++){
            cands.push([x,bl.y+bl.h]);
            if (!bl.gate){ cands.push([x,bl.y-1]); }
          }
          for (let y=bl.y;y<bl.y+bl.h;y++) cands.push([bl.x-1,y],[bl.x+bl.w,y]);
        }
        let best=null, bd=1e9;
        for (const c of cands){
          if (c[0]<0||c[1]<0||c[0]>=CW||c[1]>=CH) continue;
          if (citySolid(c[0],c[1])) continue;
          const dd=Math.abs(c[0]-game.base.px)+Math.abs(c[1]-game.base.py);
          if (dd<bd){ bd=dd; best=c; }
        }
        if (best) walkTo(best[0],best[1], ()=>{ if (nearBuilding(bl, game.base.px, game.base.py)) enterBuilding(bl); }, (x,y)=>!citySolid(x,y), CW, CH);
        else showHint("No way in from here.");
      });
    }
    for (const st of STALLS){
      const px=(st.x-camX)*T, py=(st.y-camY)*T;
      if (px<-24||py<-28||px>Wz+24||py>Hz+28) continue;
      hit(px*camZ,(py-4)*camZ,8*camZ,14*camZ,()=>{ /* walk to a stall, then buy */
        if (game.state!="base" || game.ui.mode) return;
        const dd=Math.abs(game.base.px-st.x)+Math.abs(game.base.py-st.y);
        if (dd<=2){ stopWalk(); vendorMenu(st); return; }
        const cands=[[st.x+1,st.y],[st.x-1,st.y],[st.x,st.y+1],[st.x,st.y-1]].filter(cc=>!citySolid(cc[0],cc[1]));
        if (!cands.length) return;
        const tt=st, c0=cands[0];
        stopWalk();
        walkTo(c0[0],c0[1],()=>{ if (!game.ui.mode && game.state==="base") vendorMenu(tt); },(x,y)=>!citySolid(x,y),CW,CH);
      });
    }
  }
  drawTownfolk(camX,camY);
  drawStranger(camX,camY);
  ctx.restore();
  for (let pi=0;pi<3;pi++){
    const bpx=(worldTick*0.3+pi*107)%(W+40)-20, bpy=38+pi*13+Math.sin(worldTick/23+pi*2)*6;
    ctx.fillStyle="#5b5163";
    ctx.fillRect(bpx,bpy,3,1);
    const flap=((worldTick/6|0)+pi)%2;
    ctx.fillRect(bpx-1,bpy-flap,1,1); ctx.fillRect(bpx+3,bpy-flap,1,1);
  }
  ctx.strokeStyle="rgba(150,170,195,0.30)";
  for (let di=0; di<46; di++){
    const dxr=((di*97 + worldTick*(2+(di%4)))%(W+12))-6, dyr=((worldTick*2.9 + di*29)%(H+16))-8;
    ctx.beginPath(); ctx.moveTo(dxr,dyr); ctx.lineTo(dxr-1.2,dyr+7); ctx.stroke();
  }
  for (let fb=0; fb<3; fb++){
    const fy=26+fb*52+Math.sin(worldTick/110+fb*2.1)*7;
    ctx.fillStyle="rgba(150,165,185,0.05)"; ctx.fillRect(0,fy,W,16);
  }
  const p=game.player;
  box(0,0,148,game.flags.loan? 48:38,"rgba(8,6,10,0.92)");
  txt(p.name+"  "+Math.floor(game.week/52)+"y  "+fmt(p.gold),3,3,PAL.gold);
  txt("HP "+p.hp+"/"+p.maxhp+" STAM "+Math.round(p.stam)+(p.stam<0?" DEBT":""),3,14, p.stam<0? PAL.bloodHi : PAL.bone);
  if (p.wounds.length) txt("wounds: "+p.wounds.join(","),3,25,PAL.bloodHi);
  if (p.ills && p.ills.length) txt("unwell: "+p.ills.join(","),3,36,"#8faf7a");
  else if (p.titles.length) txt("\""+p.titles[p.titles.length-1]+"\"",3,25,"#a89762");
  if (game.flags.loan) txt("the Fellows are owed "+game.flags.loan.owe+"g",3,47,"#c97a4a");
  cornerChips();
}

/* ----- dungeon render ----- */
function drawStairs(x,y,down){
  ctx.fillStyle="#080510"; ctx.fillRect(x+1,y+1,T-2,T-2);
  const steps= down? ["#7a686f","#66555f","#524352","#3e3145"] : ["#8d8190","#79707f","#665d6e","#534b5d"];
  for (let i=0;i<4;i++){ ctx.fillStyle=steps[i]; ctx.fillRect(x+1,y+2+Math.floor(i*1.5),T-2,1); }
  const hot=(worldTick%14<7);
  ctx.fillStyle= hot? (down? "#ffe08a":PAL.bone) : (down? PAL.coin:"#c7bfae");
  if (down){
    ctx.fillRect(x+3,y+1,2,1);
    ctx.fillRect(x+2,y+2,1,1); ctx.fillRect(x+5,y+2,1,1);
    ctx.fillRect(x+3,y+2,2,4);
    ctx.fillRect(x+2,y+4,1,1); ctx.fillRect(x+5,y+4,1,1);
    ctx.fillRect(x+2,y+5,4,1);
  } else {
    ctx.fillRect(x+3,y+5,2,1);
    ctx.fillRect(x+3,y+2,2,3);
    ctx.fillRect(x+2,y+2,1,1); ctx.fillRect(x+5,y+2,1,1);
    ctx.fillRect(x+3,y+1,2,1);
  }
}
function depthAir(dep){
  if (dep<=1) return { bg:"#060409", tint:[26,22,52],  a:0.06 };
  if (dep===2) return { bg:"#050610", tint:[20,30,62], a:0.10 };
  if (dep===3) return { bg:"#060310", tint:[60,22,58], a:0.13 };
  if (dep===4) return { bg:"#040609", tint:[18,48,56], a:0.16 };
  return       { bg:"#070405", tint:[70,18,26],  a:0.19 };
}
function drawDungeon(){
  const d=game.dungeon, f=curFloor();
  ctx.fillStyle=depthAir(d.depth).bg; ctx.fillRect(0,0,W,H);
  const camX=clamp(d.px-Math.floor(VWz/2),0,f.w-VWz), camY=clamp(d.py-Math.floor(VHz/2),0,f.h-VHz);
  ctx.save(); ctx.scale(camZ,camZ);
  for (let y=0;y<VHz;y++){
    const wy=y+camY; if (wy>=f.h) continue;
    for (let x=0;x<VWz;x++){
      const wx=x+camX; if (wx>=f.w) continue;
      if (!f.seen.has(wx+","+wy)) continue;
      const c=f.grid[wy][wx];
      const dist=Math.hypot(wx-d.px,wy-d.py);
      const dim=clamp(1-(dist-1.5)/7.4,0.24,1);
      ctx.globalAlpha=dim;
      const inR=f.rooms.some(r=>wx>=r.x&&wx<r.x+r.w&&wy>=r.y&&wy<r.y+r.h);
      let col;
      if (c==="#") col=(wx+wy)%2? PAL.wall:PAL.wallHi;
      else if (c==="<"||c===">") col="#3d3141";
      else if (inR) col=(wx+wy)%2? "#3b3049":"#483c59";
      else col=(wx+wy)%2? "#201827":"#261e30";
      ctx.fillStyle=col;
      ctx.fillRect(x*T,y*T,T,T);
      if (c==="#"){ ctx.fillStyle=PAL.wallHi; ctx.fillRect(x*T,y*T,T,2); }
      if (c==="<") drawStairs(x*T,y*T,false);
      if (c===">"){
        const pul=(0.10+0.10*Math.sin(worldTick/7+wx*1.3)).toFixed(3);
        ctx.fillStyle="rgba(224,185,90,"+pul+")";
        ctx.fillRect(x*T-1,y*T-1,T+2,T+2);
        glow(x*T+4,y*T+3,18,[224,185,90],0.11);
        drawStairs(x*T,y*T,true);
      }
      else if (c!=="#"){
        const hsc=((wx*73856093)^(wy*19349663)^f.seed)>>>0;
        if (!inR && hsc%5<2){ ctx.fillStyle="#0d0911"; ctx.fillRect(x*T+2,y*T+2,1,1); ctx.fillRect(x*T+5,y*T+4,1,1); }
        const m=hsc%19;
        if (m===0){ ctx.fillStyle="#a09a8c"; ctx.fillRect(x*T+2,y*T+5,1,1); ctx.fillRect(x*T+4,y*T+4,1,1); ctx.fillRect(x*T+5,y*T+3,1,1); }
        else if (m===1){ ctx.fillStyle="#4b4349"; ctx.fillRect(x*T+1,y*T+2,2,1); ctx.fillRect(x*T+3,y*T+3,1,1); }
        else if (m===2){ ctx.fillStyle="#0d0a10"; ctx.fillRect(x*T+1,y*T+3,3,1); ctx.fillRect(x*T+3,y*T+4,1,1); }
        else if (m===3){
          ctx.fillStyle="#101a22"; ctx.fillRect(x*T+1,y*T+1,5,2);
          if ((worldTick+wx*3+wy*7)%240<10){ ctx.fillStyle="#5a7a8a"; ctx.fillRect(x*T+2,y*T+1,2,1); }
        }
        else if (m===4){ ctx.fillStyle="#3a2f18"; ctx.fillRect(x*T+6,y*T+6,1,1); }
        else if (m===5){ ctx.fillStyle="#241d26"; ctx.fillRect(x*T+5,y*T+2,1,5); ctx.fillRect(x*T+2,y*T+5,1,2); }
      }
      const ev=f.events.find(e=>e.x===wx&&e.y===wy&&!e.done);
      if (ev){
        if (ev.type==="loot"){ ctx.fillStyle=PAL.gold; ctx.fillRect(x*T+3,y*T+3,2,2); }
        else if (ev.type==="bait"){ ctx.fillStyle=(worldTick%20<10)? PAL.gold : "#c99df5"; ctx.fillRect(x*T+3,y*T+3,2,2); }
        else if (ev.type==="whimper"){ ctx.fillStyle="#6b6f78"; ctx.fillRect(x*T+2,y*T+4,3,2); ctx.fillRect(x*T+3,y*T+2,1,2); }
        else if (ev.type==="secret"){
          ctx.fillStyle="#241a2e"; ctx.fillRect(x*T+1,y*T+1,6,6);
          ctx.fillStyle=(worldTick%46<18)? "#a06fd0" : "#5f4479";
          ctx.fillRect(x*T+3,y*T+1,1,6); ctx.fillRect(x*T+2,y*T+3,3,1);
        }
        else if (ev.type==="corpse"){ ctx.fillStyle=PAL.boneDim; ctx.fillRect(x*T+2,y*T+3,4,1); ctx.fillRect(x*T+3,y*T+4,3,1); }
        else if (ev.type==="shrine"){ ctx.fillStyle=PAL.bone; ctx.fillRect(x*T+2,y*T+2,1,3); ctx.fillRect(x*T+4,y*T+2,1,3); ctx.fillStyle=PAL.gold; ctx.fillRect(x*T+3,y*T+3,1,1); }
        else if (ev.type==="puzzle"){ ctx.fillStyle="#6b5d7a"; ctx.fillRect(x*T+1,y*T+1,5,5); ctx.fillStyle="#0a0810"; ctx.fillRect(x*T+2,y*T+2,3,3); }
        if (ev.type==="loot"||ev.type==="bait"||ev.type==="shrine"||ev.type==="puzzle"){
          const pul=(0.10+0.08*Math.sin(worldTick/9+wx*1.7+wy*2.3)).toFixed(3);
          ctx.fillStyle= ev.type==="loot"? "rgba(224,185,90,"+pul+")" : "rgba(150,140,190,"+pul+")";
          ctx.fillRect(x*T-1,y*T-1,T+2,T+2);
          if (heartEcho.on && ev.type!=="puzzle"){
            const per=10+heartEcho.dist*2, gl=(worldTick+wx*5+wy*3)%per;
            if (gl<6){
              const ga=((1-gl/6)*(0.44-0.036*heartEcho.dist)).toFixed(3);
              const gx2=x*T+2+((gl<3)?0:3), gy2=y*T+2+((gl>=3)?0:3);
              ctx.fillStyle="rgba(244,220,140,"+ga+")";
              ctx.fillRect(gx2,gy2,1,1);
              if (gl<2){ ctx.fillRect(gx2-1,gy2,3,1); ctx.fillRect(gx2,gy2-1,1,3); }
            }
          }
        }
        else if (ev.type==="boss"){
          const pacted=game.flags.pacts && game.flags.pacts[ev.boss];
          const pul=(0.12+0.08*Math.sin(worldTick/11+wx*2.1)).toFixed(3);
          glow(x*T+4,y*T+3,22,pacted? [160,200,235]:[190,120,235],0.14);
          ctx.fillStyle="rgba("+(pacted? "150,190,230":"180,110,225")+","+pul+")";
          ctx.fillRect(x*T-1,y*T-1,T+2,T+2);
          ctx.fillStyle="#14101c"; ctx.fillRect(x*T+2,y*T+1,4,6);
          ctx.fillStyle=pacted? "#9fc0dd":"#b9a2d8"; ctx.fillRect(x*T+3,y*T+2,2,1);
          ctx.fillStyle=(worldTick%14<7)? "#e0b1f5":"#a06fd0";
          ctx.fillRect(x*T+2,y*T,4,1);
        }
        else if (ev.type==="obstacle"){
          if (ev.done && ev.kind!=="chasm") { /* defused: cleared rubble, sunk spikes, levered plate, spent air */ }
          else if (ev.kind==="rubble"){ ctx.fillStyle="#4b4349"; ctx.fillRect(x*T+1,y*T+2,3,3); ctx.fillRect(x*T+4,y*T+4,3,2); }
          else if (ev.kind==="spikes"){ ctx.fillStyle=PAL.boneDim; ctx.fillRect(x*T+1,y*T+4,1,3); ctx.fillRect(x*T+4,y*T+3,1,4); }
          else if (ev.kind==="gas"){ ctx.fillStyle="rgba(90,110,80,0.5)"; ctx.fillRect(x*T,y*T,T,T); }
          else if (ev.kind==="plate"){ ctx.fillStyle="#6d5c46"; ctx.fillRect(x*T+1,y*T+3,5,1); ctx.fillStyle="#a89572"; ctx.fillRect(x*T+3,y*T+3,1,1); }
          else { ctx.fillStyle="#020103"; ctx.fillRect(x*T,y*T,T,T); }
        }
      }
      ctx.globalAlpha=1;
    }
  }
  ctx.strokeStyle="rgba(201,162,74,0.38)";
  for (const r of f.rooms){
    if (r.x+r.w<=camX || r.x>camX+VWz || r.y+r.h<=camY || r.y>camY+VHz) continue;
    ctx.strokeRect((r.x-camX)*T+0.5,(r.y-camY)*T+0.5,r.w*T-1,r.h*T-1);
    const tx=(r.cx-camX)*T+4, ty=(r.cy-camY)*T+4;
    ctx.fillStyle="#3a2f22"; ctx.fillRect(tx,ty,1,3);
    ctx.fillStyle= (Math.floor(worldTick/6)%2)? "#f2c14e":"#e0913a";
    ctx.fillRect(tx,ty-2,1,2);
    glow(tx,ty-1, 24, [255,172,64], 0.13);
  }
  ctx.fillStyle="rgba(150,178,208,0.78)";
  for (const dobj of (f.doors||[])){
    if (dobj.x<camX-1 || dobj.x>camX+VWz || dobj.y<camY-1 || dobj.y>camY+VHz) continue;
    if (!f.seen.has(dobj.x+","+dobj.y)) continue;
    if (dobj.s===0) ctx.fillRect((dobj.x-camX)*T,(dobj.y+1-camY)*T-1,T,1);
    else if (dobj.s===1) ctx.fillRect((dobj.x-camX)*T,(dobj.y-camY)*T,T,1);
    else if (dobj.s===2) ctx.fillRect((dobj.x+1-camX)*T-1,(dobj.y-camY)*T,1,T);
    else ctx.fillRect((dobj.x-camX)*T,(dobj.y-camY)*T,1,T);
  }
  glow((d.px-camX)*T+4,(d.py-camY)*T+3,30,[255,190,110],0.09);
  drawHero((d.px-camX)*T,(d.py-camY)*T,false);
  ctx.restore();
  const tint=d.opening.tint||[100,95,115];
  ctx.fillStyle="rgba("+tint[0]+","+tint[1]+","+tint[2]+",0.07)"; ctx.fillRect(0,0,W,H);
  const air=depthAir(d.depth);
  ctx.fillStyle="rgba("+air.tint[0]+","+air.tint[1]+","+air.tint[2]+","+air.a+")"; ctx.fillRect(0,0,W,H);
  const flick=Math.sin(worldTick/13)*4+Math.sin(worldTick/7)*3;
  const g=ctx.createRadialGradient(W/2,H/2-10,60+flick,W/2,H/2,190+flick*2);
  g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,"rgba(2,1,4,0.52)");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const wg=ctx.createRadialGradient(W/2,H/2-16,18,W/2,H/2-16,120);
  wg.addColorStop(0,"rgba(255,150,44,0.055)"); wg.addColorStop(1,"rgba(255,150,44,0)");
  ctx.fillStyle=wg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(200,190,170,0.10)";
  for (let i=0;i<12;i++){
    const mx=(i*89.7+worldTick*0.18+i*i*13)%W;
    const my=(i*53.3+worldTick*0.09+14*Math.sin((worldTick/47)+i))%178;
    ctx.fillRect(Math.floor(mx),Math.floor(my),1,1);
  }
  if (worldTick%53===0 && drips.length<6) drips.push({ x:20+((worldTick*97)%280), y:10+((worldTick*31)%40), t:0, sp:1+((worldTick*7)%2) });
  for (let i=drips.length-1;i>=0;i--){
    const dr=drips[i]; dr.t++; dr.y+=dr.sp;
    if (dr.y>168){ drips.splice(i,1); continue; }
    ctx.fillStyle="rgba(150,180,205,0.4)"; ctx.fillRect(dr.x,Math.floor(dr.y),1,3);
  }
  drawHeartVignette();
  const p=game.player;
  box(0,0,196,38,"rgba(6,4,9,0.9)");
  txt(d.opening.name.slice(0,34)+" d"+d.depth+" (dgr "+d.tierNow+")",3,3,PAL.gold);
  txt("HP "+p.hp+"/"+p.maxhp+" STAM "+Math.round(p.stam)+(p.stam<0?" DEBT":"")+" "+fmt(p.gold),3,14, p.stam<0? PAL.bloodHi : null);
  let st=null, stn=1e9;
  for (let y2=0;y2<f.h;y2++) for (let x2=0;x2<f.w;x2++){
    if (f.grid[y2][x2]!==">" || !f.seen.has(x2+","+y2)) continue;
    const dd=Math.abs(x2-d.px)+Math.abs(y2-d.py);
    if (dd>0 && dd<stn){ stn=dd; st=[x2,y2]; }
  }
  if (st && stn<30) txt("\u25bc "+(st[0]>d.px? (st[0]-d.px)+"E":(d.px-st[0])+"W")+" "+(st[1]>d.py? (st[1]-d.py)+"S":(d.py-st[1])+"N"), 204,3, PAL.gold);
  if (p.wounds.length) txt("wounds: "+p.wounds.join(","),3,25,PAL.bloodHi);
  if (p.ills && p.ills.length) txt("unwell: "+p.ills.join(","),3,36,"#8faf7a");
  else if (p.stam<=-25) txt("DEATH ROLLS EVERY STEP",3,25,PAL.bloodHi);
  const onUp = f.grid[d.py][d.px]==="<", onDown = f.grid[d.py][d.px]===">";
  if (!game.combat){
  hit(0,0,W,H,(gx,gy)=>{
    const f2=curFloor(), d2=game.dungeon;
    if (!f2 || !d2) return;
    const wx=clamp(Math.floor(gx/(T*camZ))+camX,0,f2.w-1), wy=clamp(Math.floor(gy/(T*camZ))+camY,0,f2.h-1);
    if (!f2.seen.has(wx+","+wy)) return;
    if (f2.grid[wy][wx]==="#") return;
    const sc=f2.grid[wy][wx], dSave=game.dungeon;
    walkTo(wx,wy, (sc==="<"||sc===">")? ()=>{ if (game.state==="dungeon" && !game.ui.mode && game.dungeon===dSave) useStair(); } : null, dungPass, f2.w, f2.h);
  });
  if (onUp) chip(d.depth===1? "CLIMB OUT" : "ASCEND", W-116, H-14, 54, ()=>pressZ("z"));
  else if (onDown) chip(gateReady()? "THE GATE":"DESCEND", W-116, H-14, 54, ()=>pressZ("z"));
  else chip("MENU", W-116, H-14, 54, ()=>pressZ("z"));
  chip("MAP", W-60, H-14, 30, ()=>pressZ("m"));
  }
  cornerChips();
}

function drawMinimap(){

/* ----- UI & combat render ----- */
function wrap(s,n){
  s=String(s);
  if (s.length<=n) return [s];
  let br=s.lastIndexOf(" ",n);
  if (br<0) br=n;

function txtFit(s,x,y,col,maxW,big){
  s=String(s);
  let px=big? 11:9;
  ctx.font="bold "+px+"px 'Courier New', monospace";
  while (px>5 && ctx.measureText(s).width>maxW){ px--; ctx.font="bold "+px+"px 'Courier New', monospace"; }
  const orig=s;
  while (s.length>1 && ctx.measureText(s+"…").width>maxW) s=s.slice(0,-1);
  if (s!==orig) s+="…";
  ctx.textBaseline="top";
  ctx.fillStyle="#0a0710";
  ctx.fillText(s,x+1,y); ctx.fillText(s,x-1,y); ctx.fillText(s,x,y+1); ctx.fillText(s,x,y-1);

}
function wrapPx(s,maxW,px){
  const str=String(s);
  ctx.font="bold "+px+"px 'Courier New', monospace";
  if (ctx.measureText(str).width<=maxW) return [str];
  const lines=[]; let cur="";
  for (const w of str.split(" ")){
    const test=cur? cur+" "+w : w;
    if (!cur || ctx.measureText(test).width<=maxW) cur=test;
    else { if (cur) lines.push(cur); cur=w; }
  }
  if (cur) lines.push(cur);
  return lines;
}

let vigGrad=null, noiseTile=null, noiseOff=0;
const DAY_CYCLE=5400; /* ninety seconds of play are one day */
const DAYKEYS=[
  [0.00,[236,226,208,0.14]], [0.38,[238,220,192,0.18]],
  [0.52,[228,152,74,0.34]],  [0.62,[70,92,150,0.66]],
  [0.80,[70,92,150,0.66]],  [0.92,[150,148,196,0.32]],
  [1.00,[236,226,208,0.14]]
];
function dayTint(){
  const t=(worldTick%DAY_CYCLE)/DAY_CYCLE;
  let a=DAYKEYS[0], b=DAYKEYS[DAYKEYS.length-1];
  for (let i=0;i<DAYKEYS.length-1;i++){ if (t>=DAYKEYS[i][0] && t<=DAYKEYS[i+1][0]){ a=DAYKEYS[i]; b=DAYKEYS[i+1]; break; } }
  const f=(t-a[0])/Math.max(1e-6,b[0]-a[0]);
  const o=[0,0,0,0]; for (let i=0;i<4;i++) o[i]=a[1][i]+(b[1][i]-a[1][i])*f;
  return o;
}
function mulTint(o){
  ctx.save(); ctx.globalCompositeOperation="multiply";
  ctx.fillStyle="rgba("+Math.round(o[0])+","+Math.round(o[1])+","+Math.round(o[2])+","+o[3].toFixed(3)+")";

function grain(){

    try{
      noiseTile=document.createElement("canvas"); noiseTile.width=97; noiseTile.height=59;

      if (wx<0||wy<0||wx>=cm.w||wy>=cm.h) return;
      const c=cm.rows[wy][wx];
      if (c==="S"){ stopWalk(); cellarWalkTo(wx,wy, leaveCellar); return; }
      if (c==="o"){ stopWalk(); cellarBarrelApproach(wx,wy); return; }
      if (!cellarSolid(wx,wy)) cellarWalkTo(wx,wy,null);
    });
    for (let y=0;y<cm.h;y++) for (let x=0;x<cm.w;x++){
      const c=cm.rows[y][x];
      if (c==="o"){ const wx=x, wy=y; hit(ox+x*T,oy+y*T,T,T,()=>{ if (game.state!=="cellar"||game.ui.mode) return; stopWalk(); cellarBarrelApproach(wx,wy); }); }
      if (c==="S"){ const wx=x, wy=y; hit(ox+x*T,oy+y*T,T,T,()=>{ if (game.state!=="cellar"||game.ui.mode) return; stopWalk(); cellarWalkTo(wx,wy, leaveCellar); }); }
    }
  }
}
function cellarBarrelApproach(tx,ty){
  const cm=game.cellar; if (!cm) return;
  const cands=[[tx,ty-1],[tx,ty+1],[tx-1,ty],[tx+1,ty]].filter(cc=>!cellarSolid(cc[0],cc[1]));
  let best=null, bd=1e9;
  for (const c of cands){ const dd=Math.abs(c[0]-cm.px)+Math.abs(c[1]-cm.py); if (dd<bd){ bd=dd; best=c; } }
  if (!best) return;
  if (best[0]===cm.px && best[1]===cm.py){ cellarInteract(tx,ty); return; }
  cellarWalkTo(best[0],best[1],()=>cellarInteract(tx,ty));
}
function updateBase(){
  updTownfolk();
  if (uiBlocked()){ updateUI(); return; }
  if (game.flags.sharkDrip){ game.flags.sharkDrip=0; if (!game.flags.loan){ sharkMeet(); return; } }
  if (game.flags.loanDue){ game.flags.loanDue=0; if (game.flags.loan){ fellowsCollect(); return; } }
  const mv=dirTap();
  if (mv){ stopWalk(); tryBaseMove(mv[0],mv[1]); maybeMugged(); crownPressure(); strangerPressure(); return; }
  if (walkPath && walkPath.length){
    if (yesTap()||noTap()){ stopWalk(); return; }
    if (++walkTick>=5){
      walkTick=0;
      const st=walkPath.shift();
      if (citySolid(st[0],st[1])){ stopWalk(); }
      else {
        heroFace = st[1]>game.base.py?"dn":st[1]<game.base.py?"up":st[0]>game.base.px?"rt":"lf";
        game.base.px=st[0]; game.base.py=st[1];
        if (!walkPath.length && walkCb){ const cb=walkCb; walkCb=null; cb(); }
      }
    }
    return;
  }
  walkPath=null; walkCb=null;
  if (yesTap()){
    const stq=game.flags.stranger;
    if (stq && Math.abs(game.base.px-stq.x)<=2 && Math.abs(game.base.py-stq.y)<=2){
      if (!game.ui.mode){ stopWalk(); strangerMeet(); return; }
    }
    for (const b of BUILDINGS){
      if (b.home && !game.player.house) continue;
      if (nearBuilding(b, game.base.px, game.base.py)){ enterBuilding(b); return; }
    }
    say(["Cobblestones, drizzle, the smell of tallow and meat going off.",
         "Nothing needs you here. The city keeps its appointments elsewhere."]);
  }
}
/* stand-on-tile actions: the stairs up and down (shared by the Z press and by tapping them) */
function useStair(){
  if (game.state!=="dungeon" || !game.dungeon) return false;
  const d=game.dungeon, f=curFloor();
  if (!f) return false;
  const ch=f.grid[d.py] ? f.grid[d.py][d.px] : null;
  if (ch==="<"){
    if (d.floorIx===0){
      if (temptClimb()) return true;
      leaveDungeon(); return true;
    }
    d.floorIx--;
    const fr=curFloor();
    d.px=fr.rooms[0].cx; d.py=fr.rooms[0].cy;
    markSeen();
    say(["You climb back up. The air is one level less ancient."]);
    saveGame();
    return true;
  }
  if (ch===">"){
    if (gateReady()){
      if (game.flags.priorKeeper && !game.flags.keeperFought){ priorKeeperGate(); return true; }
      openTheGate(); return true;
    }
    d.depth++;
    game.player.deep=Math.max(game.player.deep,d.depth);
    maybeDepthLore(d.depth);
    droneHush();
    genFloor(d);
    advanceWeeks(1);
    saveGame();
    say(["Down. The stone gets older. The things in it get less pretend."]);
    return true;
  }
  return false;
}
function updateDungeon(){
  if (mapOpen){ if (tap("m")||noTap()||yesTap()) mapOpen=false; return; }
  if (uiBlocked()){ updateUI(); return; }
  const d=game.dungeon, f=curFloor();
  const mv=dirTap();
  if (mv){ stopWalk(); tryMove(mv[0],mv[1]); return; }
  if (walkPath && walkPath.length){
    if (yesTap()||noTap()){ stopWalk(); return; }
    if (tap("m")){ stopWalk(); mapOpen=true; return; }
    if (++walkTick>=6){
      walkTick=0;
      const st=walkPath.shift();
      if (f.grid[st[1]] && f.grid[st[1]][st[0]]==="#"){ stopWalk(); }
      else {
        tryMove(st[0]-d.px, st[1]-d.py);
        if (!walkPath){ stopWalk(); }
        else if (!walkPath.length){ walkPath=null; const cb=walkCb; walkCb=null; if (cb && !game.ui.mode) cb(); }
      }
    }
    return;
  }
  walkPath=null; walkCb=null;
  if (tap("m")){ mapOpen=true; return; }
  if (!yesTap()) return;
  if (useStair()) return;
  showMenu("DELVE", [
        ...(countItem("Ration")? [{ t:"Camp (eat a ration, restore)", fn:()=>{
            useFromInv("Ration",1);
            game.player.stam=clamp(game.player.stam+45,0,maxStam());
            game.player.hp=clamp(game.player.hp+4,0,game.player.maxhp);
            advanceWeeks(1);
            say(["Cold food, colder company. The dark watches you chew.","Stamina +45, HP +4."]);
            mapOpen=false; saveGame(); } }]:[]),
        { t:"Study the walls (map)", fn:()=>{ mapOpen=true; } },
        { t:"Feel your wounds", fn:()=>{
            const p=game.player;
            say(p.wounds.length? ["Your "+p.wounds.join(" and your ")+((p.wounds.length>1)?" throb":" throbs")+" in time with your pulse. A flesh-setter would be wise."]
                               : ["Holding together. For Jericho, that is a good day."]); } },
        { t:"Nothing", fn:()=>{} }
      ]);
}
function leaveDungeon(){
  game.dungeon=null; mapOpen=false; game.state="base";
  advanceWeeks(1);
  const p=game.player;
  const lines=["You climb out into Jericho drizzle. The city resumes ignoring you, which is its way of saying hello.",
       "Delves: "+p.delves+"  |  kills: "+p.kills+"  |  purse: "+fmt(p.gold)];
  const news=drainNews();
  if (news.length) lines.push("Word from the surface:", ...news);
  if (game.flags.loan) game.flags.loanDue=1;
  say(lines, ()=>saveGame());
}
function updateCombat(){
  const c=game.combat;
  if (!c) return;
  if (c.intro>0){
    if (yesTap()||tap("x")) c.intro=0;
    else c.intro--;
    return;
  }
  if (c.dice){ rollDiceFrame(); return; }
  if (c.turn==="player"){
    const acts=quickActs();
    if (tap("arrowup")||tap("w")) c.choice=(c.choice+acts.length-1)%acts.length;
    if (tap("arrowdown")||tap("s")) c.choice=(c.choice+1)%acts.length;
    if (yesTap()) combatPlayerAction(acts[c.choice]);
  } else if (c.turn==="won"){
    if (c.kcine>0){ c.kcine--; if (yesTap()) c.kcine=Math.min(c.kcine,3); return; }
    if (yesTap()) endCombat();
  }
}
function updateDead(){
  if (!yesTap()) return;
  const pages=Math.max(1,Math.ceil(deadRows().length/11));
  if (deadPage<pages-1){ deadPage++; return; }
  if (game.state==="soldout"){ startDream(); return; }
  if (game.state==="legacy"){ continueAsChild(); return; }
  game=null; titleTick=0; mapOpen=false; deadPage=0;
}
/* the heir takes over the save */
function continueAsChild(){
  const old=game.player, c=old.child;
  if (!c){ game=null; return; }
  if (old.spouse) old.spouse.parentOfYou=true;
  const spark=c.spark;
  game.player={
    name:c.name,
    str: Math.min(12, Math.max(2, Math.floor(old.str*0.5)+Math.ceil(spark/3))),
    agi: Math.min(12, Math.max(2, Math.floor(old.agi*0.5)+Math.ceil(spark/3))),
    wit: Math.min(12, Math.max(2, Math.floor(old.wit*0.5)+Math.ceil(spark/4))),
    wll: Math.min(12, Math.max(2, Math.floor(old.wll*0.5)+Math.ceil(spark/2))),
    hp:22, maxhp:22, stam:100, maxstam:100,
    gold:15,
    weapon: old.weapon.d>2? {n:old.weapon.n, d:old.weapon.d} : {n:"Rusted Knife", d:2},
    armor: {n:old.armor.n, a:old.armor.a},
    inv:[{n:"Ration", v:8, qty:2, kind:"food"},{n:"Bandage", v:10, qty:1, kind:"heal"}],
    wounds:[], ills:[],
    house:old.house, upgrades:old.upgrades.slice(),
    spouse:null, partner:null, tryChild:0, child:null,
    kills:0, delves:0, deep:0,
    streak:0, gambleWins:0, lastAction:null,
    titles:[], killsByKind:{}, bestiary:old.bestiary, maneuvers:[]
  };
  normGear();
  game.week=c.weeks;
  game.dungeon=null; game.combat=null; game.base={px:20,py:15};
  closeUI(); game.state="base"; mapOpen=false;
  game.flags.news=[];
  cityGrid=buildCity();
  const heirLines=[
    "The lamp is relit. "+game.player.name+" of the leaning house takes up the knife at "+Math.floor(game.week/52)+" years old.",
    game.flags.posthumous? "You were born against arithmetic, into a house that already had one keeper in the ground."
      : "Strong as half a dead parent and some of their habits. The house stands because somebody kept paying for it.",
    "The Openings will remember your old name soon enough. The Gate has not moved."
  ];
  if (game.flags.mutatedKeeper) heirLines.push("Down in the deep, "+game.flags.mutatedKeeper+" wears your parent's old face. The city has already named it, and named it wrong.");
  if (game.flags.sentinelBorn) heirLines.push("By the Gate of Openings stands a street-keeper nobody sent for: your parent's outline, or nearly. Look them up. They have something to say to the ones who come after.");
  if (game.flags.posthumous && old.spouse) heirLines.push(!old.spouse.dead?
    "Your mother is there when you wake. She has not spoken your father's name since, and she counts your rations like a woman keeping score."
    : "Your mother is buried under the Holy Gate's slates. The sexton keeps your name in her book, spelled right.");
  say(heirLines, ()=>saveGame());
}
function updateUI(){
  const u=game.ui;
  if (u.mode==="text"){
    if (yesTap()){
      u.dialog.i++;
      if (u.dialog.i>=u.dialog.lines.length){
        const cb=u.onclose; closeUI();
        if (cb) cb();
      }
    }
  } else if (u.mode==="menu"){
    const m=u.menu;
    if (tap("arrowup")||tap("w")) m.sel=(m.sel-1+m.opts.length)%m.opts.length;
    if (tap("arrowdown")||tap("s")) m.sel=(m.sel+1)%m.opts.length;
    if (yesTap()){
      const fn=m.opts[m.sel].fn;
      closeUI();
      fn();
    } else if (noTap()){
      const oc=u.oncancel;
      closeUI();
      if (oc) oc();
    }
  }
}

/* ---------------- main loop ---------------- */
function frame(){
  uiHits=[];
  worldTick++;
  pollGamepad();
  tickHeld();
  updateAmbience();
  updateBattleMusic();
  updateTreasureEcho();
  if (critPulse>0) critPulse--;
  if (hbThrob>0) hbThrob--;
  if (gDice){ rollDiceFrame(); }
  else if (!game) updateTitle();
  else {
    if (game.state==="base") updateBase();
    else if (game.state==="home") updateHome();
    else if (game.state==="cellar") updateCellar();
    else if (game.state==="dungeon") updateDungeon();
    else if (game.state==="combat") updateCombat();
    else if (game.state==="dead"||game.state==="legacy"||game.state==="soldout") updateDead();
  }
  ctx.setTransform(RES,0,0,RES,0,0);
  const shk = (shakeT>0 || critPulse>0) && !gDice;
  if (shk){
    ctx.save(); ctx.translate(irnd(3)-1, irnd(3)-1);
    if (critPulse>0 && ctx.scale){
      const ps=1+critPulse/90;
      ctx.translate(W/2,H/2); ctx.scale(ps,ps); ctx.translate(-W/2,-H/2);
    }
  }
  if (!game) renderTitle();
  else {
    if (game.state==="base") drawBase();
    else if (game.state==="home") drawHome();
    else if (game.state==="cellar") drawCellar();
    else if (game.state==="dungeon") drawDungeon();
    else if (game.state==="combat") renderCombat();
    else if (game.state==="dead"||game.state==="legacy"||game.state==="soldout") renderDead();
    drawAmbience();
    if (game.dungeon && mapOpen && game.state==="dungeon") drawMinimap();
    if (game.state!=="combat" && game.state!=="dead" && !mapOpen) renderUI();
  }
  if (shk) ctx.restore();
  if (gDice) drawGambleBoard();
  drawJuice();
  drawSteerMark();
  if (hintT>0 && hintMsg){
    hintT--;
    ctx.font="bold 9px 'Courier New',monospace"; ctx.textBaseline="top";
    const hrows=wrapPx(hintMsg,300,9).slice(0,2);
    let hw=0; for (const r of hrows) hw=Math.max(hw,ctx.measureText(r).width);
    ctx.fillStyle="rgba(8,6,10,0.92)"; ctx.fillRect(W/2-hw/2-3, 1, hw+6, hrows.length>1? 24:14);
    let hy=3;
    for (const r of hrows){ txt(r, W/2-ctx.measureText(r).width/2, hy, "#e0b95a"); hy+=10; }
  }
  endFrame();
}
function loop(){ frame(); requestAnimationFrame(loop); }
loop();
