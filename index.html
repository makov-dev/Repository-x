/* ---------------- utils ---------------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function irnd(n){ return Math.floor(Math.random()*n); }
function pick(a){ return a[irnd(a.length)]; }
function d10(){ return 1+irnd(10); }
function fmt(n){ return Math.floor(n)+"g"; }
function cap(s){ return s? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function mulberry(seed){ let t=seed>>>0; return function(){ t+=0x6D2B79F5; let r=Math.imul(t^(t>>>15),1|t); r^=r+Math.imul(r^(r>>>7),61|r); return ((r^(r>>>14))>>>0)/4294967296; }; }

/* ---------------- input ---------------- */
const keys = {};
const pressed = {};
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (["arrowup","arrowdown","arrowleft","arrowright"," "].indexOf(k)>=0) e.preventDefault();
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
  if (k==="f5"){ e.preventDefault(); if (game) saveGame(); }
  if (k==="f9"){ e.preventDefault(); loadGame(); }
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
function tap(k){ if (pressed[k]) { pressed[k]=false; return true; } return false; }
function dirTap(){
  if (tap("arrowup")||tap("w")) return [0,-1];
  if (tap("arrowdown")||tap("s")) return [0,1];
  if (tap("arrowleft")||tap("a")) return [-1,0];
  if (tap("arrowright")||tap("d")) return [1,0];
  return null;
}
function endFrame(){ for (const k in pressed) pressed[k]=false; }

/* ---------------- gamepad ---------------- */
const gpHold={}, gpPrev={};
function pollGamepad(){
  if (typeof navigator==="undefined" || !navigator.getGamepads) return;
  let pads=null;
  try { pads=navigator.getGamepads(); } catch(e){ return; }
  let gp=null;
  for (const g of pads){ if (g && g.connected){ gp=g; break; } }
  if (!gp) return;
  const btn=i=>!!(gp.buttons[i] && gp.buttons[i].pressed);
  const dx=gp.axes[0]||0, dy=gp.axes[1]||0;
  const dirs={
    arrowup:    btn(12) || dy<-0.5,
    arrowdown:  btn(13) || dy> 0.5,
    arrowleft:  btn(14) || dx<-0.5,
    arrowright: btn(15) || dx> 0.5
  };
  for (const k in dirs){
    if (dirs[k]){
      gpHold[k]=(gpHold[k]||0)+1;
      if (gpHold[k]===1 || gpHold[k]%8===0) pressed[k]=true;
    } else gpHold[k]=0;
  }
  const acts={ z:btn(0), x:btn(1), enter:btn(9), escape:btn(8), m:btn(3), f5:btn(2) };
  for (const k in acts){
    if (acts[k] && !gpPrev[k]) pressed[k]=true;
    gpPrev[k]=acts[k];
  }
}
function yesTap(){ return tap("z")||tap("enter")||tap(" "); }
function noTap(){ return tap("x")||tap("escape"); }

function chip(label,x,y,w,fn,en){
  if (en===undefined) en=true;
  ctx.font="bold 9px 'Courier New',monospace";
  ctx.fillStyle= en? "#241b2d" : "#130e18";
  ctx.fillRect(x,y,w,13);
  ctx.strokeStyle= en? "#7d6f4c" : "#2a2233";
  ctx.strokeRect(x+.5,y+.5,w-1,12);
  const tw=ctx.measureText(label).width;
  txt(label,x+Math.max(1,Math.floor((w-tw)/2)),y+2, en? "#d8cba8" : "#57506a");
  if (en) hit(x,y,w,13,fn);
}
CVS.addEventListener("pointerdown", e=>{

    if (gx>=h.x && gx<h.x+h.w && gy>=h.y && gy<h.y+h.h){ e.preventDefault(); h.fn(gx,gy); break; }

});

/* ----- tap-to-walk (tap a tile, hero walks there) ----- */
let walkPath=null, walkCb=null, walkTick=0;
function stopWalk(){ walkPath=null; walkCb=null; }
function bfsPath(sx,sy,tx,ty,pass,w,h){
  if (sx===tx && sy===ty) return [];
  if (tx<0||ty<0||tx>=w||ty>=h) return null;
  const key=(x,y)=>x+","+y;
  const prev=new Map();
  prev.set(key(sx,sy), null);
  const q=[[sx,sy]]; let head=0;
  while (head<q.length){
    const c=q[head++], x=c[0], y=c[1];
    if (x===tx && y===ty){
      const path=[]; let cur=c;
      while (cur){ path.push(cur); cur=prev.get(key(cur[0],cur[1])); }
      path.reverse(); path.shift();
      return path;
    }
    const nb=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
    for (let i=0;i<4;i++){
      const nx=nb[i][0], ny=nb[i][1];
      if (nx<0||ny<0||nx>=w||ny>=h) continue;
      const k=key(nx,ny);
      if (prev.has(k)) continue;
      if (!pass(nx,ny)) continue;
      prev.set(k, c);
      q.push([nx,ny]);
    }
  }
  return null;
}
function dungPass(x,y){
  const f=curFloor();
  if (x<0||y<0||x>=f.w||y>=f.h) return false;
  if (f.grid[y][x]==="#") return false;
  return f.seen.has(x+","+y);
}
function walkTo(tx,ty,cb,pass,w,h){
  const src=game.state==="dungeon"? game.dungeon : game.base;
  if (tx===src.px && ty===src.py){ if (cb) cb(); return; }
  const path=bfsPath(src.px,src.py,tx,ty,pass,w,h);
  if (!path){ showHint("No path there from where you stand."); return; }
  walkPath=path; walkCb=cb||null; walkTick=4;
}

/* ---------------- item helpers ---------------- */
function addItem(n, v, kind, qty){
  qty = qty||1;
  const p=game.player;
  for (const it of p.inv){ if (it.n===n && it.kind===kind){ it.qty+=qty; return true; } }
  if (p.inv.length>=invCap()){ say(["Your pack is stuffed to bursting. You leave the "+n+" in the dark."]); return false; }
  p.inv.push({n:n, v:v, kind:kind||"loot", qty:qty});
  return true;
}
function countItem(n){ const p=game.player; let c=0; for (const it of p.inv) if (it.n===n) c+=it.qty; return c; }
function useFromInv(n, qty){
  qty=qty||1; const p=game.player;
  let left=qty;
  for (let i=p.inv.length-1;i>=0 && left>0;i--){
    const it=p.inv[i];
    if (it.n===n){ const take=Math.min(it.qty,left); it.qty-=take; left-=take; if (it.qty<=0) p.inv.splice(i,1); }
  }
  return left===0;
}
function rollLoot(tier, rolls){
  const out=[];
  const pool=LOOT.slice();
  const total=pool.reduce((s,l)=>s+l.w,0);
  for (let i=0;i<rolls;i++){
    let r=Math.random()*total;
    for (const l of pool){ r-=l.w; if (r<=0){ out.push({n:l.n, v:Math.round(l.v*(0.8+0.4*tier*0.35)), kind:"loot", qty:1}); break; } }
  }
  return out;
}

/* ---------------- save / load ---------------- */
function saveGame(){
  try { localStorage.setItem("openings_save", JSON.stringify({game:game}, (k,v)=> v instanceof Set ? {__set:Array.from(v)} : v)); } catch(e){}
}
function loadGame(){
  try {
    const raw=localStorage.getItem("openings_save");
    if (!raw) return;
    const snap=JSON.parse(raw, (k,v)=> v && v.__set ? new Set(v.__set) : v);
    if (snap && snap.game){
      game=snap.game; closeUI();
      if (!game.flags) game.flags={news:[]};
      if (!game.flags.news) game.flags.news=[];
      if (!game.flags.unburied) game.flags.unburied=[];
      const Pl=game.player;
      if (!Array.isArray(Pl.titles)) Pl.titles=[];
      if (!Array.isArray(Pl.maneuvers)) Pl.maneuvers=[];
      if (!Pl.killsByKind) Pl.killsByKind={};
      if (!Pl.bestiary) Pl.bestiary={};
      if (typeof Pl.streak!=="number") Pl.streak=0;
      if (typeof Pl.gambleWins!=="number") Pl.gambleWins=0;
      if (typeof Pl.lastAction!=="string") Pl.lastAction=null;
      game.state = game.dungeon? "dungeon":"base";
    }
  } catch(e){}
}
function wipeSave(){ try{ localStorage.removeItem("openings_save"); }catch(e){} }

  for (let y=19;y<22;y++) for (let x=17;x<27;x++) g[y][x]="o";

  for (const b of BUILDINGS){
    if (b.home && !(game && game.player && game.player.house)) continue;
    for (let y=b.y;y<b.y+b.h;y++) for (let x=b.x;x<b.x+b.w;x++){
      if (b.gate) g[y][x] = (x===b.x+2 || x===b.x+3) ? "G" : "B";
      else if (b.yard) g[y][x]="y";
      else g[y][x]="B";
    }
    if (b.home) g[b.door[1]][b.door[0]]="D";
  }
  return g;
}
let cityGrid = null;
function citySolid(x,y){
  if (x<0||y<0||x>=CW||y>=CH) return true;
  return cityGrid[y][x]==="B";
}
function tryBaseMove(dx,dy){
  const b=game.base;
  const nx=b.px+dx, ny=b.py+dy;
  if (citySolid(nx,ny)) return;
  b.px=nx; b.py=ny;
}
/* other adventurers try to rob you when you look worth it */
function maybeMugged(){
  const p=game.player;
  if (game.ui.mode || game.combat || gDice) return;
  const lastMug=game.flags.lastMug||0;
  if (game.week-lastMug<8) return;
  const purse=p.gold, loot=lootValue();
  const heat=(purse>=70? 1:0)+(loot>=80? 1:0);
  if (!heat) return;
  if (Math.random()>0.004*heat) return;
  game.flags.lastMug=game.week;
  stopWalk();
  const who=pick(ADV_NAMES);
  showText([who+" falls into step beside you, hood up, hands loose. Empty street, wrong hour. Somebody counted your purse at the market.",
            "\"Coin or blood, "+addr()+". The ward has seen worse either way.\""], ()=>{
    showMenu(who.toUpperCase()+" - A QUIET STREET", [
      { t:"Hand over a tithe (20% of coin)", fn:()=>{ const t2=Math.floor(p.gold*0.2); p.gold-=t2;
          saveGame();
          say([who+" takes "+fmt(t2)+" with unsettling courtesy and is gone between two raindrops.",
               "The city taxes its living twice."]); } },
      { t:"Show steel & nerve (Steel or Will)", fn:()=>{
          if (p.weapon.d>=5 || check("wll",11)){
            say(["You just look at them. Something in their face does its own arithmetic.","They drift away like weather."]); }
          else { const t2=Math.floor(p.gold*0.3); p.gold-=t2;
            say(["Your bluff fails the arithmetic. Thirty percent, plus interest in bruise."], ()=>{ hurt(2,null); });
            saveGame(); } } },
      { t:"Run (Agility)", fn:()=>{
          if (check("agi",10)){
            say(["You take the alleys at a dead sprint and leave them holding your reasons."]); }
          else { const t2=Math.floor(p.gold*0.15); p.gold-=t2;
            say(["A hand catches your collar. You buy your speed with fifteen percent of your purse."], ()=>{ hurt(1,null); });
            saveGame(); } } },
      { t:"Fight", fn:()=>{
          const fhp=10+Math.floor(game.week/208);
          startCombat({ n:who+"'s Knife", mhp:fhp, hp:fhp, atk:2+Math.floor(p.gold/160), tr:null,
            artSeed:irnd(2147483647), human:true }); } }
    ]);
  });
}
function nearBuilding(b, px, py){
  if (b.home){
    return Math.abs(px-b.door[0])<=1 && Math.abs(py-b.door[1])<=1;
  }
  return (px>=b.x-1 && px<=b.x+b.w && py>=b.y-1 && py<=b.y+b.h);
}
function enterBuilding(b){
  switch (b.id){
    case "guild": openGuild(); break;
    case "market": openMarket(); break;
    case "clinic": openClinic(); break;
    case "church": openChurch(); break;
    case "tavern": openTavern(); break;
    case "office": openOffice(); break;
    case "yard": openYard(); break;
    case "gate": openGate(); break;
    case "home": openHome(); break;
  }
}

function buyRumor(){

    { t:"Sell loot ("+lootValue()+"g on your person)", fn:sellMenu },

function lootValue(){ let s=0; for (const it of game.player.inv) if (it.kind==="loot") s+=it.v*it.qty; return s; }
function sellMenu(){
  const p=game.player;
  const opts=p.inv.filter(i=>i.kind==="loot").map(i=>({
    t:i.n+" x"+i.qty+" - "+fmt(i.v*i.qty),
    fn:()=>{ const val=i.v*i.qty; p.gold+=val; p.inv.splice(p.inv.indexOf(i),1);
      addFloat("+"+fmt(val), PAL.coin, W/2, 92); checkTitles();
      say(["The broker bites the "+i.n+" thoughtlessly, then pays "+fmt(val)+"."], ()=>openMarket()); }
  }));

  opts.push({ t:"SELL EVERYTHING ("+fmt(all)+")", fn:()=>{
    p.gold+=all; p.inv=p.inv.filter(i=>i.kind!=="loot");
    addFloat("+"+fmt(all), PAL.coin, W/2, 92); checkTitles();

function openChurch(){
  const p=game.player;
  const intro=["The Church of Cinders: beeswax smoke, a bowl of grave-dirt, pews worn smooth by people praying against the same weather.",
               "Funerals are taken here. So are the almost-dead."];
  const news=drainNews();
  say(news.length? intro.concat(news) : intro, ()=>{
    if (!game.flags.unburied) game.flags.unburied=[];
    const list=game.flags.unburied;
    const opts=[
      { t:"Pray (costs nothing but time)", fn:()=>{
          p.stam=clamp(p.stam-5,0,maxStam());
          if (Math.random()<0.2+p.wll*0.02){
            p.hp=clamp(p.hp+3,0,p.maxhp);
            say(["You kneel in the dust of a hundred funerals. Nothing answers. But something in you stands easier.","(+3 HP)"], ()=>openChurch()); saveGame(); }
          else say(["You kneel until your knees ache. The silence is total, honest, and utterly uninterested.","Perhaps this too is practice."], ()=>openChurch()); } },
      { t:"Light a candle for the dead (3g) - +2 HP", fn:()=>{
          if (p.gold<3){ say(["You have less than a candle. The sexton pretends not to have heard."], ()=>openChurch()); return; }
          p.gold-=3; p.hp=clamp(p.hp+2,0,p.maxhp);
          say(["You light it among the others. Every one of them is someone not forgotten.","Somebody once lit one for you, probably. It didn't take."], ()=>openChurch()); saveGame(); } }
    ];
    if (list.length){
      opts.push({ t:"Pay for "+list.length+" funeral"+(list.length>1?"s":"")+" (30g)",
        d:"Unburied: "+list.join(", ").slice(0,60),
        fn:()=>{
          if (p.gold<30){ say(["The sexton names the price a second time: thirty gold, shovel-work included."], ()=>openChurch()); return; }
          const names=list.join(", ");
          p.gold-=30; advanceWeeks(1);
          game.flags.unburied=[];
          setBanner(["FUNERAL AT CINDERS","You saw them under: "+names.slice(0,42)+"."]);
          if (p.wounds.length){ p.wounds.splice(0,1);
            say(["Bells. Grave-dirt. Somebody's real tears, maybe yours.","Grief-work closes a wound of your own. ("+names+")"], ()=>openChurch()); }
          else { p.wll=Math.min(10,p.wll+1);
            say(["Bells. Grave-dirt. The sexton says the dead attend those who attend them.","Will rises to "+p.wll+". ("+names+")"], ()=>openChurch()); }
          saveGame(); } });
    } else {
      opts.push({ t:"Ask about funerals", fn:()=>{
          say(["\"Only the paid get buried proper,\" the sexton says. \"The rest go to the pits. It is arithmetic, not cruelty. Well - both.\""], ()=>openChurch()); } });
    }
    if (p.spouse) opts.push({ t:"Renew your vows with "+p.spouse.name.split(" ")[0], fn:()=>{
        p.stam=clamp(p.stam+15,0,maxStam());
        say(["Old words, older dust, both rings warmed by the same candle.","You walk out lighter than the mathematics of it explains."], ()=>openChurch()); saveGame(); } });
    opts.push({ t:"Leave", fn:()=>{} });
    showMenu("CHURCH OF CINDERS", opts);
  });
}

function train(stat, label){
  const p=game.player;
  if (p.gold<10){ say(["The yard master spits. \"Coin first, sweat second.\""]); return; }
  if (p.stam<25){ say(["You can barely lift your arms. Rest first."]); return; }
  p.gold-=10; p.stam-=25;
  advanceWeeks(2);
  if (Math.random()<0.55){ p[stat]+=1; say(["Weeks of drills pay off. "+label+" rises to "+p[stat]+"."]); }
  else say(["You drill until your hands burn. Nothing comes easy today."]);
  saveGame();
}

function openTavern(){
  const p=game.player;
  const intro=["The Flayed Lamp: tallow light, soup with opinions, and every second patron counting someone absent."];
  const news=drainNews();
  say(news.length? intro.concat(news) : intro, ()=>{
    const opts=[
      { t:"Hot meal (6g) - stamina +40", fn:()=>{

          p.gold-=6; p.stam=clamp(p.stam+40,0,maxStam());

function rosterMenu(){
  const p=game.player;
  const rows=game.npcs.map(np=>{
    const age=Math.floor(np.ageWeeks/52);
    let st;
    if (np.dead) st="died at "+age;
    else if (np===p.spouse) st="your spouse";
    else if (np===p.partner) st="holds your eye ("+affWord(np.aff)+")";
    else if (np.marriedTo!==null) st="wed to "+np.marriedTo+(np.kids? " ("+np.kids+" children)":"");
    else if (np.parentOfYou) st="your parent, still pouring one for your old life";
    else st="unattached";
    return { t:np.name.split(" ")[0]+" - "+age+"y - "+st, fn:openTavern };
  });
  showMenu("THE ROOM TONIGHT", rows.concat([{t:"Back", fn:openTavern}]));
}
function listenTavern(){
  const p=game.player;
  if (p.gold<8){ say(["You have empty pockets and excellent hearing."], ()=>openTavern()); return; }
  p.gold-=8;
  say([pick([
    "\"The Cessgate worms burrow up through the Ossuary floors these days.\"",
    "\"Soldiers go down, lovers come back. Choose which you are before you pick a door.\"",
    "\"You can marry here, or you can die rich. The city accepts both documents.\"",
    "\"Never eat anything down there that offers itself.\"",
    "\"The Long Mother is a story. A story with fifty hands, but a story.\""
  ])], ()=>openTavern());
}
function courtMeet(){
  const p=game.player;
  if (p.partner || p.spouse){ say(["You've already given your word. The Lamp does not host liars."], ()=>openTavern()); return; }
  const singles=game.npcs.filter(x=>!x.met && !x.dead && x.marriedTo===null && !x.parentOfYou);
  if (singles.length){
    const np=pick(singles); np.met=true;
    p.partner=np;
    say(["You drift toward "+np.name+" ("+Math.floor(np.ageWeeks/52)+"y).", np.desc], ()=>courtWith());
  } else if (!game.npcs.some(x=>!x.met && !x.dead && x.marriedTo===null && !x.parentOfYou)){
    say(["Nobody here is unattached, and nobody new has drifted in.",
         "Time passes for everyone while you are underground. That is the arrangement."], ()=>openTavern());
  } else {
    say(["The same faces, night after night. Familiar, at least."], ()=>openTavern());
  }
}
function courtWith(){
  const pt=game.player.partner;
  if (!pt){ return; }
  if (pt.dead || pt.marriedTo!==null){
    game.player.partner=null;
    say([pt.dead? "She is dead. The lamp in the shop burns for the both of you now."
               : "She has wed "+pt.marriedTo+" while you emptied rooms of their horrors."], ()=>openTavern());
    return;
  }
  showMenu(pt.name+" ("+Math.floor(pt.ageWeeks/52)+"y) - "+affWord(pt.aff), [
    { t:"Talk", fn:()=>partnerTalk(pt) },
    { t:"Give a gift", fn:()=>giftMenu(pt) },
    { t:"Declare your intent"+(countItem("Bone Ring")? " (a Bone Ring in your pack)":""), fn:proposeCourt },
    { t:"Back", fn:openTavern }
  ], openTavern);
}
function affWord(a){ return a>=80?"hopeless for you":a>=50?"warms to you":a>=25?"tolerates you":"cold"; }
function partnerTalk(pt){
  pt.aff=clamp(pt.aff+4,0,100);
  const bank=(pt.talks && pt.talks.length)? pt.talks : GENERIC_TALKS;
  say([pick(bank)], ()=>courtWith());
}
function giftMenu(pt){
  const p=game.player;
  const opts=p.inv.map(i=>({
    t:i.n+" x"+i.qty+(i.kind==="gift"?" - true gift":""),
    fn:()=>{
      let gain=clamp(Math.round(i.v/10),1,14);
      if (i.kind==="gift") gain=18;
      useFromInv(i.n,1); pt.aff=clamp(pt.aff+gain,0,100);
      say(["You offer the "+i.n+". "+pt.name.split(" ")[0]+" accepts it like it means something.",
           "Affection +"+gain+"."], ()=>courtWith());
    }
  }));
  if (!opts.length){ say(["Empty hands. Somehow that reads as honesty, in here."], ()=>courtWith()); return; }
  showMenu("GIFT WHAT?", opts.concat([{t:"Back", fn: ()=>courtWith()}]), ()=>courtWith());
}
function proposeCourt(){
  const pt=game.player.partner, p=game.player;
  if (!pt) return;
  if (pt.dead || pt.marriedTo!==null){
    p.partner=null;
    say([pt.dead? "You never asked in time. The city took the door before you reached it."
               : pt.name+" wed "+pt.marriedTo+" while you were down there."], ()=>openTavern());
    return;
  }
  if (!countItem("Bone Ring")){
    say(["Your intent is plain. Your pockets are not. A Bone Ring from the Grave-Market would stand you in good stead."], ()=>courtWith());
    return;
  }
  if (pt.aff<50){
    pt.aff=clamp(pt.aff-5,0,100);
    say([pt.name+" looks at the ring, then at you. \"A ring is not a history. Ask me again when I know you.\""], ()=>courtWith());
    return;
  }
  if (!p.house){
    say([pt.name+" laughs - not cruelly. \"Marry you to what? A bunk in a guild dorm? Own four walls first.\""], ()=>courtWith());
    return;
  }
  useFromInv("Bone Ring");
  p.spouse=pt; p.partner=null; pt.aff=100; pt.marriedTo="you";
  earnTitle("Wed Under the Lamp");
  say([pt.name+" turns the ring in the tallow light. Then she closes your hand over it.",
       "\"Wear it till I put it back on you properly. Home. Tonight.\"",
       "You are wed. The Lamp cheers out of habit, then sincerity."]);
  advanceWeeks(2);
  saveGame();
}
function spouseScene(){
  const p=game.player;
  say(["You sit with "+p.spouse.name+" ("+Math.floor(p.spouse.ageWeeks/52)+"y). For a while, the city is just noise outside your own four walls.",
       "\"Stamina up,\" "+p.spouse.name.split(" ")[0]+" mutters into your shoulder. That is married for 'I love you.'"], ()=>openTavern());
}

      { t:"Buy the Leaning Tenement (250g)", d:"A crooked two-room home in Ward Nine. Good bones. Somewhere.", fn:buyHouse },

function buyHouse(){

  earnTitle("Householder of Ward Nine");
  say(["Keys. A deed with a wax stamp. A door that only leans when it rains.",
       "The Leaning Tenement is yours. When you die, it stays. That is the whole point of it."]);

}

function openHome(){
  const p=game.player;
  if (!p.house){ say(["Wrecked rooms behind a rotted door. Yours someday, maybe. If you live and pay."]); return; }
  const lines=["Home. The floor slants, the roof holds, the dead stay outside.",
               p.spouse? p.spouse.name+" has the kettle on." : "No one waits up for you. Yet."];
  if (p.child) lines.push(p.child.name+" babbles at a dust mote.");
  say(lines, ()=>{
    const opts=[
      { t:"Sleep (7 days, stamina to full)", fn:homeRest },
      { t:"Eat from the pantry (stamina +25)", fn:()=>{ const q=game.player;
          if (q.stam>=maxStam()){ say(["You are not hungry. The pantry disagrees and wins later."], ()=>openHome()); return; }
          q.stam=clamp(q.stam+25,0,maxStam()); say(["Bread of questionable ancestry. It does its job."], ()=>openHome()); } }
    ];
    if (p.spouse && p.upgrades.indexOf("nursery")>=0 && !p.child && p.tryChild!==1)
      opts.push({ t:"Try for a child", fn:tryForChild });
    if (p.child) opts.push({ t:"Teach "+p.child.name+" ("+cap(childStage(p.child))+")", fn:teachChild });
    opts.push({ t:"Leave", fn:()=>{} });
    showMenu("HOME", opts, ()=>{});
  });
}
function tryForChild(){
  const p=game.player;
  p.tryChild=1; advanceWeeks(4);
  say(["You and "+p.spouse.name.split(" ")[0]+" decide, quietly, to chance it."], ()=>openHome());
  saveGame();
}
function childStage(c){ return c.weeks<52?"newborn":c.weeks<156?"toddler":c.weeks<416?"child":"grown tall"; }
function homeRest(){
  const p=game.player;
  advanceWeeks(7);
  p.stam=maxStam();
  p.hp=clamp(p.hp+healPerRest(),0,p.maxhp);
  const msgs=["Days blur into soup and sleep. You heal. You dread the doors again. Good. That is health."];
  if (p.tryChild===1){
    p.tryChild=2;
    p.child={ name:pick(["Wren","Cob","Liss","Mote","Brack","Sable"]), weeks:0, spark:0 };
    msgs.unshift("A child is born into the leaning house. Wailing. Unreasonable. Alive.",
                 "You and "+(p.spouse? p.spouse.name.split(" ")[0] : "the midwife")+" name the scrap "+p.child.name+".");
    checkTitles();
  }
  if (p.wounds.length && p.spouse && p.upgrades.indexOf("hearth")>=0){
    p.wounds.splice(0,1);
    msgs.unshift("Your spouse sews and scolds. The worst wound closes, badly but truly.");
  }
  const news=drainNews();
  msgs.push(...news);
  say(msgs, ()=>openHome());
  saveGame();
}
function teachChild(){
  const c=game.child;
  if (!c) return;
  c.spark+=1;
  say([pick([
    "You teach "+c.name+" the names of herbs that lie.",
    "You show "+c.name+" how to bind a rope. The knot bites. Twice. Then it holds.",
    c.name+" asks what the Openings are. You describe them honestly. No tears. Good."
  ]), c.name+"'s spark grows. (Spark "+c.spark+")"], ()=>openHome());
  advanceWeeks(8);
  saveGame();
}

/* ----- time ----- */
function advanceWeeks(n){
  const p=game.player;
  const before=Math.floor(game.week/52);
  game.week+=n;
  if (p.child) p.child.weeks+=n;
  const after=Math.floor(game.week/52);
  if (after>before){
    if (after>=40){ p.maxhp=Math.max(12,p.maxhp-(after-before)); p.hp=clamp(p.hp,0,p.maxhp); }
  }
  if (p.spouse && p.upgrades.indexOf("cellar")>=0 && Math.random()<0.5)
    p.gold+=4+irnd(8);
  simulateNPCs(n);
}
/* Vharn does not wait for you. NPCs age, wed, multiply, and die. */
function simulateNPCs(n){
  const p=game.player;
  game.flags.news = game.flags.news||[];
  for (const np of game.npcs){
    if (np.dead) continue;
    np.ageWeeks+=n;
    const nage=Math.floor(np.ageWeeks/52);
    if (np.marriedTo===null && np.ageWeeks>=52*20 &&
        np!==p.spouse && Math.random()<0.005*n){
      np.marriedTo=pick(NPC_SPOUSES);
      if (np===p.partner){
        p.partner=null;
        game.flags.news.push(np.name.split(" ")[0]+" has wed "+np.marriedTo+". You were in the dark. You are always in the dark.");
      } else game.flags.news.push(np.name.split(" ")[0]+" married "+np.marriedTo+".");
      continue;
    }
    if (np.marriedTo!==null && Math.random()<0.008*n) np.kids++;
    if (nage>=55 && Math.random()<0.004*n){
      np.dead=true;
      if (!game.flags.unburied) game.flags.unburied=[];
      if (game.flags.unburied.length<6) game.flags.unburied.push(np.name);
      if (np===p.spouse){
        p.spouse=null; np.widowed=true;
        game.flags.news.push(np.name.split(" ")[0]+" died last winter, in her bed, "+nage+" years old. No bell rang. You still sleep on your side.");
      } else {
        game.flags.news.push(np.name.split(" ")[0]+" died last winter. The Lamp poured one out on the floorboards.");
        if (np===p.partner) p.partner=null;
      }
    }
  }
  game.npcClock=(game.npcClock||0)+n;
  while (game.npcClock>=52){
    game.npcClock-=52;
    const taken=game.npcs.map(x=>x.name);
    const names=NPC_ARRIVAL_NAMES.filter(nm=>taken.indexOf(nm)<0);
    if (names.length && game.npcs.length<12){
      const nm=pick(names);
      const age=18+irnd(8);
      game.npcs.push({ name:nm, desc:pick(NPC_ARRIVAL_DESCS), age:age, ageWeeks:age*52, talks:GENERIC_TALKS.slice(),
        marriedTo:null, dead:false, widowed:false, kids:0, parentOfYou:false, aff:0, met:false });
      game.flags.news.push(nm.split(" ")[0]+" drifted into Vharn. Nobody asked her business; that is the custom.");
    }
  }
}
function drainNews(){
  const news=(game.flags.news||[]).slice();
  game.flags.news=[];
  return news;
}

/* ----- the gate ----- */
function openGate(){
  say(["South of the tanneries, the city is cracked like old bread. The cracks breathe.",
       "Adventurers call the cracks Openings. The city calls them nothing at all."], ()=>{
    const opts=OPENINGS.map(o=>({
      t:o.name+"  (danger "+"|".repeat(o.tier)+")",
      d:o.desc,
      fn:()=>launchDelve(o)
    }));
    opts.push({ t:"Not today", fn:()=>{} });
    showMenu("GATE OF OPENINGS - choose a crack in the world", opts);
  });
}

/* ============================================================
   DUNGEONS
   ============================================================ */
function launchDelve(opening){
  if (typeof opening==="number") opening=OPENINGS[opening];
  const d={ opening:opening, depth:1, floors:[], px:0, py:0, steps:0 };
  game.dungeon=d;
  game.state="dungeon";
  game.player.delves++;
  genFloor(d);
  say(["You descend into "+opening.name+".",
       "The city noise dies in about nine steps. Something else starts."]);
}
function genFloor(d){
  const rg=mulberry(irnd(2147483647));
  const w=44,h=34;
  const grid=[];
  for (let y=0;y<h;y++) grid.push(new Array(w).fill("#"));
  const rooms=[];
  const nRooms=9+irnd(3);
  for (let i=0;i<nRooms*4 && rooms.length<nRooms;i++){
    const rw=4+irnd(6), rh=4+irnd(4);
    const rx=2+irnd(w-rw-4), ry=2+irnd(h-rh-4);
    const room={x:rx,y:ry,w:rw,h:rh,cx:rx+(rw>>1),cy:ry+(rh>>1)};
    if (rooms.some(r=>Math.abs(r.cx-room.cx)<9 && Math.abs(r.cy-room.cy)<8)) continue;
    rooms.push(room);
    for (let y=room.y;y<room.y+room.h;y++) for (let x=room.x;x<room.x+room.w;x++) grid[y][x]=".";
  }
  rooms.sort((a,b)=>(a.cx+a.cy)-(b.cx+b.cy));
  const carve=(x,y)=>{ grid[y][x]="."; };
  for (let i=1;i<rooms.length;i++){
    const a=rooms[i-1], b=rooms[i];
    let x=a.cx,y=a.cy;
    while (x!==b.cx){ carve(x,y); x+=Math.sign(b.cx-x); }
    while (y!==b.cy){ carve(x,y); y+=Math.sign(b.cy-y); }
    carve(x,y);
  }
  if (rooms.length>4){
    const a=rooms[0], b=rooms[rooms.length-1];
    let x=a.cx,y=a.cy;
    while (x!==b.cx){ carve(x,y); x+=Math.sign(b.cx-x); }
    while (y!==b.cy){ carve(x,y); y+=Math.sign(b.cy-y); }
  }
  const floor={ w:w,h:h,grid:grid,rooms:rooms, seen:new Set(), events:[], visitedRooms:new Set() };
  const evs=floor.events;
  const start=rooms[0];
  floor.grid[start.cy][start.cx]="<";
  const far=rooms[rooms.length-1];
  floor.grid[far.cy][far.cx]=">";
  const freeTiles=[];
  for (const r of rooms){
    for (let y=r.y;y<r.y+r.h;y++) for (let x=r.x;x<r.x+r.w;x++){
      if ((x===start.cx&&y===start.cy)||(x===far.cx&&y===far.cy)) continue;
      freeTiles.push([x,y]);
    }
  }
  shuffle(freeTiles, rg);
  let fi=0;
  const nextFree=()=>freeTiles[fi++];
  const tierNow=clamp(d.opening.tier+(d.depth-1),1,3);
  const nLoot=3+irnd(3);
  for (let i=0;i<nLoot;i++){ const t=nextFree(); if(!t) break;
    evs.push({x:t[0],y:t[1],type:"loot",items:rollLoot(tierNow,1+irnd(2))}); }
  const nObs=2+irnd(2);
  for (let i=0;i<nObs;i++){ const t=nextFree(); if(!t) break;
    evs.push({x:t[0],y:t[1],type:"obstacle", kind:pick(["rubble","spikes","gas","chasm"])}); }
  if (irnd(2)===0 || tierNow>1){ const t=nextFree(); if(t) evs.push({x:t[0],y:t[1],type:"puzzle", kind:pick(["riddle","levers","sink"])}); }
  if (irnd(2)===0){ const t=nextFree(); if(t) evs.push({x:t[0],y:t[1],type:"corpse"}); }
  if (tierNow>1 && irnd(3)===0){ const t=nextFree(); if(t) evs.push({x:t[0],y:t[1],type:"shrine"}); }
  d.floors.push(floor);
  d.floorIx=d.floors.length-1;
  d.px=start.cx; d.py=start.cy;
  d.tierNow=tierNow;
  markSeen();
}
function shuffle(a, rg){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(rg()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } }
function curFloor(){ return game.dungeon.floors[game.dungeon.floorIx]; }
function tileAt(x,y){
  const f=curFloor();
  if (x<0||y<0||x>=f.w||y>=f.h) return "#";
  return f.grid[y][x];
}
function tierEnemy(){
  const tier=game.dungeon.tierNow;
  const base=HORRORS[tier][irnd(HORRORS[tier].length)];
  const hp=Math.max(3,Math.round(base.hp*(0.85+Math.random()*0.3)));
  return { n:base.n, mhp:hp, hp:hp, atk:base.atk, tr:base.tr, artSeed:irnd(2147483647), human:false };
}
function markSeen(){
  const d=game.dungeon, f=curFloor();
  const R=4;
  for (let y=d.py-R;y<=d.py+R;y++) for (let x=d.px-R;x<=d.px+R;x++){
    if (x>=0&&y>=0&&x<f.w&&y<f.h && Math.hypot(x-d.px,y-d.py)<=R) f.seen.add(x+","+y);
  }
}
function tryMove(dx,dy){
  const d=game.dungeon;
  const nx=d.px+dx, ny=d.py+dy;
  if (tileAt(nx,ny)==="#") return;
  d.lastDx=dx; d.lastDy=dy;
  d.px=nx; d.py=ny; d.steps++;
  markSeen();
  const p=game.player;
  p.stam=clamp(p.stam-0.12,0,maxStam());
  if (p.stam<=0 && d.steps%4===0){
    p.hp-=1;
    if (p.hp<=0){ die("Your body quit in the"+pick([" dark"," water"," deep"])+" of "+d.opening.name+"."); return; }
  }
  const f=curFloor();
  const room=f.rooms.find(r=>nx>=r.x&&nx<r.x+r.w&&ny>=r.y&&ny<r.y+r.h);
  if (room && !f.visitedRooms.has(room.x+":"+room.y)){
    f.visitedRooms.add(room.x+":"+room.y);
    const evHere=f.events.find(e=>e.x===nx&&e.y===ny);
    if (!evHere && Math.random()<0.30){
      const roll=Math.random();
      if (roll<0.55) startCombat(tierEnemy());
      else if (roll<0.80) meetAdventurer();
    }
  }
  const ev=f.events.find(e=>e.x===nx&&e.y===ny);
  if (ev && !ev.done) triggerEvent(ev);
}
function stepBack(){
  const d=game.dungeon;
  if (d.lastDx!==undefined){ d.px-=d.lastDx; d.py-=d.lastDy; }
  else d.px-=1;
}

/* ----- dungeon events ----- */
function triggerEvent(ev){
  switch (ev.type){
    case "loot": {
      ev.done=true;
      const got=[];
      for (const it of ev.items){
        if (addItem(it.n,it.v,it.kind)){
          got.push(it.n);
          const r=lootRarity(it.v);
          addFloat(it.n+" - "+r.t, r.col, W/2+(irnd(96)-48), 76);
          if (r.t==="RELIC"){ kicker(8); setBanner(["A RELIC FROM THE DARK","The "+it.n+". Word of it will reach the market."]); }
        }
      }
      if (got.length) say(["Wedged in the dark: "+got.join(", ")+"."]);
      else say(["Something worth taking, but your pack says otherwise."]);
      break; }
    case "obstacle": obstacleEvent(ev); break;
    case "puzzle": puzzleEvent(ev); break;
    case "corpse": corpseEvent(ev); break;
    case "shrine": shrineEvent(ev); break;
  }
}
function obstacleEvent(ev){
  const p=game.player;
  if (ev.kind==="rubble"){
    showText(["A seam of collapsed roofing. Slabs the size of doors, packed like teeth."], ()=>{
      showMenu("RUBBLE", [
        { t:"Force it (Strength)", fn:()=>{ ev.done=true;
            if (check("str",9)) say(["You brace, heave, and lose a layer of skin. The way opens."]);
            else hurt(2,"A slab answers with interest. You bleed.");
            saveGame(); } },
        { t:"Wiggle through (Agility)", fn:()=>{ ev.done=true;
            if (check("agi",9)) say(["You fold yourself through a gap a cat would refuse."]);
            else hurt(2,"You squeeze through, minus some meat.");
            saveGame(); } },
        { t:"Leave it", fn:()=>{ ev.done=true; stepBack(); } }
      ]);
    });
  } else if (ev.kind==="spikes"){
    showText(["The floor bristles with rusted spikes - grown, not placed. Someone's old blood browns the tips."], ()=>{
      showMenu("SPIKES", [
        { t:"Cross carefully (Agility)", fn:()=>{ ev.done=true;
            if (check("agi",10)) say(["You pick a line between the teeth. Across."]);
            else hurt(4,"A spike finds the meat of your calf.");
            saveGame(); } },
        { t:"Use Rope & Hook", fn:()=>{ ev.done=true;
            if (countItem("Rope & Hook")){ useFromInv("Rope & Hook",1);
              say(["You rig a line and cross like a sane person."]); }
            else { say(["No rope. Definitely a problem now."]); stepBack(); }
            saveGame(); } },
        { t:"Back off", fn:()=>{ ev.done=true; stepBack(); } }
      ]);
    });
  } else if (ev.kind==="gas"){
    showText(["A pocket of air that hates you: sweet, wet, wrong. Your eyes stream. Your knees disagree with standing."], ()=>{
      showMenu("FOUL AIR", [
        { t:"Hold your breath and press on (Will)", fn:()=>{ ev.done=true;
            if (check("wll",10)) say(["You refuse the air's opinion. Through."]);
            else { hurt(3,"Your lungs will remember this for days."); p.stam=clamp(p.stam-20,0,maxStam()); }
            saveGame(); } },
        { t:"Drink Antitoxin", fn:()=>{ ev.done=true;
            if (countItem("Antitoxin")){ useFromInv("Antitoxin",1);
              say(["Bitter. Effective. Through."]); }
            else { say(["Nothing in your pack but regret."]); stepBack(); }
            saveGame(); } },
        { t:"Back off", fn:()=>{ ev.done=true; stepBack(); } }
      ]);
    });
  } else {
    showText(["The floor simply ends. Below: a wind that rises from somewhere with intent."], ()=>{
      showMenu("CHASM", [
        { t:"Use Rope & Hook", fn:()=>{ ev.done=true;
            if (countItem("Rope & Hook")){ useFromInv("Rope & Hook",1);
              say(["Anchor, swing, land, breathe."]); }
            else { say(["No rope, no wings. Hmm."]); stepBack(); }
            saveGame(); } },
        { t:"Jump (Agility)", fn:()=>{ ev.done=true;
            if (check("agi",11)) say(["You fly like a frightened, beautiful idiot. Across."]);
            else hurt(8,"You hit the far lip badly. The wind laughs in a mammal way.");
            saveGame(); } },
        { t:"Back off", fn:()=>{ ev.done=true; stepBack(); } }
      ]);
    });
  }
}
function puzzleEvent(ev){

        { t:"Give it blood (5 HP)", fn:()=>{ ev.done=true;

function corpseEvent(ev){
  showText(["A delver, long dead. Leathers gone to varnish. The pack is intact. The fingers are very long."], ()=>{

function shrineEvent(ev){

/* ----- adventurer encounters ----- */
function meetAdventurer(){
  const p=game.player;
  const who=pick(ADV_NAMES);
  const kind=Math.random();
  if (kind<0.45){
    showText(["A lantern bobs into view: another delver - "+who+", by the gear, someone who has crawled deeper than you."], ()=>{
      showMenu(who.toUpperCase(), [
        { t:"Share a ration & trade news", fn:()=>{
            if (countItem("Ration")){ useFromInv("Ration",1); p.stam=clamp(p.stam+10,0,maxStam());
              const hint=pick(OPENINGS);
              say(["You split a ration in the dark. "+who+" trades you a rumor about "+hint.name+".",
                   "Good company. Rare down here."]); }
            else say(["You have no ration. "+who+" shrugs: \"Poverty is a door too.\""]);
            saveGame(); } },
        { t:"Trade - sell loot at a good price", fn:()=>{
            const lo=p.inv.filter(i=>i.kind==="loot");
            if (!lo.length){ say(["Nothing worth a trade."]); return; }
            const it=lo[0]; const val=Math.round(it.v*1.3);
            p.gold+=val; p.inv.splice(p.inv.indexOf(it),1);
            say([who+" pays "+fmt(val)+" for your "+it.n+". \"Ward 6 collectors. Don't ask.\""]);
            saveGame(); } },
        { t:"Part ways", fn:()=>{} }
      ]);
    });
  } else if (kind<0.75){
    showText(["A voice from an alcove: \"Toll. Thirty percent. Or we discuss the alternative.\"",
              "Numbers resolve into bodies. You are in the math now."], ()=>{
      showMenu(who.toUpperCase()+"'S BOYS", [
        { t:"Pay the toll", fn:()=>{
            const heavy=p.gold>=300;
            let toll=Math.floor(p.gold*(heavy?0.4:0.3));
            let line=who+" counts your coin with professional boredom. \"Lovely doing business.\"";
            if (heavy) line=who+" weighs your purse a moment longer than needed. \"You looked heavy.\"";
            const lo2=p.inv.filter(i=>i.kind==="loot");
            if (p.gold<40 && lo2.length){
              const it=lo2[lo2.length-1]; toll=0; p.inv.splice(p.inv.indexOf(it),1);
              line=who+" shrugs at your near-empty purse and takes the "+it.n+" instead. \"In kind, then.\"";
            }
            p.gold-=toll;
            say([line]); saveGame(); } },
        { t:"Talk them down (Wits)", fn:()=>{
            if (check("wit",11)) say(["You convince them you are cursed - inhabited by something with opinions. Nobody wants that cargo."]);
            else say(["They laugh. Then they beat the toll out of you, and a little extra."], ()=>{
              hurt(4,null); p.gold=Math.floor(p.gold*0.6); });
            saveGame(); } },
        { t:"Fight", fn:()=>{ startCombat({ n:who+"'s Cutter", mhp:12+game.dungeon.tierNow*4, hp:12+game.dungeon.tierNow*4,
            atk:2+game.dungeon.tierNow, tr:null, artSeed:irnd(2147483647), human:true }); } },
        { t:"Run (Agility)", fn:()=>{
            if (check("agi",10)) say(["You melt into the dark. Footsteps curse behind you."]);
            else say(["They catch your pack strap."], ()=>{ hurt(2,null); p.gold=Math.floor(p.gold*0.85); });
            saveGame(); } }
      ]);
    });
  } else {
    showText([who+" blocks the corridor, blade drawn, grinning like it is a festival.",
              "\"Beat me and take my kit. Lose and I take yours. Rules are rules.\""], ()=>{
      showMenu(who.toUpperCase(), [
        { t:"Accept the duel", fn:()=>{ startCombat({ n:who+" the Duelist", mhp:14+game.dungeon.tierNow*3, hp:14+game.dungeon.tierNow*3,
            atk:2+game.dungeon.tierNow, tr:null, artSeed:irnd(2147483647), human:true, duel:true }); } },
        { t:"Talk it out (Wits)", fn:()=>{
            if (check("wit",9)){ say(["You point out that screaming draws the things with many opinions.",
              who+" concedes and shares a flask."]); p.stam=clamp(p.stam+10,0,maxStam()); }
            else say(["\"Coward, then.\" The word follows you deeper than the corridor does."]); } },
        { t:"Walk away", fn:()=>{ stepBack(); } }
      ]);
    });
  }
}

/* ----- checks, wounds, death ----- */
function check(stat, dc){
  const p=game.player;
  return d10()+p[stat]-p.wounds.length>=dc;
}
function hurt(n, msg){
  const p=game.player;
  p.hp-=n;
  const lines=[];
  if (msg) lines.push(msg);
  lines.push("(-"+n+" HP. "+p.hp+"/"+p.maxhp+")");
  if (p.hp<=0){ die("Something in "+(game.dungeon? game.dungeon.opening.name : "Vharn")+" finished you."); return; }
  if (p.hp<=p.maxhp*0.3 && Math.random()<0.4){
    const limb=pick(["arm","ribs","leg","hand","eye"]);
    if (p.wounds.indexOf(limb)<0){
      p.wounds.push(limb);
      lines.push("A wound you will feel a long time: your "+limb+".");
    }
  }
  say(lines);
  saveGame();
}
function die(cause){
  const p=game.player;
  game.combat=null;
  const age=Math.floor(game.week/52);
  const ep=[ "You die at "+age+". "+cause ];
  if (p.child && p.child.weeks>=728){
    ep.push("But blood remembers: "+p.child.name+", "+Math.floor(p.child.weeks/52)+" years old, old enough to hate the doors and grown enough to open them.");
    ep.push("What is inherited: the house and its improvements, " + (p.weapon.d>2? "your "+p.weapon.n+", ":"") + "the leanings of your body, and a spark of "+p.child.spark+".");
    ep.push("The save stands. Vharn shrugs. The lamp is relit.");
    ep.push("[ENTER] take up the knife as "+p.child.name+".");
    game.state="legacy";
    game.flags.epilogue=ep;
    return;
  }
  game.state="dead";
  wipeSave();
  if (p.child){
    ep.push(p.spouse? p.spouse.name+" keeps the lamp lit for a child too young to hate the doors yet. The house leans. The city waits."
                    : "Your child will be told you drowned. In water, in dark - the story grows teeth either way.");
  } else if (p.spouse){
    ep.push(p.spouse.name+" sells your kit, keeps the house, and tells the Lamp you died rich. Widows survive Vharn. She will.");
  } else {
    ep.push("No family, no legend. The wall in the Guild Hall gains a name it will lose in a month's rain.");
  }
  ep.push("Kills "+p.kills+" | delves "+p.delves+" | deepest depth "+p.deep+" | "+fmt(p.gold)+" unspent");
  if (p.titles.length) ep.push("The wards knew you as: "+p.titles.join(", ")+".");
  ep.push("Press ENTER for a new name in the book.");
  game.flags.epilogue=ep;
}

/* ============================================================
   COMBAT
   ============================================================ */
function startCombat(enemy){
  enemy.maxhp=enemy.mhp||enemy.hp;
  const p=game.player;
  if (!p.bestiary[enemy.n]) p.bestiary[enemy.n]={ met:game.week, killed:false };
  const lore=BESTIARY_DESC[enemy.n] || (enemy.human? "A delver with a knife and an argument. Vharn breeds them faster than grief does." : "Something the city never bothered to name twice.");
  const origin= game.state==="base"? "base":"dungeon";
  game.combat={ e:enemy, log:["The "+enemy.n+" comes out of the dark.", lore], turn:"player", choice:0, guard:false, won:false, critKill:false, riposte:false, origin:origin };
  if (!foeKnown(enemy.n)) game.combat.log.push("You have never seen its like up close. Survive it, and you will know it.");
  game.state="combat";
}
function clog(s){ const c=game.combat; c.log.push(s); if (c.log.length>4) c.log.shift(); }
function playerAtk(){ const p=game.player; return p.weapon.d + irnd(3) + Math.floor(p.str/2); }
function playerDef(){ return game.player.armor.a; }
/* ----- the dice (dopamine layer) ----- */
let worldTick=0;
function armDice(kind, seed){
  const c=game.combat;
  c.dice={ kind:kind, v1:1+irnd(6), v2:1+irnd(6), s1:6, s2:10, st1:false, st2:false, seed:seed };
  if (game.player.hp<=game.player.maxhp*0.25){ c.dice.s1=13; c.dice.s2=22; }
}
function stopDie(d,ix){
  if (ix===0 && !d.st1) d.st1=true;
  if (ix===1 && !d.st2) d.st2=true;
}
function rollDiceFrame(){
  const c=game.combat, d= gDice || (c&&c.dice);
  if (!d) return false;
  if (tap("z")){ if (!d.st1) d.st1=true; else d.st2=true; }
  if (tap("x")){ if (!d.st2) d.st2=true; else d.st1=true; }
  if (!d.st1) d.v1=1+Math.floor(worldTick/d.s1)%6;
  if (!d.st2) d.v2=1+Math.floor(worldTick/(d.st1?7:d.s2))%6;
  if (d.st1&&d.st2){ const f=d.onDone; if (gDice) gDice=null; else c.dice=null; f(d.v1,d.v2); }
  return true;
}
function sixesOf(v1,v2){ return (v1===6?1:0)+(v2===6?1:0); }
function combatPlayerAction(a){
  const c=game.combat, e=c.e;
  if (c.turn!=="player"||game.state!=="combat"||c.dice) return;
  if (a==="repeat"){ if (!game.player.lastAction) return; a=game.player.lastAction; }
  game.player.lastAction=a;
  if (a==="guard"){
    c.guard=true;
    clog("You set yourself behind steel and fear.");
    combatEnemyTurn();
    return;
  }
  if (a==="flask"){
    const p=game.player;
    if (countItem("Bandage")){
      useFromInv("Bandage",1);
      p.hp=clamp(p.hp+8,0,p.maxhp);
      clog("Needle and thread, mid-fight. +8 HP. Ugly. Alive.");
    } else if (countItem("Ration")){
      useFromInv("Ration",1);
      p.stam=clamp(p.stam+35,0,maxStam()); p.hp=clamp(p.hp+2,0,p.maxhp);
      clog("You eat while it watches. Stamina +35, HP +2. Deranged. Effective.");
    } else {
      clog("No bandage, no ration. Just you and it.");
    }
    combatEnemyTurn();
    return;
  }
  armDice("atk", a);
  c.dice.onDone=(v1,v2)=>resolvePlayerAction(a,v1,v2);
}
function resolvePlayerAction(a,v1,v2){
  const c=game.combat, e=c.e;
  const sixes=sixesOf(v1,v2);
  if (a==="strike"){
    if (c.riposte){
      c.riposte=false;
      const dmg=playerAtk()*2;
      e.hp-=dmg;
      clog("RIPOSTE. Your steel answers before it finishes. (-"+dmg+")");
      addFloat("RIPOSTE -"+dmg, PAL.coin, W/2, 95); kicker();
      if (e.hp<=0){ c.critKill=true; winCombat(); return; }
    } else {
    let dmg=Math.max(1, playerAtk()-irnd(2));
    if (sixes===1){ dmg+=2; clog("A crowned die blesses the edge. (+2)"); }
    if (sixes===2){
      dmg=playerAtk()*2;
      e.hp-=dmg;
      clog("TWIN SIXES. You strike like a verdict. (-"+dmg+")");
      addFloat("CRIT -"+dmg, PAL.coin, W/2, 95); kicker();
      if (e.hp<=0){ c.critKill=true; winCombat(); return; }
    } else {
      e.hp-=dmg;
      clog("You carve "+e.n+" for "+dmg+".");
      addFloat("-"+dmg, PAL.bloodHi, W/2, 95);
      if (e.hp<=0){ winCombat(); return; }
    }
    }
  } else if (a==="heavy"){
    const crown=sixes===2, fumble=(v1===1&&v2===1)&&!hasManeuver("cleave");
    if (crown || (!fumble && d10()+game.player.str>=9)){
      const dmg=(playerAtk()+3)*(crown?2:1);
      e.hp-=dmg;
      if (crown) c.critKill=true;
      addFloat((crown? "CRIT -":"-")+dmg, crown? PAL.coin:PAL.bloodHi, W/2, 95);
      if (crown) kicker();
      clog(crown? "TWIN SIXES - a deep, mean, senseless cut. (-"+dmg+")"
                : "A deep, mean cut. "+e.n+" shrieks like a kettle. (-"+dmg+")");
    } else {
      clog(fumble? "Both dice spit ones. You overreach badly." : "You overreach. The dark takes its fee.");
      combatEnemyTurn();
      return;
    }
    if (e.hp<=0){ winCombat(); return; }
  } else if (a==="flee"){
    const agility=d10()+game.player.agi+(sixes===1?2:0);
    if (sixes===2 || agility>=9){
      clog(sixes===2? "Both crowns - you are gone before it finishes turning."
                    : "You run like the city raised you to.");
      if (game.dungeon) stepBack();
      endCombat();
      return;
    }
    clog("It reads your weight shift. No escape this beat.");
  }
  combatEnemyTurn();
}
function combatEnemyTurn(){
  const c=game.combat, e=c.e, p=game.player;
  if (e.tr==="grasp" && Math.random()<0.18){
    clog(e.n+" holds you. Long fingers, long patience.");
    afterEnemyTurn(); return;
  }
  if (e.tr==="swarm" && Math.random()<0.35){
    let total=0;
    for (let i=0;i<3;i++) total+=Math.max(0, Math.min(Math.max(1,e.atk+irnd(3)-playerDef()-(c.guard?1:0)), 3));
    total=Math.max(1,total);
    clog("A hundred small hungers streak toward you - catch the dice!");
    armDice("def", total);
    c.dice.onDone=(v1,v2)=>resolveDefense(total,v1,v2,true);
    return;
  }
  const raw=e.atk+irnd(4)+1;
  armDice("def", raw);
  clog(e.n+(e.human? " cuts at you." : " breaks against you and through.")+" - catch the dice!");
  c.dice.onDone=(v1,v2)=>resolveDefense(raw,v1,v2,false);
}
function resolveDefense(raw,v1,v2,swarm){
  const c=game.combat, e=c.e, p=game.player;
  const sixes=sixesOf(v1,v2);
  if (sixes===2){
    clog("BOTH DICE CROWN. It consumes the space where you stood.");
    if (hasManeuver("riposte")){ c.riposte=true; clog("Riposte armed. Your next strike answers everything."); }
    addFloat("DODGE", PAL.coin, W/2, 100);
  } else {
    let dmg=Math.max(1, raw-playerDef()-(c.guard?2:0));
    if (sixes===1){
      const red=Math.min(dmg-1,2);
      if (red>0){ dmg-=red; clog("One crowned die turns the blow aside. (-"+red+")"); }
    }
    p.hp-=dmg;
    addFloat("-"+dmg, PAL.bloodHi, W/2+(irnd(24)-12), 100);
    if (dmg>=6) kicker();
    clog(swarm? "(-"+dmg+")" : e.n+(e.human? " cuts you." : " breaks against you and through.")+" (-"+dmg+")");
  }
  if (e.tr==="weep" && sixes<2 && !hasManeuver("stare") && Math.random()<0.25){
    const stat=pick(["str","agi","wit","wll"]);
    const names={str:"Strength",agi:"Agility",wit:"Wits",wll:"Will"};
    if (p[stat]>1) p[stat]-=1;
    clog("It drinks from you. "+names[stat]+" is less than it was.");
  }
  afterEnemyTurn();
}
function afterEnemyTurn(){
  const c=game.combat, p=game.player;
  c.guard=false;
  if (p.hp<=0){
    die(game.dungeon? "Torn apart in the "+game.dungeon.opening.name : "Slain in Vharn");
    return;
  }
  c.turn="player";
}
function winCombat(){
  const c=game.combat, p=game.player;
  p.kills++;
  const bk=p.bestiary[c.e.n]; if (bk) bk.killed=true;
  if (!c.e.human){
    p.killsByKind[c.e.n]=(p.killsByKind[c.e.n]||0)+1;
    if (p.killsByKind[c.e.n]===7) earnTitle(c.e.n+" Slayer");
  }
  if (c.critKill) p.streak++; else p.streak=0;
  const tilt= game.dungeon? game.dungeon.tierNow:1;
  let g=2+irnd(6)+tilt*2;
  if (p.streak>=2){ const bonus=p.streak*4; g+=bonus; clog("The dark keeps score. Streak x"+p.streak+" (+"+bonus+"g)"); addFloat("STREAK x"+p.streak, PAL.coin, W/2, 78); }
  p.gold+=g;
  addFloat("+"+fmt(g), PAL.coin, W/2+16, 92);
  const l=rollLoot(tilt, Math.random()<0.4?2:1);
  const got=[];
  for (const it of l){
    if (addItem(it.n,it.v,it.kind)){
      got.push(it.n);
      const r=lootRarity(it.v);
      addFloat(it.n+" - "+r.t, r.col, W/2+(irnd(96)-48), 68);
      if (r.t==="RELIC"){ kicker(8); setBanner(["A RELIC FROM THE DARK","The "+it.n+". Word of it will reach the market."]); }
    }
  }
  clog("It stops. The dark settles like sediment.");
  clog("+"+fmt(g)+(got.length? ", and "+got.join(", "):""));
  if (c.e.duel && p.weapon.d<6){ p.weapon={n:"Duelist's Blade", d:6}; clog("You also liberate their blade."); }
  c.won=true; c.turn="won";
  checkTitles();
  saveGame();
}
function endCombat(){
  const og=game.combat && game.combat.origin;
  game.combat=null;
  game.state= og==="base"? "base":"dungeon";
}

/* ----- juice: floats, shake, banners, off-combat dice ----- */
let floats=[], shakeT=0, bannerMsg=null, bannerT=0, gDice=null, drips=[];
function addFloat(s,col,x,y){
  if (floats.length>14) floats.shift();
  floats.push({ s:s, col:col||"#e8e0cf", x:(x==null? W/2-20+(irnd(40)-10):x), y:(y==null? 90:y), t:0 });
}
function kicker(n){ shakeT=Math.max(shakeT, n||6); }
function setBanner(lines){ bannerMsg=lines; bannerT=190; }
function lootRarity(v){
  return v>=70? {t:"RELIC", col:"#c99df5"} : v>=45? {t:"RARE", col:"#e0b95a"}
       : v>=25? {t:"PRIZED", col:"#9dc08f"} : {t:"common", col:"#9a9184"};
}

/* ----- reputation: the titles the city gives you ----- */
const MANEUVERS = [
  { id:"riposte", stat:"agi", req:5, n:"Riposte", cost:60, d:"Catch twin sixes on defense and your next Strike is a free critical." },
  { id:"cleave",  stat:"str", req:5, n:"Gravedigger's Cleave", cost:80, d:"Cut Deep no longer fumbles on snake eyes." },
  { id:"stare",   stat:"wll", req:6, n:"Ashen Stare", cost:70, d:"Weep-trait foes find nothing in you to drink." },
  { id:"read",    stat:"wit", req:5, n:"Deep Reading", cost:70, d:"You read a foe's truths on sight: all vitals visible from the first meeting." }
];
const ACT_LABEL={ strike:"Strike", heavy:"Cut Deep (risky)", guard:"Guard", flask:"Bandage / Ration", flee:"Flee" };
function hasManeuver(id){ const p=game&&game.player; return !!p && p.maneuvers.indexOf(id)>=0; }
function foeKnown(n){
  const p=game.player, b=p.bestiary[n];
  return !!(b && (b.killed || hasManeuver("read")));
}
function quickActs(){ const base=["strike","heavy","guard","flask","flee"]; const last=game.player.lastAction; return last? ["repeat"].concat(base) : base; }
function actLabel(a){ return a==="repeat"? "Repeat: "+ACT_LABEL[game.player.lastAction] : ACT_LABEL[a]; }
function statName(s){ return {str:"Strength", agi:"Agility", wit:"Wits", wll:"Will"}[s]; }
function earnTitle(t){
  const p=game.player;
  if (!p || p.titles.indexOf(t)>=0) return;
  p.titles.push(t);
  setBanner(["WORD CARRIES THROUGH THE WARDS","They begin to call you "+t+"."]);
  saveGame();
}
function checkTitles(){
  const p=game.player;
  if (!p) return;
  if (p.child) earnTitle("Father");
  if (p.house) earnTitle("Householder of Ward Nine");
  if (p.house && p.upgrades.length>=3) earnTitle("Slumlord of Ward Nine");
  if (p.gold>=500) earnTitle("the Gilded");
  if (p.deep>=12) earnTitle("the Deep-Drowned");
  if (p.kills>=25) earnTitle("Terror of the Openings");
  if (p.streak>=3) earnTitle("Sixtongue");
  if (p.gambleWins>=3) earnTitle("Spitefinger");
}
function addr(){ const p=game.player; return (p && p.titles.length)? p.titles[p.titles.length-1] : (p? p.name : "friend"); }
function maneuverMenu(){
  const p=game.player;
  const opts=MANEUVERS.filter(m=>p.maneuvers.indexOf(m.id)<0).map(m=>({
    t:m.n+" ("+fmt(m.cost)+")",
    d:"Needs "+statName(m.stat)+" "+m.req+". "+m.d,
    fn:()=>{
      if (p[m.stat]<m.req){ say(["The yard master watches two of your kicks, shakes his head.",
        "\"Not yet. "+statName(m.stat)+" "+m.req+" first. You will get there. Or the dark will.\""], ()=>maneuverMenu()); return; }
      if (p.gold<m.cost){ say(["Short by "+fmt(m.cost-p.gold)+". The yard master waits like wage day."], ()=>maneuverMenu()); return; }
      p.gold-=m.cost; p.maneuvers.push(m.id); advanceWeeks(3);
      setBanner(["MANEUVER LEARNED","You know "+m.n+" now. The body remembers."]);
      say(["Weeks of falling and getting up. Then one morning the motion is simply yours.", m.n+": learned."], ()=>openYard());
      saveGame(); checkTitles();
    }
  }));
  if (!opts.length) opts.push({ t:"(They have taught you all they know)", fn:()=>{} });
  opts.push({ t:"Back", fn:openYard });
  showMenu("SPECIAL MANEUVERS", opts);
}
function bonesGame(stake){
  const p=game.player;
  if (p.gold<stake){ say(["The stickman eyes your purse. \"Empty hands pull no bones.\""], ()=>openTavern()); return; }
  p.gold-=stake;
  say(["A scarred man rattles two knuckle-dice in a cup and slides it across the table.",
       "\"Catch twin sixes and it triples. One six, stake back. Nothing - to the pot.\"",
       "Stake: "+fmt(stake)], ()=>{
    gDice={ kind:"gamble", v1:1+irnd(6), v2:1+irnd(6), s1:6, s2:10, st1:false, st2:false, stake:stake,
      onDone:(v1,v2)=>{
        const sixes=sixesOf(v1,v2);
        if (sixes===2){
          const win=stake*3;
          p.gold+=win; p.gambleWins++;
          setBanner(["THE LAMP ROARS","Twin sixes. "+fmt(win)+" and the room loves you."]);
          addFloat("+"+fmt(win), PAL.coin, W/2, 74);
        } else if (sixes===1){
          p.gold+=stake;
          say(["One crowned die. The stickman pays your stake back, grudging.",
               "\"Half a miracle. Half is paid.\""], ()=>openTavern());
        } else {
          say(["The dice spit nothing. He sweeps the coins away without looking at them.",
               "\"The dark takes its fee up here too.\""], ()=>openTavern());
        }
        checkTitles();
        saveGame();
      } };
  });
}

/* ============================================================
   RENDER
   ============================================================ */
function txt(s,x,y,col,big){
  ctx.font=(big? "bold 11px":"bold 9px")+" 'Courier New', monospace";
  ctx.textBaseline="top";

/* abomination generator - every horror looks different, seeded */
function drawAbomination(cx,cy,seed,scale){
  const rg=mulberry(seed);
  const fs=["#6e2f38","#7c3540","#54303a","#8a3a44","#5f4a3a","#74504c"];
  const body=fs[Math.floor(rg()*fs.length)];
  const dark="#2a141c";
  const S=scale||2.0;
  const Wd=Math.round(20*S), Hd=Math.round(17*S);
  for (let r=0;r<Hd;r++){
    const t=r/Hd;
    const wob=1+0.35*Math.sin((r+seed%13)*0.9);
    let ww=Math.round(Math.sin(Math.PI*t)*Wd*0.5*wob);
    if (ww<=0) continue;
    ctx.fillStyle=body;
    ctx.fillRect(cx-ww, cy+r, ww*2, 1);
    if (r%4===0){ ctx.fillStyle=dark; ctx.fillRect(cx-ww+Math.floor(rg()*ww), cy+r, Math.ceil(ww*(0.2+rg()*0.3)), 1); }
  }
  const legs=3+Math.floor(rg()*5);
  ctx.fillStyle=body;
  for (let i=0;i<legs;i++){
    const lx=cx-Wd*0.4+rg()*Wd*0.8;
    const len=3+Math.floor(rg()*5);
    ctx.fillRect(Math.round(lx), cy+Hd-1, 1, len);
    ctx.fillRect(Math.round(lx)+(rg()<0.5?-1:1), cy+Hd+len-1, 1, 2);
  }
  const eyes=1+Math.floor(rg()*4);
  for (let i=0;i<eyes;i++){
    const ex=cx-Math.round(Wd*0.4)+Math.floor(rg()*Wd*0.8);
    const ey=cy+2+Math.floor(rg()*Hd*0.4);
    ctx.fillStyle=rg()<0.5? PAL.gold : "#d8d3c0";
    ctx.fillRect(ex,ey,Math.max(1,1+Math.floor(rg()*2)),1);
    if (rg()<0.5){ ctx.fillStyle=dark; ctx.fillRect(ex,ey+1,1,1+Math.floor(rg()*3)); }
  }
  const mouths=1+Math.floor(rg()*2);
  for (let i=0;i<mouths;i++){
    const mx=cx-Math.floor(Wd*0.3)+Math.floor(rg()*Wd*0.6);
    const my=cy+Math.floor(Hd*0.45)+Math.floor(rg()*Hd*0.3);
    const mw=2+Math.floor(rg()*4);
    ctx.fillStyle=dark;
    ctx.fillRect(mx,my,mw,1);
    ctx.fillStyle=PAL.bone;
    for (let t2=0;t2<mw;t2++){ if (rg()<0.6) ctx.fillRect(mx+t2,my-1,1,1); }
  }
  if (rg()<0.6){
    ctx.fillStyle=PAL.bone;
    for (let i2=-3;i2<=3;i2++) ctx.fillRect(cx+i2*2, cy-2-(3-Math.abs(i2)), 1, 2);
  }
}

function drawBase(){
  ctx.fillStyle="#171219"; ctx.fillRect(0,0,W,H);
  if (!cityGrid) cityGrid=buildCity();
  const b=game.base;
  const camX=clamp(b.px-Math.floor(VW/2),0,CW-VW), camY=clamp(b.py-Math.floor(VH/2),0,CH-VH);
  for (let y=0;y<VH;y++){
    const wy=y+camY; if (wy>=CH) continue;
    for (let x=0;x<VW;x++){
      const wx=x+camX; if (wx>=CW) continue;
      const c=cityGrid[wy][wx];
      let col=PAL.floor;
      if (c==="r") col="#4a4148";
      else if (c==="o") col="#3d3742";
      else if (c==="y") col="#313d2c";
      else if (c==="B") col="#3c3038";
      else if (c==="D") col=PAL.rust;
      else if (c==="G") col=PAL.void;
      ctx.fillStyle=col;
      ctx.fillRect(x*T,y*T,T,T);
      if (c==="."){ ctx.fillStyle="#1e1720"; ctx.fillRect(x*T,y*T,1,1); }
      if (c==="D"){ ctx.fillStyle="#2c1e14"; ctx.fillRect(x*T+1,y*T+1,4,6); }
      if (c==="G"){ ctx.fillStyle="#c8963f"; ctx.fillRect(x*T+3,y*T+3,1,1); }
    }
  }
  for (const bl of BUILDINGS){
    if (bl.home && !game.player.house) continue;
    const sx=(bl.x-camX)*T, sy=(bl.y-camY)*T;
    if (sx>W||sy>H||sx<-200||sy<-80) continue;
    drawBuilding(bl, sx, sy);
    if (bl.id==="tavern"||bl.id==="market"){
      const dxp=(bl.x+Math.floor(bl.w/2)-camX)*T, dyp=(bl.y+bl.h-1-camY)*T;
      drawNPC(dxp, dyp-8, bl.id==="tavern"? PAL.bloodHi : PAL.green);
    }
  }
  drawHero((b.px-camX)*T, (b.py-camY)*T, false);
  if (!game.ui.mode){
    hit(0,0,W,H,(gx,gy)=>{
      if (game.state!=="base" || game.ui.mode) return;
      const wx=clamp(Math.floor(gx/T)+camX,0,CW-1), wy=clamp(Math.floor(gy/T)+camY,0,CH-1);
      if (citySolid(wx,wy)) return;
      walkTo(wx,wy,null, (x,y)=>!citySolid(x,y), CW, CH);
    });
    for (const bl of BUILDINGS){
      if (bl.home && !game.player.house) continue;
      const sx=(bl.x-camX)*T, sy=(bl.y-camY)*T;
      if (sx>W||sy>H||sx+b.w*T<0||sy+b.h*T<0) continue;
      hit(Math.max(0,sx), Math.max(0,sy), bl.w*T, bl.h*T, ()=>{
        if (game.state!=="base" || game.ui.mode) return;
        if (nearBuilding(bl, game.base.px, game.base.py)){ stopWalk(); enterBuilding(bl); return; }
        const cands=[];
        if (bl.home){
          const dx0=bl.door[0], dy0=bl.door[1];
          cands.push([dx0,dy0]);
          cands.push([dx0+1,dy0],[dx0-1,dy0],[dx0,dy0+1],[dx0,dy0-1]);
        } else {
          for (let x=bl.x;x<bl.x+bl.w;x++){
            cands.push([x,bl.y+bl.h]);
            if (!bl.gate){ cands.push([x,bl.y-1]); }
          }
          for (let y=bl.y;y<bl.y+bl.h;y++) cands.push([bl.x-1,y],[bl.x+bl.w,y]);
        }
        let best=null, bd=1e9;
        for (const c of cands){
          if (c[0]<0||c[1]<0||c[0]>=CW||c[1]>=CH) continue;
          if (citySolid(c[0],c[1])) continue;
          const dd=Math.abs(c[0]-game.base.px)+Math.abs(c[1]-game.base.py);
          if (dd<bd){ bd=dd; best=c; }
        }
        if (best) walkTo(best[0],best[1], ()=>{ if (nearBuilding(bl, game.base.px, game.base.py)) enterBuilding(bl); }, (x,y)=>!citySolid(x,y), CW, CH);
        else showHint("No way in from here.");
      });
    }
  }
  const p=game.player;
  box(0,0,148,38,"rgba(8,6,10,0.92)");
  txt(p.name+"  "+Math.floor(game.week/52)+"y  "+fmt(p.gold),3,3,PAL.gold);
  txt("HP "+p.hp+"/"+p.maxhp+" STAM "+Math.floor(p.stam),3,14,PAL.bone);
  if (p.wounds.length) txt("wounds: "+p.wounds.join(","),3,25,PAL.bloodHi);
  else if (p.titles.length) txt("\""+p.titles[p.titles.length-1]+"\"",3,25,"#a89762");
  cornerChips();
}

function drawDungeon(){
  const d=game.dungeon, f=curFloor();

  const camX=clamp(d.px-Math.floor(VW/2),0,f.w-VW), camY=clamp(d.py-Math.floor(VH/2),0,f.h-VH);
  for (let y=0;y<VH;y++){
    const wy=y+camY; if (wy>=f.h) continue;
    for (let x=0;x<VW;x++){
      const wx=x+camX; if (wx>=f.w) continue;
      if (!f.seen.has(wx+","+wy)) continue;
      const c=f.grid[wy][wx];
      const dist=Math.hypot(wx-d.px,wy-d.py);
      const dim=clamp(1-(dist-1.5)/5.2,0.12,1);
      ctx.globalAlpha=dim;
      let col;
      if (c==="#") col=(wx+wy)%2? PAL.wall:PAL.wallHi;
      else if (c==="<"||c===">") col="#3d3141";
      else col=(wx+wy)%2? PAL.floor:PAL.floorHi;
      ctx.fillStyle=col;
      ctx.fillRect(x*T,y*T,T,T);
      if (c==="#"){ ctx.fillStyle=PAL.wallHi; ctx.fillRect(x*T,y*T,T,2); }
      if (c==="<") drawStairs(x*T,y*T,false);
      if (c===">") drawStairs(x*T,y*T,true);
      else if (c!=="#"){
        const hsc=((wx*73856093)^(wy*19349663)^f.seed)>>>0;
        const m=hsc%19;
        if (m===0){ ctx.fillStyle="#8f8878"; ctx.fillRect(x*T+2,y*T+5,1,1); ctx.fillRect(x*T+4,y*T+4,1,1); ctx.fillRect(x*T+5,y*T+3,1,1); }
        else if (m===1){ ctx.fillStyle="#4b4349"; ctx.fillRect(x*T+1,y*T+2,2,1); ctx.fillRect(x*T+3,y*T+3,1,1); }
        else if (m===2){ ctx.fillStyle="#0d0a10"; ctx.fillRect(x*T+1,y*T+3,3,1); ctx.fillRect(x*T+3,y*T+4,1,1); }
        else if (m===3){
          ctx.fillStyle="#101a22"; ctx.fillRect(x*T+1,y*T+1,5,2);
          if ((worldTick+wx*3+wy*7)%240<10){ ctx.fillStyle="#5a7a8a"; ctx.fillRect(x*T+2,y*T+1,2,1); }

      }
      const ev=f.events.find(e=>e.x===wx&&e.y===wy&&!e.done);
      if (ev){

  if (onUp) chip(d.depth===1? "CLIMB OUT" : "ASCEND", W-116, H-14, 54, ()=>pressZ("z"));
  else if (onDown) chip("DESCEND", W-116, H-14, 54, ()=>pressZ("z"));
  else chip("MENU", W-116, H-14, 54, ()=>pressZ("z"));
  chip("MAP", W-60, H-14, 30, ()=>pressZ("m"));
  }
  cornerChips();
}

function drawMinimap(){
  const d=game.dungeon, f=curFloor();
  box(20,14,280,150,"rgba(6,4,9,0.96)",PAL.rust);
  txt("- "+d.opening.name+" . depth "+d.depth+" -",26,18,PAL.gold);
  const s=3, ox=Math.floor((280-f.w*s)/2)+20, oy=Math.floor((128-f.h*s)/2)+16;
  for (let y=0;y<f.h;y++) for (let x=0;x<f.w;x++){
    if (!f.seen.has(x+","+y)) continue;
    const c=f.grid[y][x];
    ctx.fillStyle = c==="#"? "#241d2a" : (c==="<"||c===">")? PAL.gold : "#4a4152";
    ctx.fillRect(ox+x*s,oy+y*s,s,s);
  }
  ctx.fillStyle="#efe7d4";
  ctx.fillRect(ox+d.px*s-1,oy+d.py*s-1,s+2,s+2);
  txt("tap to close",26,152,"#7a7183");
  hit(20,14,280,152,()=>pressZ("m"));
}

/* ----- UI & combat render ----- */
function wrap(s,n){
  if (s.length<=n) return [s];
  let br=s.lastIndexOf(" ",n);
  if (br<0) br=n;
  return [s.slice(0,br), s.slice(br+1)];
}
function renderUI(){
  const u=game.ui;
  ctx.font="bold 9px 'Courier New',monospace"; ctx.textBaseline="top";
  if (u.mode==="text" && u.dialog){
    box(0,116,320,64);
    const wrapped=[];
    for (const l of u.dialog.lines[u.dialog.i].split("\n")) wrapped.push.apply(wrapped, wrap(l,56));
    let y=120;
    for (const l of wrapped){ txt(l,6,y); y+=10; }
    txt("tap / Z >",261,169,"#7a7183");
    if (u.dialog.i<u.dialog.lines.length-1)
      txt("▼",311,168,"#c8963f");
    hit(0,116,320,64,()=>pressZ("z"));
  } else if (u.mode==="menu" && u.menu){
    const m=u.menu;
    box(0,116,320,64);
    txt(m.title,6,119,PAL.gold);
    const start=Math.max(0, m.sel-3);
    let y=128;
    const rows=[];
    for (let i=start;i<Math.min(m.opts.length,start+4);i++){
      const label=(i===m.sel? "> ":"  ")+m.opts[i].t.slice(0,52);
      txt(label,4,y, i===m.sel? PAL.coin:PAL.bone);
      rows.push(i);
      y+=10;
    }
    for (const i of rows)
      hit(4,126+(i-start)*10,312,10,()=>{ m.sel=i; pressZ("z"); });
    if (m.opts.length>start+4) txt("▼",307,169,"#c8963f");
    if (start>0) txt("▲",307,118,"#c8963f");
    const cur=m.opts[m.sel];
    if (cur && cur.d) txt(". "+wrap(cur.d,54)[0],6,169,"#8f8878");
    txt("X back",272,119,"#5f5868");
    hit(262,117,56,12,()=>pressZ("x"));
  }
}
function drawGambleBoard(){
  const d=gDice, j=worldTick%2;
  box(68,58,184,104,"rgba(10,7,12,0.96)",PAL.gold);
  txt("THE BONES GAME",126,62,PAL.gold);
  txt("stake "+fmt(d.stake)+" - win "+fmt(d.stake*3),74,76,"#8f8878");
  drawDie(94+(d.st1?0:j),94,d.v1,d.st1);
  drawDie(152+(d.st2?0:(1-j)),94,d.v2,d.st2);
  if (!d.st1) hit(94,94,26,28,()=>{ if (!d.st1) d.st1=true; });
  if (!d.st2) hit(152,94,26,28,()=>{ if (!d.st2) d.st2=true; });
  txt("catch both sixes - Z / X or tap",74,150,"#7a7183");
}
function drawJuice(){
  for (const f of floats){ f.t++; f.y-=0.4; }
  floats=floats.filter(f=>f.t<90);
  if (shakeT>0) shakeT--;
  if (bannerT>0) bannerT--;
  ctx.font="bold 9px 'Courier New',monospace"; ctx.textBaseline="top";
  for (const f of floats){
    ctx.globalAlpha=clamp(1-f.t/90,0,1);
    txt(f.s, clamp(f.x,2,308), clamp(f.y,2,172), f.col);
  }
  ctx.globalAlpha=1;
  if (bannerT>0 && bannerMsg){
    const bw=210, bx=(W-bw)/2, bh=bannerMsg.length>1?30:20;
    box(bx,40,bw,bh,"rgba(10,7,12,0.94)",PAL.gold);
    if (bannerMsg.length>1){
      txt(bannerMsg[0],bx+10,44,PAL.gold);
      txt(bannerMsg[1].slice(0,46),bx+10,55,"#cfc6b4");
    } else txt(bannerMsg[0],bx+10,46,PAL.gold);
  }
}
function drawDie(x,y,v,stopped){
  const six=v===6;
  ctx.fillStyle= six? "#c9a24a" : "#e8e0cf";
  ctx.fillRect(x,y,26,26);
  ctx.strokeStyle= stopped? "#f5d67a" : "#372c3a";
  ctx.strokeRect(x+.5,y+.5,25,25);
  ctx.fillStyle= six? "#2a1c08" : "#1c141f";
  const PIPS={1:[[1,1]],2:[[0,0],[2,2]],3:[[0,0],[1,1],[2,2]],4:[[0,0],[0,2],[2,0],[2,2]],5:[[0,0],[0,2],[1,1],[2,0],[2,2]],6:[[0,0],[0,1],[0,2],[2,0],[2,1],[2,2]]};
  for (const p of PIPS[v]) ctx.fillRect(x+5+p[0]*7, y+5+p[1]*7, 4, 4);
  if (six && stopped) txt("SIX",x-3,y+26,"#e0b95a");
}
function renderCombat(){
  const c=game.combat, e=c.e;
  if (game.dungeon) drawDungeon(); else drawBase();
  box(90,8,140,88,"rgba(6,4,9,0.9)",PAL.rust);
  ctx.font="bold 9px 'Courier New',monospace"; ctx.textBaseline="top";
  if (e.human) drawHumanFoe(156,36);
  else drawAbomination(160,22,e.artSeed,1.7);
  txt(e.n.slice(0,30),95,80,PAL.bloodHi);
  const known=foeKnown(e.n);
  const w=clamp(e.hp/e.maxhp,0,1);
  ctx.fillStyle="#33131c"; ctx.fillRect(96,73,128,4);
  if (known){
    ctx.fillStyle=PAL.bloodHi; ctx.fillRect(96,73,Math.round(128*w),4);
    txt(e.hp+"/"+e.maxhp,196,64,"#8f8878");
  } else {
    txt("vitals unknown",196,64,"#5f5868");
  }
  box(0,74,320,42,"rgba(8,6,10,0.88)");
  let y=78;
  for (const l of c.log.slice(-3)){ txt(l.slice(0,54),5,y,"#cfc6b4"); y+=10; }
  if (c.dice){
    const d=c.dice, j=worldTick%2;
    box(102,114,116,66,"rgba(8,6,10,0.96)",PAL.gold);
    txt("CATCH THE SIXES",108,118,"#e0b95a");
    drawDie(115+(d.st1?0:j),136,d.v1,d.st1);
    drawDie(169+(d.st2?0:(1-j)),136,d.v2,d.st2);
    if (!d.st1) hit(115,136,26,28,()=>d.st1=true);
    if (!d.st2) hit(169,136,26,28,()=>d.st2=true);
    txt(game.player.hp<=game.player.maxhp*0.25? "LAST STAND - dice crawl slow" : "roll both dice - Z / X / tap",104,168,"#7a7183");
  } else if (c.turn==="player"){
    box(0,116,150,64,"rgba(8,6,10,0.92)");
    const acts=quickActs();
    for (let i=0;i<acts.length;i++){
      txt((i===c.choice?"> ":"  ")+actLabel(acts[i]),6,120+i*11, i===c.choice?PAL.coin:PAL.bone);
      hit(0,117+i*11,150,11,()=>{ c.choice=i; pressZ("z"); });
    }
    txt("twin 6s = crit",156,169,"#5f5868");
  } else if (c.turn==="won"){
    box(0,116,320,64,"rgba(8,6,10,0.92)");
    txt("It is over. [Z] / tap to continue.",6,140,PAL.gold);
    hit(0,116,320,64,()=>pressZ("z"));
  }
  cornerChips();
}

/* ----- title & death ----- */
let titleTick=0;
function renderTitle(){
  ctx.fillStyle="#0b0810"; ctx.fillRect(0,0,W,H);
  titleTick++;
  for (let i=0;i<40;i++){
    const bx=(i*37)%W, bh=20+((i*53)%50);
    ctx.fillStyle=i%3? "#141019":"#191420";
    ctx.fillRect(bx,H-bh,14,bh);
    if ((i*29+Math.floor(titleTick/60))%7<2){ ctx.fillStyle="#2e2433"; ctx.fillRect(bx+3,H-bh+6,3,4); }
  }
  ctx.fillStyle="#c8963f";
  for (let i=0;i<26;i++) ctx.fillRect(102+i*4, 122+Math.round(Math.sin(i)*1.4), 2, 4+((i*7)%5));
  ctx.fillStyle="rgba(200,150,63,0.08)";
  ctx.fillRect(80,56,160,66);
  ctx.textAlign="center";
  txt("O P E N I N G S",W/2,24,PAL.gold,true);
  txt("delvings of old Vharn",W/2,36,"#8f8878");
  txt("a gritty pixel life-in-the-depths sim (draft)",W/2,50,"#5f5868");
  ctx.textAlign="left";
  if (Math.floor(titleTick/30)%2===0) txt("[ENTER] or tap to begin",96,148,PAL.bone);
  txt("the city is patient - arrows move, Z confirms",40,162,"#4d4453");
  hit(0,0,W,H,()=>pressZ("Enter"));
}
function renderDead(){
  ctx.fillStyle="#070409"; ctx.fillRect(0,0,W,H);
  const ep=game.flags.epilogue||["You are ended."];
  txt("THE BOOK OF THE GATE",W/2-52,18,PAL.gold,true);
  let y=36;
  for (const l of ep){ for (const s of wrap(l,56)){ txt(s,12,y,"#b9b0a0"); y+=10; } y+=2; }
  txt("[ENTER] or tap - Vharn waits.",76,164,"#6e6678");
  hit(0,0,W,H,()=>pressZ("Enter"));
}

/* ============================================================
   UPDATE
   ============================================================ */
let mapOpen=false;
function updateTitle(){
  if (yesTap()){ newGame(); cityGrid=buildCity(); game.state="base";
    if (("ontouchstart" in window) || (window.matchMedia && window.matchMedia("(pointer:coarse)").matches)) toggleFS();
    say(["Vharn does not greet you. Vharn does not notice you.",
         "You are one more body that owns a knife and an appetite. Unless you become more."]); }
}
function updateBase(){
  if (uiBlocked()){ updateUI(); return; }
  const mv=dirTap();
  if (mv){ stopWalk(); tryBaseMove(mv[0],mv[1]); maybeMugged(); return; }
  if (walkPath && walkPath.length){
    if (yesTap()||noTap()){ stopWalk(); return; }
    if (++walkTick>=5){
      walkTick=0;
      const st=walkPath.shift();
      if (citySolid(st[0],st[1])){ stopWalk(); }
      else {
        game.base.px=st[0]; game.base.py=st[1];
        if (!walkPath.length && walkCb){ const cb=walkCb; walkCb=null; cb(); }
      }
    }
    return;
  }
  walkPath=null; walkCb=null;
  if (yesTap()){
    for (const b of BUILDINGS){
      if (b.home && !game.player.house) continue;
      if (nearBuilding(b, game.base.px, game.base.py)){ enterBuilding(b); return; }
    }
    say(["Cobblestones, drizzle, the smell of tallow and meat going off.",
         "Nothing needs you here. The city keeps its appointments elsewhere."]);
  }
}
function updateDungeon(){
  if (mapOpen){ if (tap("m")||noTap()||yesTap()) mapOpen=false; return; }
  if (uiBlocked()){ updateUI(); return; }
  const d=game.dungeon, f=curFloor();
  const mv=dirTap();
  if (mv){ stopWalk(); tryMove(mv[0],mv[1]); return; }
  if (walkPath && walkPath.length){
    if (yesTap()||noTap()){ stopWalk(); return; }
    if (tap("m")){ stopWalk(); mapOpen=true; return; }
    if (++walkTick>=6){
      walkTick=0;
      const st=walkPath.shift();
      if (f.grid[st[1]] && f.grid[st[1]][st[0]]==="#"){ stopWalk(); }
      else {
        tryMove(st[0]-d.px, st[1]-d.py);
        if (!walkPath){ stopWalk(); }
        else if (!walkPath.length){ walkPath=null; const cb=walkCb; walkCb=null; }
      }
    }
    return;
  }
  walkPath=null; walkCb=null;
  if (tap("m")){ mapOpen=true; return; }
  if (!yesTap()) return;
  const ch=f.grid[d.py][d.px];
  if (ch==="<"){
    if (d.floorIx===0){ leaveDungeon(); return; }
    d.floorIx--;
    const fr=curFloor();
    d.px=fr.rooms[0].cx; d.py=fr.rooms[0].cy;
    markSeen();
    say(["You climb back up. The air is one level less ancient."]);
    return;
  }
  if (ch===">"){
    d.depth++;
    game.player.deep=Math.max(game.player.deep,d.depth);
    genFloor(d);
    advanceWeeks(1);
    saveGame();
    say(["Down. The stone gets older. The things in it get less pretend."]);
    return;
  }
  showMenu("DELVE", [
        { t:"Camp (eat a ration, restore)", fn:()=>{
            if (countItem("Ration")){ useFromInv("Ration",1);
              game.player.stam=clamp(game.player.stam+45,0,maxStam());
              game.player.hp=clamp(game.player.hp+4,0,game.player.maxhp);
              advanceWeeks(1);
              say(["Cold food, colder company. The dark watches you chew.","Stamina +45, HP +4."]); }
            else say(["No rations. The dark suggests alternatives. You decline."]);
            mapOpen=false; saveGame(); } },
        { t:"Study the walls (map)", fn:()=>{ mapOpen=true; } },
        { t:"Feel your wounds", fn:()=>{
            const p=game.player;
            say(p.wounds.length? ["Your "+p.wounds.join(" and your ")+((p.wounds.length>1)?" throb":" throbs")+" in time with your pulse. A flesh-setter would be wise."]
                               : ["Holding together. For Vharn, that is a good day."]); } },
        { t:"Nothing", fn:()=>{} }
      ]);
}
function leaveDungeon(){
  game.dungeon=null; mapOpen=false; game.state="base";
  advanceWeeks(1);
  const p=game.player;
  const lines=["You climb out into Vharn drizzle. The city resumes ignoring you, which is its way of saying hello.",
       "Delves: "+p.delves+"  |  kills: "+p.kills+"  |  purse: "+fmt(p.gold)];
  const news=drainNews();
  if (news.length) lines.push("Word from the surface:", ...news);
  say(lines, ()=>saveGame());
}
function updateCombat(){
  const c=game.combat;
  if (!c) return;
  if (c.dice){ rollDiceFrame(); return; }
  if (c.turn==="player"){
    const acts=quickActs();
    if (tap("arrowup")||tap("w")) c.choice=(c.choice+acts.length-1)%acts.length;
    if (tap("arrowdown")||tap("s")) c.choice=(c.choice+1)%acts.length;
    if (yesTap()) combatPlayerAction(acts[c.choice]);
  } else if (c.turn==="won"){
    if (yesTap()) endCombat();
  }
}
function updateDead(){
  if (!yesTap()) return;
  if (game.state==="legacy"){ continueAsChild(); return; }
  game=null; titleTick=0; mapOpen=false;
}
/* the heir takes over the save */
function continueAsChild(){
  const old=game.player, c=old.child;
  if (!c){ game=null; return; }
  if (old.spouse) old.spouse.parentOfYou=true;
  const spark=c.spark;
  game.player={
    name:c.name,
    str: Math.max(2, Math.floor(old.str*0.5)+Math.ceil(spark/3)),
    agi: Math.max(2, Math.floor(old.agi*0.5)+Math.ceil(spark/3)),
    wit: Math.max(2, Math.floor(old.wit*0.5)+Math.ceil(spark/4)),
    wll: Math.max(2, Math.floor(old.wll*0.5)+Math.ceil(spark/2)),
    hp:22, maxhp:22, stam:100, maxstam:100,
    gold:15,
    weapon: old.weapon.d>2? {n:old.weapon.n, d:old.weapon.d} : {n:"Rusted Knife", d:2},
    armor: {n:old.armor.n, a:old.armor.a},
    inv:[{n:"Ration", v:8, qty:2, kind:"food"},{n:"Bandage", v:10, qty:1, kind:"heal"}],
    wounds:[],
    house:old.house, upgrades:old.upgrades.slice(),
    spouse:null, partner:null, tryChild:0, child:null,
    kills:0, delves:0, deep:0,
    streak:0, gambleWins:0, lastAction:null,
    titles:[], killsByKind:{}, bestiary:old.bestiary, maneuvers:[]
  };
  game.week=c.weeks;
  game.dungeon=null; game.combat=null; game.base={px:20,py:15};
  closeUI(); game.state="base"; mapOpen=false;
  game.flags.news=[];
  cityGrid=buildCity();
  say(["The lamp is relit. "+game.player.name+" of the leaning house takes up the knife at "+Math.floor(game.week/52)+" years old.",
       "Strong as half a dead parent and some of their habits. The house stands because somebody kept paying for it.",
       "The Openings will remember your old name soon enough. The Gate has not moved."], ()=>saveGame());
}
function updateUI(){
  const u=game.ui;
  if (u.mode==="text"){
    if (yesTap()){
      u.dialog.i++;
      if (u.dialog.i>=u.dialog.lines.length){
        const cb=u.onclose; closeUI();
        if (cb) cb();
      }
    }
  } else if (u.mode==="menu"){
    const m=u.menu;
    if (tap("arrowup")||tap("w")) m.sel=(m.sel-1+m.opts.length)%m.opts.length;
    if (tap("arrowdown")||tap("s")) m.sel=(m.sel+1)%m.opts.length;
    if (yesTap()){
      const fn=m.opts[m.sel].fn;
      closeUI();
      fn();
    } else if (noTap()){
      const oc=u.oncancel;
      closeUI();
      if (oc) oc();
    }
  }
}

/* ---------------- main loop ---------------- */
function frame(){
  uiHits=[];
  worldTick++;
  pollGamepad();
  if (gDice){ rollDiceFrame(); }
  else if (!game) updateTitle();
  else {
    if (game.state==="base") updateBase();
    else if (game.state==="dungeon") updateDungeon();
    else if (game.state==="combat") updateCombat();
    else if (game.state==="dead"||game.state==="legacy") updateDead();
  }
  const shk = shakeT>0 && !gDice;
  if (shk){ ctx.save(); ctx.translate(irnd(3)-1, irnd(3)-1); }
  if (!game) renderTitle();
  else {
    if (game.state==="base") drawBase();
    else if (game.state==="dungeon") drawDungeon();
    else if (game.state==="combat") renderCombat();
    else if (game.state==="dead"||game.state==="legacy") renderDead();
    if (game.dungeon && mapOpen && game.state==="dungeon") drawMinimap();
    if (game.state!=="combat" && game.state!=="dead" && !mapOpen) renderUI();
  }
  if (shk) ctx.restore();
  if (gDice) drawGambleBoard();
  drawJuice();
  if (hintT>0 && hintMsg){
    hintT--;
    ctx.font="bold 9px 'Courier New',monospace"; ctx.textBaseline="top";
    const hm=hintMsg.slice(0,52), hw=ctx.measureText(hm).width;
    ctx.fillStyle="rgba(8,6,10,0.92)"; ctx.fillRect(W/2-hw/2-3, 1, hw+6, 14);
    txt(hm, W/2-hw/2, 3, "#e0b95a");
  }
  endFrame();
}
function loop(){ frame(); requestAnimationFrame(loop); }
loop();


/* debug handle for testing */
window.__openings={
  get game(){ return game; },
  newGame, launchDelve, startCombat, combatPlayerAction, endCombat, genFloor, buildCity,
  addItem, meetAdventurer, triggerEvent, advanceWeeks, openGate, openTavern, openOffice,
  openHome, openMarket, updateUI, closeUI, frame, press:(k)=>{ pressed[k.toLowerCase()]=true; },
  curFloor, hurt, die, continueAsChild, saveGame, loadGame,
  earnTitle, checkTitles, foeKnown, hasManeuver, quickActs, actLabel, bonesGame, addr,
  openChurch, maybeMugged, openTavern,
  MANEUVERS, BUILDINGS, OPENINGS,
  get gDice(){ return gDice; }, get bannerMsg(){ return bannerMsg; }
};
</script>
