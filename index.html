"use strict";
/* OPENINGS - a gritty pixel delving life-sim (draft) */

const CVS = document.getElementById("cv");
const ctx = CVS.getContext("2d");
ctx.imageSmoothingEnabled = false;

const W = 320, H = 180, T = 8;
const RES = 3;
const VW = 40, VH = 22;
const camZ = 1.5;
const VWz = Math.ceil(VW/camZ), VHz = Math.ceil(VH/camZ), Wz = W/camZ, Hz = H/camZ;

/* ---------------- utils ---------------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function irnd(n){ return Math.floor(Math.random()*n); }
function pick(a){ return a[irnd(a.length)]; }
function d10(){ return 1+irnd(10); }
function fmt(n){ return Math.floor(n)+"g"; }
function cap(s){ return s? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function mulberry(seed){ let t=seed>>>0; return function(){ t+=0x6D2B79F5; let r=Math.imul(t^(t>>>15),1|t); r^=r+Math.imul(r^(r>>>7),61|r); return ((r^(r>>>14))>>>0)/4294967296; }; }

/* ---------------- input ---------------- */
const keys = {};
const pressed = {};
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (["arrowup","arrowdown","arrowleft","arrowright"," "].indexOf(k)>=0) e.preventDefault();
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
  if (!e.repeat) keyRep[k]=0;
  if (k==="f5"){ e.preventDefault(); if (game) saveGame(); }
  if (k==="f9"){ e.preventDefault(); loadGame(); }
  updSndUnlock();
});
window.addEventListener("keyup", e => { const k2=e.key.toLowerCase(); keys[k2]=false; keyRep[k2]=0; });
/* hold-to-move: arrows / WASD repeat while held (menus scroll too) */
const keyRep={};
function tickHeld(){
  for (let mi=0;mi<MOVE_KEYS.length;mi++){
    const k=MOVE_KEYS[mi];
    if (!keys[k]){ keyRep[k]=0; continue; }
    if (!keyRep[k]) keyRep[k]=1;
    else { keyRep[k]++; if ((keyRep[k]-1)%7===0) pressed[k]=true; }
  }
}
const MOVE_KEYS=["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"];
function tap(k){ if (pressed[k]) { pressed[k]=false; return true; } return false; }
function dirTap(){
  if (tap("arrowup")||tap("w")) return [0,-1];
  if (tap("arrowdown")||tap("s")) return [0,1];
  if (tap("arrowleft")||tap("a")) return [-1,0];
  if (tap("arrowright")||tap("d")) return [1,0];
  const sd=steerHold();
  if (sd) return sd;
  return null;
}
function endFrame(){ for (const k in pressed) pressed[k]=false; }

/* ---------------- gamepad ---------------- */
const gpHold={}, gpPrev={};
function pollGamepad(){
  if (typeof navigator==="undefined" || !navigator.getGamepads) return;
  let pads=null;
  try { pads=navigator.getGamepads(); } catch(e){ return; }
  let gp=null;
  for (const g of pads){ if (g && g.connected){ gp=g; break; } }
  if (!gp) return;
  const btn=i=>!!(gp.buttons[i] && gp.buttons[i].pressed);
  const dx=gp.axes[0]||0, dy=gp.axes[1]||0;
  const dirs={
    arrowup:    btn(12) || dy<-0.5,
    arrowdown:  btn(13) || dy> 0.5,
    arrowleft:  btn(14) || dx<-0.5,
    arrowright: btn(15) || dx> 0.5
  };
  for (const k in dirs){
    if (dirs[k]){
      gpHold[k]=(gpHold[k]||0)+1;
      if (gpHold[k]===1 || gpHold[k]%8===0) pressed[k]=true;
    } else gpHold[k]=0;
  }
  const acts={ z:btn(0), x:btn(1), enter:btn(9), escape:btn(8), m:btn(3), f5:btn(2) };
  for (const k in acts){
    if (acts[k] && !gpPrev[k]) pressed[k]=true;
    gpPrev[k]=acts[k];
  }
}
function yesTap(){ return tap("z")||tap("enter")||tap(" "); }
function noTap(){ return tap("x")||tap("escape"); }
/* ----- canvas tap regions (phone: tap UI directly) ----- */
let uiHits=[];
function hit(x,y,w,h,fn){ uiHits.push({x,y,w,h,fn}); }
function pressZ(k){
  pressed[(k||"z").toLowerCase()]=true;
}
function toggleFS(){
  try {
    if (document.fullscreenElement){ if (document.exitFullscreen) document.exitFullscreen(); }
    else { const el=document.documentElement; if (el.requestFullscreen) el.requestFullscreen(); }
  } catch(e){}
}
function chip(label,x,y,w,fn,en){
  if (en===undefined) en=true;
  ctx.font="bold 9px 'Courier New',monospace";
  ctx.fillStyle= en? "#241b2d" : "#130e18";
  ctx.fillRect(x,y,w,13);
  ctx.strokeStyle= en? "#7d6f4c" : "#2a2233";
  ctx.strokeRect(x+.5,y+.5,w-1,12);
  const tw=ctx.measureText(label).width;
  txt(label,x+Math.max(1,Math.floor((w-tw)/2)),y+2, en? "#d8cba8" : "#685f76");
  if (en) hit(x,y,w,13,fn);
}
CVS.addEventListener("pointerdown", e=>{
  const r=CVS.getBoundingClientRect();
  const gx=(e.clientX-r.left)*W/r.width, gy=(e.clientY-r.top)*H/r.height;
  updSndUnlock();
  for (let i=uiHits.length-1;i>=0;i--){
    const h=uiHits[i];
    if (gx>=h.x && gx<h.x+h.w && gy>=h.y && gy<h.y+h.h){ e.preventDefault(); h.fn(gx,gy); break; }
  }
  if (!steer && !mapOpen && game && !game.ui.mode && ["base","dungeon","cellar","home"].indexOf(game.state)>=0)
    steer={ id:e.pointerId, x:gx, y:gy, fired:0, t0:worldTick };
});
/* ----- touch steering: hold a finger on the screen and the hero walks toward it ----- */
const STEER_DEAD = 10; /* canvas units around the hero where a held finger means "stand" */
let steer = null;
function steerSet(x,y){ steer = { id:1, x:x, y:y, fired:0, t0:-999 }; }
function steerClear(){ steer = null; }
function steerHeroPx(){
  if (!game) return null;
  if (game.state==="base"){
    const b=game.base;
    const cx=clamp(b.px-Math.floor(VWz/2),0,CW-VWz), cy=clamp(b.py-Math.floor(VHz/2),0,CH-VHz);
    return [(b.px-cx)*T*camZ+6, (b.py-cy)*T*camZ+6];
  }
  if (game.state==="dungeon" && game.dungeon){
    const d=game.dungeon, f=curFloor();
    const cx=clamp(d.px-Math.floor(VWz/2),0,f.w-VWz), cy=clamp(d.py-Math.floor(VHz/2),0,f.h-VHz);
    return [(d.px-cx)*T*camZ+6, (d.py-cy)*T*camZ+6];
  }
  if (game.state==="cellar" && game.cellar){
    const cm=game.cellar;
    return [Math.floor((W-cm.w*T)/2)+cm.px*T+4, Math.floor((H-cm.h*T)/2)+cm.py*T+4];
  }
  if (game.state==="home" && game.home){
    const hm=game.home;
    return [Math.floor((W-hm.w*T)/2)+hm.px*T+4, Math.floor((H-hm.h*T)/2)-6+hm.py*T+4];
  }
  return null;
}
function steerHold(){
  if (!steer || !game || mapOpen || game.ui.mode) return null;
  if (["base","dungeon","cellar","home"].indexOf(game.state)<0) return null;
  const hp=steerHeroPx(); if (!hp) return null;
  if (worldTick-steer.t0<12) return null; /* quick tap = tap-to-walk; hold = steer */
  const dx=steer.x-hp[0], dy=steer.y-hp[1];
  if (Math.hypot(dx,dy)<STEER_DEAD) return null;
  steer.fired=(steer.fired||0)+1;
  if (steer.fired>1 && (steer.fired-1)%6!==0) return null;
  return Math.abs(dx)>Math.abs(dy)? [dx>0?1:-1,0] : [0,dy>0?1:-1];
}
function cvPt(e){ const r=CVS.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width, (e.clientY-r.top)*H/r.height]; }
window.addEventListener("pointermove", e=>{
  if (steer && e.pointerId===steer.id){ const p=cvPt(e); steer.x=p[0]; steer.y=p[1]; }
});
function steerEnd(e){ if (steer && e.pointerId===steer.id) steer=null; }
window.addEventListener("pointerup", steerEnd);
window.addEventListener("pointercancel", steerEnd);
function drawSteerMark(){
  if (!steer || !game || mapOpen || game.ui.mode) return;
  if (["base","dungeon","cellar","home"].indexOf(game.state)<0) return;
  const hp=steerHeroPx(); if (!hp) return;
  ctx.strokeStyle="rgba(224,185,90,0.55)";
  ctx.beginPath(); ctx.arc(steer.x,steer.y,4,0,6.283); ctx.stroke();
  ctx.strokeStyle="rgba(224,185,90,0.25)";
  ctx.beginPath(); ctx.moveTo(hp[0],hp[1]); ctx.lineTo(steer.x,steer.y); ctx.stroke();
}
let hintMsg=null, hintT=0;
function showHint(m){ hintMsg=m; hintT=130; }
function cornerChips(){
  chip("BAG", W-178, 2, 32, ()=>{ if (game && !game.combat && !game.ui.mode) openBag(); else if (game && game.ui.mode==="menu") showHint("Finish here first."); });
  chip(sndOn? "SND":"MUTE", W-142, 2, 32, toggleSnd);
  chip("SAV", W-106, 2, 32, ()=>{ if (game) saveGame(); showHint("Chalked into the walls. (saved)"); });
  chip("FS", W-70, 2, 32, toggleFS);
}
CVS.addEventListener("contextmenu", e=>{ e.preventDefault(); pressed["x"]=true; });
/* ----- tap-to-walk (tap a tile, hero walks there) ----- */
let walkPath=null, walkCb=null, walkTick=0;
function stopWalk(){ walkPath=null; walkCb=null; }
function bfsPath(sx,sy,tx,ty,pass,w,h){
  if (sx===tx && sy===ty) return [];
  if (tx<0||ty<0||tx>=w||ty>=h) return null;
  const key=(x,y)=>x+","+y;
  const prev=new Map();
  prev.set(key(sx,sy), null);
  const q=[[sx,sy]]; let head=0;
  while (head<q.length){
    const c=q[head++], x=c[0], y=c[1];
    if (x===tx && y===ty){
      const path=[]; let cur=c;
      while (cur){ path.push(cur); cur=prev.get(key(cur[0],cur[1])); }
      path.reverse(); path.shift();
      return path;
    }
    const nb=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
    for (let i=0;i<4;i++){
      const nx=nb[i][0], ny=nb[i][1];
      if (nx<0||ny<0||nx>=w||ny>=h) continue;
      const k=key(nx,ny);
      if (prev.has(k)) continue;
      if (!pass(nx,ny)) continue;
      prev.set(k, c);
      q.push([nx,ny]);
    }
  }
  return null;
}
function dungPass(x,y){
  const f=curFloor();
  if (x<0||y<0||x>=f.w||y>=f.h) return false;
  if (f.grid[y][x]==="#") return false;
  return f.seen.has(x+","+y);
}
function walkTo(tx,ty,cb,pass,w,h){
  const src=game.state==="dungeon"? game.dungeon : game.base;
  if (tx===src.px && ty===src.py){ if (cb) cb(); return; }
  const path=bfsPath(src.px,src.py,tx,ty,pass,w,h);
  if (!path){ showHint("No path there from where you stand."); return; }
  walkPath=path; walkCb=cb||null; walkTick=4;
}

/* ----- the pack: read, equip, drop ----- */
function openBag(){
  const p=game.player;
  if (!game) return;
  const opts=[];
  opts.push({ t:"WIELDING: "+p.weapon.n+" (dmg "+p.weapon.d+")", d:itemDesc(p.weapon), fn:()=>{} });
  opts.push({ t:"WEARING: "+p.armor.n+" (armor "+p.armor.a+")", d:itemDesc(p.armor), fn:()=>{} });
  if (p.mail) opts.push({ t:"UNDER: "+p.mail.n+" (armor "+p.mail.a+")", d:itemDesc(p.mail), fn:()=>{} });
  opts.push({ t:"Armor total: "+playerDef(), d:"Whatever the dark throws, this much of it is wrong.", fn:()=>{} });
  p.inv.forEach((it,ix)=>opts.push({
    t: it.n+(it.qty>1? " x"+it.qty:"")+(it.kind==="weapon"?"  [weapon]":it.kind==="armor"?"  [armor]":"")+" - "+fmt(it.v*(it.qty||1))+"g",
    d: itemDesc(it),
    fn:()=>openItem(ix) }));
  if (!p.inv.length) opts.push({ t:"Your pack is all strap and good intentions.", fn:()=>{} });
  opts.push({ t:"Back", fn:()=>{} });
  showMenu("YOUR PACK ("+invUsed()+"/"+invCap()+")", opts);
}
function openItem(ix){
  const p=game.player, it=p.inv[ix];
  if (!it){ openBag(); return; }
  const opts=[];
  if (it.kind==="weapon"||it.kind==="armor"){
    const lbl= it.kind==="weapon"? "Wield it (swaps out the current one)"
      : isMail(it)? "Wear it UNDER your armor (the mail layer)"
      : "Wear it (swaps out the current one, mail stays)";
    opts.push({ t:lbl, fn:()=>{ equipItem(ix); openBag(); } });
  }
  if (it.kind==="food")
    opts.push({ t:"Eat it now (stamina +30)", fn:()=>{ useFromInv(it.n,1); game.player.stam=clamp(game.player.stam+30,0,maxStam());
        say(["Trail crumbs from your own hand. It helps, in the way bread does."], ()=>openBag()); saveGame(); } });
  opts.push({ t:"Turn it over in your hands (read)", fn:()=>{ say([itemDesc(it)], ()=>{}); } });
  opts.push({ t:"Leave it behind", fn:()=>{ p.inv.splice(ix,1);
      say(["You set it down gently, the way you leave someone else's grief."], ()=>openBag()); saveGame(); } });
  opts.push({ t:"Back", fn:openBag });
  showMenu(it.n.toUpperCase(), opts);
}
function equipItem(ix){
  const p=game.player, it=p.inv[ix];
  if (!it) return;
  if (it.kind==="weapon"){
    p.inv.splice(ix,1);
    p.inv.push({ n:p.weapon.n, v:8+p.weapon.d*6, kind:"weapon", qty:1, d:p.weapon.d });
    p.weapon={ n:it.n, d:it.d||3 };
    normGear(); sfx("gain");
  } else if (it.kind==="armor" && isMail(it)){
    p.inv.splice(ix,1);
    if (p.mail) p.inv.push({ n:p.mail.n, v:8+p.mail.a*6, kind:"armor", qty:1, a:p.mail.a, under:1 });
    p.mail={ n:it.n, a:it.a||1, under:1 };
    normGear(); sfx("gain");
  } else if (it.kind==="armor"){
    p.inv.splice(ix,1);
    p.inv.push({ n:p.armor.n, v:8+p.armor.a*6, kind:"armor", qty:1, a:p.armor.a });
    p.armor={ n:it.n, a:it.a||1 };
    normGear(); sfx("gain");
  }
  saveGame();
}

/* ----- the chest at home ----- */
function chestUsed(){ return (game.player.chest||[]).reduce((a,i)=>a+(i.qty||1),0); }
function openChest(){
  const p=game.player;
  if (!p.chest) p.chest=[];
  const opts=[];
  p.inv.forEach((it,ix)=>opts.push({ t:"Store: "+it.n+(it.qty>1? " x"+it.qty:""), fn:()=>{
      if (chestUsed()+(it.qty||1)>storageCap()){ say(["The chest is packed tight under the floorboards. The cellar upgrade would loosen it."], ()=>openChest()); return; }
      p.chest.push(it); p.inv.splice(ix,1); sfx("click"); openChest(); } }));
  p.chest.forEach((it,ix)=>opts.push({ t:"Take: "+it.n+(it.qty>1? " x"+it.qty:""), fn:()=>{
      if (invUsed()+(it.qty||1)>invCap()){ say(["Your pack argues against it, loudly. Set something down first."], ()=>openChest()); return; }
      p.inv.push(it); p.chest.splice(ix,1); sfx("click"); openChest(); } }));
  if (!opts.length) opts.push({ t:"Empty chest, empty pack. Character-building.", fn:()=>{} });
  opts.push({ t:"Back", fn:()=>{ openHome(true); } });
  showMenu("THE CHEST ("+chestUsed()+"/"+storageCap()+")", opts);
}

function computeDoorTiles(){
  const doors=[];
  if (!cityGrid) return doors;
  const isB=(x,y)=> x>=0&&y>=0&&x<CW&&y<CH && "BGD".indexOf(cityGrid[y][x])>=0;
  for (let y=1;y<CH-1;y++) for (let x=1;x<CW-1;x++){
    if (citySolid(x,y)) continue;
    if (isB(x,y-1)||isB(x,y+1)||isB(x-1,y)||isB(x+1,y)) doors.push([x,y]);
  }
  return doors;
}
function resList(){ return BUILDINGS.filter(b=>b.res); }
function workList(){ return BUILDINGS.filter(b=>b.work); }
function bldDoor(bl){
  const cands=[];
  for (let x=bl.x;x<bl.x+bl.w;x++){ cands.push([x,bl.y+bl.h]); cands.push([x,bl.y-1]); }
  for (let y=bl.y;y<bl.y+bl.h;y++){ cands.push([bl.x-1,y]); cands.push([bl.x+bl.w,y]); }
  const okc=cands.filter(c=>c[0]>=1&&c[1]>=1&&c[0]<CW-1&&c[1]<CH-1&&!citySolid(c[0],c[1]));
  return okc.length? okc[irnd(okc.length)] : null;
}

function townAge(wk){ return Math.floor(wk.age0+(game.week-wk.born)/52); }
function updTownfolk(){
  if (!game.townfolk) game.townfolk=[];

  while (game.townfolk.length<9 && guardN++<12){ spawnTownfolk(); }
  for (let i=game.townfolk.length-1;i>=0;i--){
    const wk=game.townfolk[i];
    if (wk.sentinel) continue;
    if (wk.fireIdle){
      wk.t--;
      if (wk.t<=0){
        wk.t=240+irnd(320);
        const near=[[wk.x+1,wk.y],[wk.x-1,wk.y],[wk.x,wk.y+1],[wk.x,wk.y-1]]
          .filter(cc=>cc[0]>=1&&cc[1]>=1&&cc[0]<CW-1&&cc[1]<CH-1&&!citySolid(cc[0],cc[1]));
        if (near.length && Math.random()<0.8){ const cc=near[irnd(near.length)]; wk.x=cc[0]; wk.y=cc[1]; }
        else if (Math.random()<0.5){ const tgt=fireSpotTarget(FIRE_SPOTS[irnd(FIRE_SPOTS.length)]); if (tgt){ wk.x=tgt[0]; wk.y=tgt[1]; } }
      }
      continue;
    }
    if (!game.flags.unburied) game.flags.unburied=[];
    if (wk.lastW!==game.week){
      const dw=Math.min(52,game.week-wk.lastW);
      wk.lastW=game.week;
      if (townAge(wk)>58 && Math.random()<1-Math.pow(0.92,dw)){
        game.townfolk.splice(i,1);
        game.flags.news.push(wk.name+" died at "+townAge(wk)+", mid-errand. The city stepped around the spot for a while.");
        game.flags.unburied.push(wk.name);
        continue;
      }
    }
    if (wk.inside>0){
      wk.inside--;
      if (wk.inside<=0){
        if (!game.doorTiles || !game.doorTiles.length) game.doorTiles=computeDoorTiles();
        const at=BUILDINGS.find(bb=>bb.id===wk.atId);
        const fr=(at && bldDoor(at)) || game.doorTiles[irnd(game.doorTiles.length)];
        wk.x=fr[0]; wk.y=fr[1];
        const nid= wk.atId===wk.homeId? wk.workId : wk.homeId;
        const nb=BUILDINGS.find(bb=>bb.id===nid);
        let to=(nb && bldDoor(nb)) || game.doorTiles[irnd(game.doorTiles.length)];
        wk.toId=nid; wk.lingering=false;
        if (FIRE_SPOTS && FIRE_SPOTS.length && Math.random()<0.35){
          const fs=FIRE_SPOTS[irnd(FIRE_SPOTS.length)];
          const tgt=fireSpotTarget(fs);
          if (tgt){ to=tgt; wk.toId="fire"; wk.lingering=true; }
        }
        wk.path=bfsPath(wk.x,wk.y,to[0],to[1],(x,y)=>!citySolid(x,y),CW,CH)||[];
        wk.i=0; wk.t=26+irnd(20);
      }
      continue;
    }
    if (wk.linger>0){
      wk.linger--;
      if (wk.linger<=0){
        if (Math.random()<0.35){
          game.townfolk.splice(i,1);
          if (Math.random()<0.85) spawnTownfolk();
        } else {
          if (!game.doorTiles || !game.doorTiles.length) game.doorTiles=computeDoorTiles();
          const nid= wk.workId || wk.homeId;
          const nb=BUILDINGS.find(bb=>bb.id===nid);
          const to2=(nb && bldDoor(nb)) || game.doorTiles[irnd(game.doorTiles.length)];
          wk.atId=nb?nb.id:null;
          wk.toId=nid;
          wk.path=bfsPath(wk.x,wk.y,to2[0],to2[1],(x,y)=>!citySolid(x,y),CW,CH)||[];
          wk.i=0; wk.t=26+irnd(20);
        }
      }
      continue;
    }
    wk.t--;
    if (wk.t>0) continue;
    wk.t=26+irnd(20);
    if (wk.path && wk.i<wk.path.length){
      const st=wk.path[wk.i];
      wk.x=st[0]; wk.y=st[1]; wk.i++;
    } else if (wk.lingering){
      wk.lingering=false;
      wk.linger=200+irnd(280);

      game.flags.lastArrived=wk.name;
      if (wk.toId) wk.atId=wk.toId;
      wk.inside=140+irnd(220);
      if (Math.random()<0.12){
        game.townfolk.splice(i,1);
        if (Math.random()<0.85) spawnTownfolk();
      }
    }
  }
}

/* ----- the body's credit: stamina below zero is loaned meat ----- */
const STAM_FLOOR=-25;
const LOAN_MILES=[
  { at:0.01, head:"UNDER EMPTY - THE BODY LENDS", warn:"You are below empty, running on the body's own credit. It collects as it goes - an injury or an illness for every stretch of the loan. The further you press, the closer the whole debt comes to coming due." },
  { at:8,    head:"THE LOAN TAKES AGAIN", warn:"It is collecting in meat and sickness, and -25 is the end of the credit. Past that line, every step is a roll to keep standing." },
  { at:16,   head:"THE LOAN TAKES AGAIN", warn:"Credit is nearly gone. Eat, sleep, or turn back - anything past -25 is a death roll at the body's table." },
  { at:24,   head:"THE LAST OF THE CREDIT", warn:"Every step from here is a death roll at the body's table. Eat now, climb now, or the debt is collected in full." }
];
function exhaustAilment(){
  const p=game.player;
  p.wounds=p.wounds||[];
  if (!p.ills) p.ills=[];
  if (Math.random()<0.5){
    const limb=pick(["knee","back","ribs","hand","leg","arm"]);
    if (p.wounds.indexOf(limb)<0){ p.wounds.push(limb);
      return "It takes payment in flesh: your "+limb+" goes wrong. (a new wound)"; }
    return "It takes payment in flesh: your old "+limb+" wakes up worse.";
  } else {
    const ill=pick(["a wracking cough","the deep sweats","a fever with opinions","an ear-sickness that tilts every corridor"]);
    if (p.ills.length<4){ p.ills.push(ill);
      return "It takes payment in sickness: you catch "+ill+". (every check carries it)"; }
    return "You are already as sick as a body can be. It bills you anyway.";
  }
}
function exhaustHit(mi){
  say([mi.head, mi.warn, exhaustAilment()]);
}
function drainStam(v){
  const p=game.player;
  const was=p.stam;
  p.stam=clamp(p.stam-v,STAM_FLOOR,maxStam());
  if (p.stam===was) return;
  if (p.stam>=0){ p.loanMile=0; return; }
  if (p.loanMile===undefined) p.loanMile=0;
  while (p.loanMile<LOAN_MILES.length && (-p.stam)>LOAN_MILES[p.loanMile].at){
    exhaustHit(LOAN_MILES[p.loanMile]);
    p.loanMile++;
  }
}
function maxStam(){
  const p=game.player;
  return 100 + (p.upgrades.indexOf("leak")>=0?15:0);
}
function invCap(){ return 10 + (game.player.packs||0)*3; }
function invUsed(){ let s=0; for (const it of game.player.inv) s+=(it.qty||1); return s; }
function storageCap(){ return houseRoom("cellar")? 36 : 12; }
function houseRoom(id){
  const p=game.player;
  if (p.rooms && p.rooms.indexOf(id)>=0) return true;
  return id==="cellar" && p.upgrades && p.upgrades.indexOf("cellar")>=0;
}
function roomsBuilt(){
  const p=game.player;
  let n=0;
  for (const r of HOUSE_ROOMS) if (houseRoom(r.id)) n++;
  return n;
}
function houseRoomCost(){ return 500+500*roomsBuilt(); }
function healPerRest(){
  const p=game.player;
  let h=8;
  if (p.spouse) h+=6;
  if (p.upgrades.indexOf("hearth")>=0) h+=10;
  return h;
}

/* ---------------- UI primitives ---------------- */
function showText(lines, cb){
  const pages=[];
  for (const line of lines){
    const rows=wrap(String(line),56);
    for (let i=0;i<rows.length;i+=4) pages.push(rows.slice(i,i+4).join("\n"));
  }
  game.ui.mode="text";
  game.ui.dialog={ lines:pages.length?pages:["(silence)"], i:0 };
  game.ui.onclose=cb||null;
}
function showMenu(title, opts, oncancel){
  game.ui.mode="menu";
  game.ui.menu={ title:title, opts:opts, sel:0 };
  game.ui.oncancel=oncancel||null;
}
function closeUI(){ game.ui.mode=null; game.ui.menu=null; game.ui.dialog=null; game.ui.onclose=null; game.ui.oncancel=null; }
function uiBlocked(){ return game.ui.mode!==null; }
function say(lines, cb){ showText(lines, cb); }

/* ---------------- item helpers ---------------- */
function addItem(n, v, kind, qty){
  qty = qty||1;
  const p=game.player;
  for (const it of p.inv){ if (it.n===n && it.kind===kind){ it.qty+=qty; return true; } }
  if (p.inv.length>=invCap()){ say(["Your pack is stuffed to bursting. You leave the "+n+" in the dark."]); return false; }
  p.inv.push({n:n, v:v, kind:kind||"loot", qty:qty});
  return true;
}
function countItem(n){ const p=game.player; let c=0; for (const it of p.inv) if (it.n===n) c+=it.qty; return c; }
function takeOne(it, per, next){
  const p=game.player;
  const hasSpace = p.inv.some(o=>o.n===it.n && o.kind===it.kind) || p.inv.length<invCap();
  if (hasSpace){
    if (addItem(it.n,it.v,it.kind)){ if (per) per(it); }
    if (next) next();
    return;
  }
  if (!p.inv.length){ if (next) next(); return; }
  showMenu("PACK FULL - the "+it.n+" wants in",
    p.inv.map((o,ix)=>({
      t:"Drop "+o.n+(o.qty>1?" x"+o.qty:""),
      fn:()=>{ p.inv.splice(ix,1);
        if (addItem(it.n,it.v,it.kind)){ if (per) per(it); }
        if (next) next(); }
    })).concat([{ t:"Leave "+it.n+" in the dark", fn:()=>{ if (next) next(); } }])
  );
}
function takeMany(list, per, done){
  if (!list.length){ if (done) done(); return; }
  takeOne(list[0], per, ()=>takeMany(list.slice(1), per, done));
}
function useFromInv(n, qty){
  qty=qty||1; const p=game.player;
  let left=qty;
  for (let i=p.inv.length-1;i>=0 && left>0;i--){
    const it=p.inv[i];
    if (it.n===n){ const take=Math.min(it.qty,left); it.qty-=take; left-=take; if (it.qty<=0) p.inv.splice(i,1); }
  }
  return left===0;
}
function rollLoot(tier, rolls){
  const out=[];
  const pool=LOOT.slice();
  const total=pool.reduce((s,l)=>s+l.w,0);
  const dep=(game && game.dungeon && game.dungeon.depth) || 1;
  const dfac=1+0.15*(dep-1);
  for (let i=0;i<rolls;i++){
    let r=Math.random()*total;
    for (const l of pool){ r-=l.w; if (r<=0){ out.push({n:l.n, v:Math.max(1,Math.round(l.v*(0.8+0.4*tier*0.35)*dfac*ngLootMul())), kind:"loot", qty:1}); break; } }
  }
  return out;
}

function buildCity(){
  const g=[];
  for (let y=0;y<CH;y++) g.push(new Array(CW).fill("."));
  for (let y=0;y<CH;y++) for (let x=0;x<CW;x++)
    if ((x*7+y*13)%31===0) g[y][x]=",";
  for (let y=19;y<22;y++) for (let x=17;x<27;x++) g[y][x]="o";
  for (let x=2;x<CW-2;x++) g[20][x]="r";
  for (let y=2;y<CH-2;y++){ g[y][24]="r"; g[y][17]="r"; g[y][47]="r"; }
  for (const b of BUILDINGS){
    if (b.home && !(game && game.player && game.player.house)) continue;
    for (let y=b.y;y<b.y+b.h;y++) for (let x=b.x;x<b.x+b.w;x++){
      /* every building is solid, gatehouse and training yard included - the
         gate's oaken doors are drawn shut and the yard is walled ground;
         you stand beside a building to use it, never inside its footprint */
      g[y][x]="B";
    }
    if (b.home) g[b.door[1]][b.door[0]]="D";
  }
  g[21][7]="B"; g[8][29]="B"; /* the two meal carts - solid, you walk around a kettle */
  return g;
}
let cityGrid = null;
function citySolid(x,y){
  if (x<0||y<0||x>=CW||y>=CH) return true;
  if (!cityGrid) cityGrid=buildCity();
  return cityGrid[y][x]==="B";
}
function tryBaseMove(dx,dy){

  heroFace = dy>0?"dn":dy<0?"up":dx>0?"rt":"lf";
}
/* other adventurers try to rob you when you look worth it */
function maybeMugged(){
  const p=game.player;
  if (game.ui.mode || game.combat || gDice) return;
  const lastMug=game.flags.lastMug||0;
  if (game.week-lastMug<8) return;
  const purse=p.gold, loot=lootValue();
  const heat=(purse>=70? 1:0)+(loot>=80? 1:0);
  if (!heat) return;
  if (Math.random()>0.004*heat) return;
  game.flags.lastMug=game.week;
  stopWalk();
  const who=pick(ADV_NAMES);
  showText([who+" falls into step beside you, hood up, hands loose. Empty street, wrong hour. Somebody counted your purse at the market.",
            "\"Coin or blood, "+addr()+". The ward has seen worse either way.\""], ()=>{
    showMenu(who.toUpperCase()+" - A QUIET STREET", [
      { t:"Hand over a tithe (20% of coin)", fn:()=>{ const t2=Math.floor(p.gold*0.2); p.gold-=t2;
          saveGame();
          say([who+" takes "+fmt(t2)+" with unsettling courtesy and is gone between two raindrops.",
               "The city taxes its living twice."]); } },
      { t:"Show steel & nerve (Steel or Will)", fn:()=>{
          if (p.weapon.d>=5 || check("wll",11)){
            say(["You just look at them. Something in their face does its own arithmetic.","They drift away like weather."]); }
          else { const t2=Math.floor(p.gold*0.3); p.gold-=t2;

function nearBuilding(b, px, py){
  if (b.home){
    return Math.abs(px-b.door[0])<=1 && Math.abs(py-b.door[1])<=1;
  }
  return (px>=b.x-1 && px<=b.x+b.w && py>=b.y-1 && py<=b.y+b.h);
}
function enterBuilding(b){
  if (KEEPERS[b.id]){
    const v=bumpVisit(b.id);
    const g=keeperGreet(b.id);
    const chat= v>=6 && Math.random()<0.35 ? keeperChat(b.id) : null;
    const show= v<=2 || v===4 || v===8 || v===13 || !!chat;
    if (show && (g || chat)){ say([].concat(g||[], chat? [chat]:[]), ()=>openFacility(b)); return; }
  }
  openFacility(b);
}
function openFacility(b){
  switch (b.id){
    case "guild": openGuild(); break;
    case "market": openMarket(); break;
    case "clinic": openClinic(); break;
    case "church": openChurch(); break;
    case "tavern": openTavern(); break;
    case "office": openOffice(); break;
    case "yard": openYard(); break;
    case "gate": openGate(); break;
    case "home": openHome(); break;
    case "doss": openDoss(); break;
    default:
      if (b.res){
        const fol=game.townfolk.filter(w=>w.homeId===b.id);
        const names=fol.map(w=>w.name).join(", ");
        say([b.label+": "+pick(RES_LINES),
             names? "Living here now: "+names+"." : "No one admits to living here officially. Someone is clearly lying."]);
      } else if (b.work){
        const fol=game.townfolk.filter(w=>w.workId===b.id);
        const names=fol.map(w=>w.name).join(", ");
        const opts=[{ t:"Loiter among the workers", fn:()=>{
            say([b.label+": "+(WORK_LINES[b.id]||"Work happens here. Nobody loves it."),
                 names? "At the benches today: "+names+"." : "The benches are empty. Odd hour, or late debts."]); } }];
        if (WORK_JOBS[b.id] && game.player.stam>=35)
          opts.unshift({ t:"Take a shift (2 weeks, stamina -35)", d:WORK_JOBS[b.id].hint, fn:()=>workShift(b.id) });
        if (b.id==="pawn" && LORE_KINGDOM.some(r=>r.src==="market" && !hasRumor(r.id)))
          opts.push({ t:"Ask about the crown's business", fn:()=>{
              const r=pick(LORE_KINGDOM.filter(x=>x.src==="market" && !hasRumor(x.id)));
              findRumor(r.id, "the pawnbroker, who has priced everything");
              say(["He looks at you the way he looks at a fake ring: as a number with hopes.",
                   "Everything the kingdom ships in stays. Nothing ships out. \"You work that out,\" he says."]); } });
        showMenu(b.label.toUpperCase(), opts);
      }
  }
}

    else if (np===p.partner) st="holds your eye ("+affWord(np.aff)+")";
    else if (np.marriedTo!==null) st="wed to "+np.marriedTo+(np.kids? " ("+np.kids+" children)":"");
    else if (np.parentOfYou) st="your parent, still pouring one for your old life";
    else st="unattached";
    return { t:np.name.split(" ")[0]+" - "+age+"y - "+st, fn:()=>aboutNpc(np) };
  });
  showMenu("THE ROOM TONIGHT", rows.concat([{t:"Back", fn:openTavern}]));
}
function aboutNpc(np){
  const p=game.player;
  np.met=true; voiceSfx(np.name);
  say([np.name+" ("+Math.floor(np.ageWeeks/52)+"y): "+np.desc,
       "\"" +pick(np.talks)+"\""], ()=>{
    if (np.dead){ say([np.name+" is past all courting. The Lamp keeps their stool anyway."], rosterMenu); return; }
    if (np===p.spouse){
      showMenu(np.name.toUpperCase(), [
        { t:"Sit with "+np.name.split(" ")[0], fn:spouseScene },
        { t:"Back to the room", fn:rosterMenu }
      ], rosterMenu);
      return;
    }
    if (np!==p.partner && np.marriedTo!==null){
      say([np.name+" is wed, in the way of this city: for debt, for luck, or once by accident. Nobody asks which."], rosterMenu);
      return;
    }
    showMenu(np.name.toUpperCase(), [
      { t:(np===p.partner? "Court "+np.name.split(" ")[0]+" again":"Begin courting "+np.name.split(" ")[0]), fn:()=>{ p.partner=np; np.met=true; courtWith(); } },
      { t:"Back to the room", fn:rosterMenu }
    ], rosterMenu);
  });
}
function listenTavern(){
  const p=game.player;
  if (p.gold<8){ sharkTrigger(); say(["You have empty pockets and excellent hearing."], ()=>openTavern()); return; }
  p.gold-=8;
  say([pick([
    "\"The Cessgate worms burrow up through the Ossuary floors these days.\"",
    "\"Soldiers go down, lovers come back. Choose which you are before you pick a door.\"",
    "\"You can marry here, or you can die rich. The city accepts both documents.\"",
    "\"Never eat anything down there that offers itself.\"",
    "\"The Long Mother is a story. A story with fifty hands, but a story.\""
  ])], ()=>{ if (Math.random()<0.15) findLore("changed","the wrong stories, told right");
             openTavern(); });
}
function tavernAgents(){
  const p=game.player;
  if (p.gold<8){ sharkTrigger(); say(["They glance at your empty hands and pour their wine thinner."], ()=>openTavern()); return; }
  p.gold-=8;
  const unfound=LORE_KINGDOM.filter(r=>r.src==="tavern" && !hasRumor(r.id));
  const r=unfound.length? pick(unfound) : null;
  const lines=["You take the corner table. Two straight-backed strangers with court vowels are asking divers, gently, what cures age down there.",
               "\"There is nothing down there but teeth,\" somebody mutters. The strangers write down the teeth."];
  if (r){
    findRumor(r.id, "the polite strangers");
    lines.push("One of them buys you a wine you did not order and pays with coin too new to be dirty.");
  } else if (crownStageNum()>=4){
    lines.push("They wear crown mail now. The question has changed. Not what cures age - where the stairs open, and how wide.");
  }
  if (game.flags.war){
    lines.push("The strangers are gone. At the long table sit deserters, drinking like men paying for groceries with someone else's ration-book.");
    lines.push("They ask nothing about cures. They ask where the stairs open wide - because below, nobody checks a war record.");
  }
  say(lines, ()=>openTavern());
  saveGame();
}
function courtMeet(){
  const p=game.player;
  if (p.partner || p.spouse){ say(["You've already given your word. The Lamp does not host liars."], ()=>openTavern()); return; }
  const singles=game.npcs.filter(x=>!x.met && !x.dead && x.marriedTo===null && !x.parentOfYou);
  if (singles.length){
    const np=pick(singles); np.met=true;
    p.partner=np;
    say(["You drift toward "+np.name+" ("+Math.floor(np.ageWeeks/52)+"y).", np.desc], ()=>courtWith());
  } else if (!game.npcs.some(x=>!x.met && !x.dead && x.marriedTo===null && !x.parentOfYou)){
    say(["Nobody here is unattached, and nobody new has drifted in.",
         "Time passes for everyone while you are underground. That is the arrangement."], ()=>openTavern());
  } else {
    say(["The same faces, night after night. Familiar, at least."], ()=>openTavern());
  }
}
function courtWith(){
  const pt=game.player.partner;
  if (!pt){ return; }
  if (pt.dead || pt.marriedTo!==null){
    game.player.partner=null;
    say([pt.dead? "She is dead. The lamp in the shop burns for the both of you now."
               : "She has wed "+pt.marriedTo+" while you emptied rooms of their horrors."], ()=>openTavern());
    return;
  }
  voiceSfx(pt.name);
  showMenu(pt.name+" ("+Math.floor(pt.ageWeeks/52)+"y) - "+affWord(pt.aff), [
    { t:"Talk", fn:()=>partnerTalk(pt) },
    { t:"Give a gift", fn:()=>giftMenu(pt) },
    { t:"Declare your intent"+(countItem("Bone Ring")? " (a Bone Ring in your pack)":""), fn:proposeCourt },
    { t:"Back", fn:openTavern }
  ], openTavern);
}
function affWord(a){ return a>=80?"hopeless for you":a>=50?"warms to you":a>=25?"tolerates you":"cold"; }
function courtBonus(){ return game.player.scrubbed? 2:0; }
function partnerTalk(pt){
  const cb=courtBonus();
  pt.aff=clamp(pt.aff+4+cb,0,100);
  if (cb) game.player.scrubbed=false;
  const bank=(pt.talks && pt.talks.length)? pt.talks : GENERIC_TALKS;
  say([pick(bank)], ()=>courtWith());
}
function giftMenu(pt){
  const p=game.player;
  const opts=p.inv.map(i=>({
    t:i.n+" x"+i.qty+(i.kind==="gift"?" - true gift":""),
    fn:()=>{
      let gain=clamp(Math.round(i.v/10),1,14);
      const cb=courtBonus();
      if (i.kind==="gift") gain=18;
      game.player.scrubbed=false;
      useFromInv(i.n,1); pt.aff=clamp(pt.aff+gain+cb,0,100);
      say(["You offer the "+i.n+". "+pt.name.split(" ")[0]+" accepts it like it means something.",
           "Affection +"+(gain+cb)+(cb? " - you smell of soap and rosewater. It helps." : ".")+"."], ()=>courtWith());
    }
  }));
  if (!opts.length){ say(["Empty hands. Somehow that reads as honesty, in here."], ()=>courtWith()); return; }
  showMenu("GIFT WHAT?", opts.concat([{t:"Back", fn: ()=>courtWith()}]), ()=>courtWith());
}
function proposeCourt(){
  const pt=game.player.partner, p=game.player;
  if (!pt) return;
  if (pt.dead || pt.marriedTo!==null){
    p.partner=null;
    say([pt.dead? "You never asked in time. The city took the door before you reached it."
               : pt.name+" wed "+pt.marriedTo+" while you were down there."], ()=>openTavern());
    return;
  }
  if (!countItem("Bone Ring")){
    say(["Your intent is plain. Your pockets are not. A Bone Ring from the Grave-Market would stand you in good stead."], ()=>courtWith());
    return;
  }
  if (pt.aff<50){
    pt.aff=clamp(pt.aff-5,0,100);
    say([pt.name+" looks at the ring, then at you. \"A ring is not a history. Ask me again when I know you.\""], ()=>courtWith());
    return;
  }
  if (!p.house){
    say([pt.name+" laughs - not cruelly. \"Marry you to what? A bunk in a guild dorm? Own four walls first.\""], ()=>courtWith());
    return;
  }
  useFromInv("Bone Ring");
  p.spouse=pt; p.partner=null; pt.aff=100; pt.marriedTo="you";
  sfx("bell"); setTimeout(()=>sfx("bell"), 700); setTimeout(()=>sfx("bell"), 1400);
  earnTitle("Wed Under the Lamp");
  say([pt.name+" turns the ring in the tallow light. Then she closes your hand over it.",
       "\"Wear it till I put it back on you properly. Home. Tonight.\"",
       "You are wed. The Lamp cheers out of habit, then sincerity."]);
  advanceWeeks(2);
  saveGame();
}
function spouseScene(){
  const p=game.player;
  voiceSfx(p.spouse.name);
  say(["You sit with "+p.spouse.name+" ("+Math.floor(p.spouse.ageWeeks/52)+"y). For a while, the city is just noise outside your own four walls.",
       "\"Stamina up,\" "+p.spouse.name.split(" ")[0]+" mutters into your shoulder. That is married for 'I love you.'"], ()=>openTavern());
}

/* ----- property & family ----- */
function openOffice(){
  const p=game.player;
  if (!p.house){
    showMenu("HOUSING OFFICE", [
      { t:"Buy the Leaning Tenement (500g)", d:"A crooked two-room home in Ward Nine. Good bones. Somewhere.", fn:buyHouse },
      { t:"Leave", fn:()=>{} }
    ]);
  } else {
    const opts=UPGRADES.filter(u=>p.upgrades.indexOf(u.id)<0).map(u=>({
      t:u.n+" ("+fmt(u.cost)+")", d:u.d,
      fn:()=>{ if (p.gold<u.cost){ sharkTrigger(); say(["Short by "+fmt(u.cost-p.gold)+". The clerk shrugs like the weather."], ()=>openOffice()); return; }
        p.gold-=u.cost; p.upgrades.push(u.id);
        p.stam=clamp(p.stam,0,maxStam());
        checkTitles();
        say(["Work crews come. They hammer. They argue. They leave. "+u.n+": done."], ()=>openOffice());
        saveGame(); }
    }));
    const rc=houseRoomCost();
    for (const r of HOUSE_ROOMS){
      if (houseRoom(r.id)) continue;
      opts.push({ t:"Build "+r.n+" ("+fmt(rc)+")", d:r.d, fn:()=>buildAddition(r.id) });
    }
    const standing=HOUSE_ROOMS.filter(r=>houseRoom(r.id)).map(r=>r.n).join(", ");
    if (standing) opts.push({ t:"(standing: "+standing+")", fn:()=>{} });
    if (p.spouse && !p.child && p.upgrades.indexOf("nursery")>=0 && p.tryChild!==1){
      opts.push({ t:"Speak of children", fn:()=>{
        p.tryChild=1; advanceWeeks(4);
        say(["You and "+p.spouse.name.split(" ")[0]+" decide, quietly, to chance it.",
             "The city has taken so much. It can stand to give something back."], ()=>openOffice());
        saveGame(); }});
    }
    opts.push({ t:"Leave", fn:()=>{} });
    showMenu("HOUSING OFFICE - improvements", opts);
  }
}
const HOUSE_ROOMS=[
  { id:"kitchen",    n:"the Kitchen",        d:"A stove and a heavy table. The pantry feeds you properly: once per delve, stamina +60." },
  { id:"bedchamber", n:"the Bedchamber",     d:"A real bed, a door that shuts. Sleep heals you in three days instead of seven." },
  { id:"washroom",   n:"the Washroom",       d:"A copper tub. Once per delve: sweat out one sickness, and walk out scrubbed - prettiness counts, in courtship." },
  { id:"cellar",     n:"the Cellar",         d:"A stair down to a cold room of crates and barrels. Storage doubled. The barrels were here before the house. One of them hides something." },
  { id:"gym",        n:"the Gymnasium",      d:"A worn floor, a barrel-tree, dead man's rope. Train Strength or Agility for 50 stamina." },
  { id:"study",      n:"the Study",          d:"A desk, a lamp, borrowed carts of paper. Train Wits for 50 stamina." },

function buildAddition(id){
  const p=game.player, r=HOUSE_ROOMS.find(x=>x.id===id);
  if (!r || houseRoom(id)) return;
  const cost=houseRoomCost();
  if (p.gold<cost){ sharkTrigger(); say(["Work crews price honesty, not hope. You are short by "+fmt(cost-p.gold)+"."], ()=>openOffice()); return; }
  p.gold-=cost;
  p.rooms.push(id);
  advanceWeeks(2);
  const done={
    kitchen:"A stove is lit once, for luck. It never fully goes out again.",
    bedchamber:"They carry the bed up in pieces and take the old one away respectfully, like a veteran.",
    washroom:"The copper tub arrives by four men and one argument. The house creaks and accepts it.",
    cellar:"The stair down is chalked with someone's old handmarks. They do not match yours.",
    gym:"The floor under the barrel-tree is already worn. By whom, nobody will say.",
    study:"The desk is second-hand. The ink stains are paragraph-shaped.",
    shrine:"The stones settle into their corner as if they had been waiting for the address."
  };
  say(["Work crews come. They hammer. They argue. They leave. "+r.n+": done.",
       done[id] || "The house leans differently now."], ()=>openOffice());
  saveGame();
}

function buyHouse(){
  const p=game.player;
  if (p.gold<500){ sharkTrigger(); say(["The clerk quotes the price again, slower, like you are hard of hearing."], ()=>openOffice()); return; }
  p.gold-=500; p.house="Leaning Tenement";
  cityGrid=buildCity();
  earnTitle("Householder of Ward Nine");
  say(["Keys. A deed with a wax stamp. A door that only leans when it rains.",
       "The Leaning Tenement is yours. When you die, it stays. That is the whole point of it."]);
  advanceWeeks(2);
  saveGame();
}

/* ----- the house: its own small map ----- */
const HOME_ROWS=[
  "################",
  "#.....w........#",
  "#B...........T.#",
  "#....P.........#",
  "#C.......L.....#",
  "#...Y....N.....#",
  "#....H.......S.#",
  "#..R....W......#",
  "#..............#",
  "#######D########"
];
function buildHome(){
  return { w:HOME_ROWS[0].length, h:HOME_ROWS.length, rows:HOME_ROWS.slice(), px:7, py:8 };
}
function homeTile(x,y){ const hm=game.home; if (!hm||x<0||y<0||x>=hm.w||y>=hm.h) return "#"; return hm.rows[y][x]; }
function homeSolid(x,y){ const c=homeTile(x,y); return c!=="." && c!=="D"; }
function homeAdjacent(){
  const hm=game.home; if (!hm) return null;
  const px=hm.px, py=hm.py;
  for (const ch of ["B","C","H","N","L","P","T","Y","S","R","W"]){
    if (homeTile(px,py-1)===ch) return ch;
    if (homeTile(px,py+1)===ch) return ch;
    if (homeTile(px-1,py)===ch) return ch;
    if (homeTile(px+1,py)===ch) return ch;
  }
  return null;
}
function homeInteract(ch){
  const p=game.player;
  if (ch==="B"){
    const days=houseRoom("bedchamber")? 3:7;
    showMenu("THE BED", [
      { t:"Sleep ("+days+" days, stamina to full)", d:houseRoom("bedchamber")? "A real bed in a shut room. Sleep has learned to hurry.":"The straw is yours. The dreams are on loan.", fn:homeRest },
      { t:"Not yet", fn:()=>{} }
    ]);
  } else if (ch==="C"){
    openChest();
  } else if (ch==="P"){
    if (p.pantryUsed){ say(["The pantry was raided for the road. The shelves hold honest air until you delve again."]); return; }
    if (p.stam>=maxStam()){ say(["You are not hungry. The pantry disagrees and wins later."]); return; }
    const gain=houseRoom("kitchen")? 60:25;
    p.pantryUsed=true;
    p.stam=clamp(p.stam+gain,0,maxStam());
    say([houseRoom("kitchen")? "Stove-warm bread, real broth, the stove ticking to itself. Stamina +"+gain+"."
                            : "Bread of questionable ancestry. It does its job. Stamina +"+gain+"."], null);
    saveGame();
  } else if (ch==="L"){
    if (p.gatekeeper){
      showMenu("THE LAMP", [
        { t:"Pass the lamp - begin a successor", d:"The city will need a warden at the Gate when you are done walking.", fn:passTheLamp },
        { t:"Not yet", fn:()=>{} }
      ]);
    } else say(["Your delve-lamp hangs on its hook, still smelling of the deep.",
                "One day it might hang on a different hook, in a different pair of hands."]);
  } else if (ch==="H"){
    if (p.upgrades.indexOf("hearth")<0){ say(["A black firebox full of last winter's ash. Somebody dreamed broth here once."]); return; }
    advanceWeeks(1);
    p.stam=clamp(p.stam+6,0,maxStam());
    say([p.spouse? p.spouse.name.split(" ")[0]+" puts the kettle on without being asked. You stand a while by the fire."
                : "You stand a while by the fire, listening to the rain get the roof wrong.",
         "Stamina +6. An evening passes."]);
    if (game.flags.posthumous) say(["The chair by the hearth still holds the shape of the one the house buried."]);
    saveGame();
  } else if (ch==="Y"){
    if (!houseRoom("gym")){ say(["A corner with a ceiling stain shaped like a fist. Nothing more. Yet."]); return; }
    showMenu("THE GYMNASIUM", [
      { t:"Train Strength (50 stamina)", d:"The barrel-tree has held heavier regrets than yours.", fn:()=>homeTrain("str","Strength") },
      { t:"Train Agility (50 stamina)", d:"Rope, footwork, and falling correctly, mostly.", fn:()=>homeTrain("agi","Agility") },
      { t:"Not today", fn:()=>{} }
    ]);
  } else if (ch==="S"){
    if (!houseRoom("study")){ say(["A corner good only for storage of things you refuse to sell."]); return; }
    showMenu("THE STUDY", [
      { t:"Train Wits (50 stamina)", d:"Hours of lamps and marginalia. The paper fights back.", fn:()=>homeTrain("wit","Wits") },
      { t:"Not tonight", fn:()=>{} }
    ]);
  } else if (ch==="R"){
    if (!houseRoom("shrine")){ say(["Dust, and a shape on the boards, as if something square stood here a very long time."]); return; }
    showMenu("THE CORNER SHRINE", [
      { t:"Whisper to the lost stones (50 stamina)", d:"The city's first gods. They do not answer. They listen. That is more than most.", fn:()=>homeTrain("wll","Will") },
      { t:"Look away", fn:()=>{} }
    ]);
  } else if (ch==="W"){
    if (!houseRoom("washroom")){ say(["A gray tub gone to splinters. Somebody bathed here once, unhappily."]); return; }
    if (p.washUsed){ say(["The tub was drained before the kettle cooled. It draws a bath once a delve."]); return; }
    if (p.ills && p.ills.length){
      const gone=p.ills.shift();
      p.washUsed=true; p.scrubbed=true;
      advanceWeeks(1);
      say(["You soak until the water goes the color of "+gone+" leaving. The sickness pour out the drain, offended.",
           "You come out scrubbed and scented. Prettiness counts, in courtship."]);
    } else {
      p.washUsed=true; p.scrubbed=true;
      say(["Hot water, harsh soap, rosewater somebody left behind years ago. You come out scrubbed and scented.",
           "Prettiness counts, in courtship."]);
    }
    saveGame();
  } else if (ch==="T"){
    if (!houseRoom("cellar")){ say(["You knock on your own floor, near the wall. It answers differently: hollow, and patient, and not loud."]); return; }
    game.cellar=buildCellar();
    game.state="cellar";
    stopWalk();
    say(["Down the stair into the cold-room. It is as cold as the thing under a house should be.",
         game.flags.cellarBarrel? "Barrels, crates, and one barrel that was never in any inventory." : "Barrels and crates."]);
  } else if (ch==="N"){
    if (p.upgrades.indexOf("nursery")<0){ say(["A corner swept clean, waiting for a reason to fill it."]); return; }
    if (p.child){
      showMenu("THE NURSERY", [
        { t:"Teach "+p.child.name+" ("+cap(childStage(p.child))+")", fn:teachChild },
        { t:"Not now", fn:()=>{} }
      ]);
    } else if (p.spouse){
      showMenu("THE NURSERY", [
        { t:"Try for a child", d:"The cradle is built. It is only waiting.", fn:tryForChild },
        { t:"Not this year", fn:()=>{} }
      ]);
    } else say(["A smooth cradle, empty. The city owes you nothing to fill it with."]);
  }
}
function tryHomeMove(dx,dy){
  const hm=game.home;
  const nx=hm.px+dx, ny=hm.py+dy;
  if (homeSolid(nx,ny)) return;
  hm.px=nx; hm.py=ny;
  heroFace = dy>0?"dn":dy<0?"up":dx>0?"rt":"lf";
  if (homeTile(nx,ny)==="D") leaveHome();
}
function leaveHome(){
  game.home=null; stopWalk();
  game.state="base";
  const hb=BUILDINGS.find(b=>b.id==="home");
  if (hb && hb.door){ /* step out onto the street below the doorstep, not into the doorway */
    game.base.px=hb.door[0]; game.base.py=hb.door[1]+1;
    if (citySolid(game.base.px,game.base.py)){ game.base.px=hb.door[0]; game.base.py=hb.door[1]; }
  }
  saveGame();
}
function homeWalkTo(tx,ty,cb){
  const hm=game.home; if (!hm) return;
  if (tx===hm.px && ty===hm.py){ if (cb) cb(); return; }
  const path=bfsPath(hm.px,hm.py,tx,ty,(x,y)=>!homeSolid(x,y),hm.w,hm.h);
  if (!path){ showHint("No path there."); return; }
  walkPath=path; walkCb=cb||null; walkTick=4;
}
function homeApproach(tx,ty){
  const hm=game.home; if (!hm) return;
  const cands=[[tx,ty-1],[tx,ty+1],[tx-1,ty],[tx+1,ty]].filter(cc=>!homeSolid(cc[0],cc[1]));
  let best=null, bd=1e9;
  for (const c of cands){ const dd=Math.abs(c[0]-hm.px)+Math.abs(c[1]-hm.py); if (dd<bd){ bd=dd; best=c; } }
  if (!best) return;
  if (best[0]===hm.px && best[1]===hm.py){ homeInteract(homeTile(tx,ty)); return; }
  homeWalkTo(best[0],best[1],()=>homeInteract(homeTile(tx,ty)));
}
function openHome(quiet){
  const p=game.player;
  if (!p.house){ say(["Wrecked rooms behind a rotted door. Yours someday, maybe. If you live and pay."]); return; }
  game.home=buildHome();
  game.state="home";
  if (quiet) return;
  const lines=["Home. The floor slants, the roof holds, the dead stay outside.",
               p.spouse? p.spouse.name+" has the kettle on."
               : game.flags.posthumous? "The house remembers two keepers: the one it buried, and you."
               : "No one waits up for you. Yet."];
  if (p.child) lines.push(p.child.name+" babbles at a dust mote, near the crib.");
  say(lines);
}
function buildCellar(){
  const rows=[
    "############",
    "#k..o...c..#",
    "#..c..k..o.#",
    "#.o...c...k#",
    "#..k..o....#",
    "#####S######"
  ];
  const hm={ w:rows[0].length, h:rows.length, rows:rows, px:5, py:4 };
  if (!game.flags.cellarBarrel){
    const bl=[];
    for (let y=0;y<hm.h;y++) for (let x=0;x<hm.w;x++) if (rows[y][x]==="o") bl.push([x,y]);
    game.flags.cellarBarrel=pick(bl);
  }
  return hm;
}
function cellarTile(x,y){ const cm=game.cellar; if (!cm||x<0||y<0||x>=cm.w||y>=cm.h) return "#"; return cm.rows[y][x]; }
function cellarSolid(x,y){ const c=cellarTile(x,y); return c!=="." && c!=="S"; }
function cellarAdjacentBarrel(){
  const cm=game.cellar; if (!cm) return null;
  for (const d of [[0,-1],[0,1],[-1,0],[1,0]]){
    const x=cm.px+d[0], y=cm.py+d[1];
    if (cellarTile(x,y)==="o") return [x,y];
  }
  return null;
}
function leaveCellar(){
  game.cellar=null; stopWalk();
  game.state="home";
  if (game.home){ game.home.px=12; game.home.py=2; }
  saveGame();
}
function cellarInteract(x,y){

function updateCellar(){
  if (!game.cellar) game.cellar=buildCellar();
  if (uiBlocked()){ updateUI(); return; }
  const cm=game.cellar;
  const mv=dirTap();
  if (mv){ stopWalk(); tryCellarMove(mv[0],mv[1]); return; }
  if (walkPath && walkPath.length){
    if (yesTap()||noTap()){ stopWalk(); return; }
    if (++walkTick>=4){
      walkTick=0;
      const st=walkPath.shift();
      if (cellarSolid(st[0],st[1])){ stopWalk(); }
      else {
        heroFace = st[1]>cm.py?"dn":st[1]<cm.py?"up":st[0]>cm.px?"rt":"lf";
        cm.px=st[0]; cm.py=st[1];
        if (cellarTile(st[0],st[1])==="S"){ leaveCellar(); return; }
        if (!walkPath.length && walkCb){ const cb=walkCb; walkCb=null; cb(); }
      }
    }
    return;
  }
  walkPath=null; walkCb=null;
  if (tap("x")||tap("escape")){ leaveCellar(); return; }
  if (yesTap()){
    stopWalk();
    const b=cellarAdjacentBarrel();
    if (b){ cellarInteract(b[0],b[1]); return; }
    if (cellarTile(cm.px+1,cm.py)==="k"||cellarTile(cm.px-1,cm.py)==="k"||cellarTile(cm.px,cm.py+1)==="k"||cellarTile(cm.px,cm.py-1)==="k")
      say(["Crates: the surplus of the city, sunk to its underfloor. You take inventory of other people's hopes."]);
    else
      say(["Crates and barrels, and the cold. Under Jericho there is always one more floor."]);
  }
}
function tryCellarMove(dx,dy){
  const cm=game.cellar;
  const nx=cm.px+dx, ny=cm.py+dy;
  if (cellarSolid(nx,ny)) return;
  cm.px=nx; cm.py=ny;
  heroFace = dy>0?"dn":dy<0?"up":dx>0?"rt":"lf";
  if (cellarTile(nx,ny)==="S") leaveCellar();
}
function cellarWalkTo(tx,ty,cb){
  const cm=game.cellar; if (!cm) return;
  if (tx===cm.px && ty===cm.py){ if (cb) cb(); return; }
  const path=bfsPath(cm.px,cm.py,tx,ty,(x,y)=>!cellarSolid(x,y),cm.w,cm.h);
  if (!path){ showHint("No path there."); return; }
  walkPath=path; walkCb=cb||null; walkTick=4;
}

/* ----- time ----- */
function advanceWeeks(n){
  const p=game.player;
  const before=Math.floor(game.week/52);
  game.week+=n;
  if (p.child) p.child.weeks+=n;
  const after=Math.floor(game.week/52);
  if (after>before){
    if (after>=40){ p.maxhp=Math.max(12,p.maxhp-(after-before)); p.hp=clamp(p.hp,0,p.maxhp); }
  }
  if (p.spouse && houseRoom("cellar") && Math.random()<0.5)
    p.gold+=4+irnd(8);
  simulateNPCs(n);
  updateKingdom();
}
/* Jericho does not wait for you. NPCs age, wed, multiply, and die. */
function simulateNPCs(n){
  const p=game.player;
  game.flags.news = game.flags.news||[];
  for (const np of game.npcs){
    if (np.dead) continue;
    np.ageWeeks+=n;
    const nage=Math.floor(np.ageWeeks/52);
    if (np.marriedTo===null && np.ageWeeks>=52*20 &&
        np!==p.spouse && Math.random()<0.005*n){
      np.marriedTo=pick(NPC_SPOUSES);
      if (np===p.partner){
        p.partner=null;
        game.flags.news.push(np.name.split(" ")[0]+" has wed "+np.marriedTo+". You were in the dark. You are always in the dark.");
      } else game.flags.news.push(np.name.split(" ")[0]+" married "+np.marriedTo+".");
      continue;
    }
    if (np.marriedTo!==null && Math.random()<0.008*n) np.kids++;
    if (nage>=55 && Math.random()<0.004*n){
      np.dead=true;
      if (!game.flags.unburied) game.flags.unburied=[];
      if (game.flags.unburied.length<6) game.flags.unburied.push(np.name);
      if (np===p.spouse){
        p.spouse=null; np.widowed=true;
        game.flags.news.push(np.name.split(" ")[0]+" died last winter, in her bed, "+nage+" years old. No bell rang. You still sleep on your side.");
      } else {
        game.flags.news.push(np.name.split(" ")[0]+" died last winter. The Lamp poured one out on the floorboards.");
        if (np===p.partner) p.partner=null;
      }
    }
  }
  game.npcClock=(game.npcClock||0)+n;
  while (game.npcClock>=52){
    game.npcClock-=52;
    const taken=game.npcs.map(x=>x.name);
    const names=NPC_ARRIVAL_NAMES.filter(nm=>taken.indexOf(nm)<0);
    if (names.length && game.npcs.length<12){
      const nm=pick(names);
      const age=18+irnd(8);
      game.npcs.push({ name:nm, desc:pick(NPC_ARRIVAL_DESCS), age:age, ageWeeks:age*52, talks:GENERIC_TALKS.slice(),
        marriedTo:null, dead:false, widowed:false, kids:0, parentOfYou:false, aff:0, met:false });
      game.flags.news.push(nm.split(" ")[0]+" drifted into Jericho. Nobody asked her business; that is the custom.");
    }
  }
}
function drainNews(){
  const news=(game.flags.news||[]).slice();
  game.flags.news=[];

}

function launchDelve(opening){
  if (typeof opening==="number") opening=OPENINGS[opening];
  const d={ opening:opening, depth:1, floors:[], px:0, py:0, steps:0 };
  game.dungeon=d;
  game.state="dungeon";
  game.player.delves++;
  game.player.echoUsed=false;
  game.player.pantryUsed=false; game.player.washUsed=false; game.player.scrubbed=false;
  genFloor(d);
  say(["You descend into "+opening.name+".",
       "The city noise dies in about nine steps. Something else starts."]);
}
function genFloor(d){
  const rg=mulberry(irnd(2147483647));
  const w=44,h=34;
  const grid=[];
  for (let y=0;y<h;y++) grid.push(new Array(w).fill("#"));
  const rooms=[];
  const nRooms=9+irnd(3);
  for (let i=0;i<nRooms*4 && rooms.length<nRooms;i++){
    const rw=4+irnd(6), rh=4+irnd(4);
    const rx=2+irnd(w-rw-4), ry=2+irnd(h-rh-4);
    const room={x:rx,y:ry,w:rw,h:rh,cx:rx+(rw>>1),cy:ry+(rh>>1)};
    if (rooms.some(r=>Math.abs(r.cx-room.cx)<9 && Math.abs(r.cy-room.cy)<8)) continue;
    rooms.push(room);
    for (let y=room.y;y<room.y+room.h;y++) for (let x=room.x;x<room.x+room.w;x++) grid[y][x]=".";
  }
  rooms.sort((a,b)=>(a.cx+a.cy)-(b.cx+b.cy));
  const carve=(x,y)=>{ grid[y][x]="."; };
  for (let i=1;i<rooms.length;i++){
    const a=rooms[i-1], b=rooms[i];
    let x=a.cx,y=a.cy;
    while (x!==b.cx){ carve(x,y); x+=Math.sign(b.cx-x); }
    while (y!==b.cy){ carve(x,y); y+=Math.sign(b.cy-y); }
    carve(x,y);
  }
  if (rooms.length>4){
    const a=rooms[0], b=rooms[rooms.length-1];
    let x=a.cx,y=a.cy;
    while (x!==b.cx){ carve(x,y); x+=Math.sign(b.cx-x); }
    while (y!==b.cy){ carve(x,y); y+=Math.sign(b.cy-y); }
  }
  const floor={ w:w,h:h,grid:grid,rooms:rooms, seen:new Set(), events:[], visitedRooms:new Set() };
  const evs=floor.events;
  const start=rooms[0];
  floor.grid[start.cy][start.cx]="<";
  const far=rooms[rooms.length-1];
  floor.grid[far.cy][far.cx]=">";
  const freeTiles=[];
  for (const r of rooms){
    for (let y=r.y;y<r.y+r.h;y++) for (let x=r.x;x<r.x+r.w;x++){
      if ((x===start.cx&&y===start.cy)||(x===far.cx&&y===far.cy)) continue;
      freeTiles.push([x,y]);
    }
  }
  shuffle(freeTiles, rg);
  let fi=0;
  const nextFree=()=>freeTiles[fi++];
  const tierNow=clamp(d.opening.tier+(d.depth-1),1,3);
  const nLoot=3+irnd(3)+Math.min(3,Math.floor((d.depth-1)/3));
  for (let i=0;i<nLoot;i++){ const t=nextFree(); if(!t) break;
    evs.push({x:t[0],y:t[1],type:"loot",items:rollLoot(tierNow,1+irnd(2))}); }
  const nObs=2+irnd(2);
  for (let i=0;i<nObs;i++){ const t=nextFree(); if(!t) break;
    evs.push({x:t[0],y:t[1],type:"obstacle", kind:pick(["rubble","gas"])}); }
  if (irnd(2)===0 || tierNow>1){ const t=nextFree(); if(t) evs.push({x:t[0],y:t[1],type:"puzzle", kind:pick(["riddle","levers","sink"])}); }
  if (irnd(2)===0){ const t=nextFree(); if(t) evs.push({x:t[0],y:t[1],type:"corpse"}); }
  if (tierNow>1 && irnd(3)===0){ const t=nextFree(); if(t) evs.push({x:t[0],y:t[1],type:"shrine"}); }
  if (irnd(4)===0){ const t=nextFree(); if(t) evs.push({x:t[0],y:t[1],type:"bait"}); }
  if (irnd(10)===0){ const t=nextFree(); if(t) evs.push({x:t[0],y:t[1],type:"whimper"}); }
  if (irnd(7)===0){ const t=nextFree(); if(t) evs.push({x:t[0],y:t[1],type:"secret", kind:irnd(2)? "stair":"door"}); }
  const isRoomTile=(x,y)=>rooms.some(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h);
  const doors=[];
  for (const r of rooms){
    for (let x=r.x;x<r.x+r.w;x++){
      if (r.y>0 && grid[r.y-1][x]!=="#" && !isRoomTile(x,r.y-1)) doors.push({x:x,y:r.y-1,s:0});
      if (r.y+r.h<h && grid[r.y+r.h][x]!=="#" && !isRoomTile(x,r.y+r.h)) doors.push({x:x,y:r.y+r.h,s:1});
    }
    for (let y=r.y;y<r.y+r.h;y++){
      if (r.x>0 && grid[y][r.x-1]!=="#" && !isRoomTile(r.x-1,y)) doors.push({x:r.x-1,y:y,s:2});
      if (r.x+r.w<w && grid[y][r.x+r.w]!=="#" && !isRoomTile(r.x+r.w,y)) doors.push({x:r.x+r.w,y:y,s:3});
    }
  }
  floor.doors=doors;
  const corTiles=[];
  const traceCor=(a,b)=>{ let x=a.cx,y=a.cy;
    while (x!==b.cx){ if (!isRoomTile(x,y)) corTiles.push([x,y]); x+=Math.sign(b.cx-x); }
    while (y!==b.cy){ if (!isRoomTile(x,y)) corTiles.push([x,y]); y+=Math.sign(b.cy-y); }
    if (!isRoomTile(x,y)) corTiles.push([x,y]); };
  for (let i=1;i<rooms.length;i++) traceCor(rooms[i-1],rooms[i]);
  const choke=corTiles.filter(t=>{ const x=t[0],y=t[1];
    let n=0;
    if (y>0 && grid[y-1][x]!=="#") n++;
    if (y<h-1 && grid[y+1][x]!=="#") n++;
    if (x>0 && grid[y][x-1]!=="#") n++;
    if (x<w-1 && grid[y][x+1]!=="#") n++;
    return n===2; });
  shuffle(choke, rg);
  const nTrap=(tierNow>=2?3:2)+(irnd(2)===0?1:0);
  const trapKinds=["spikes","spikes","plate","plate","chasm"];
  const placed=[];
  const separates=(bx,by)=>{
    // sealing this tile must cut its corridor in two: the open neighbors on
    // either side must have no other path to each other - a true single-file gate
    const around=[];
    for (const q of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=bx+q[0], ny=by+q[1];
      if (nx>=0&&ny>=0&&nx<w&&ny<h&&grid[ny][nx]!=="#") around.push([nx,ny]);
    }
    if (around.length!==2) return false;
    const seen=new Set([around[0][0]+","+around[0][1]]);
    const q=[around[0]]; let head=0;
    while (head<q.length){
      const c=q[head++];
      if (c[0]===around[1][0] && c[1]===around[1][1]) return false;
      for (const d of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=c[0]+d[0], ny=c[1]+d[1], k=nx+","+ny;
        if (nx<0||ny<0||nx>=w||ny>=h) continue;
        if (grid[ny][nx]==="#" || (nx===bx&&ny===by) || seen.has(k)) continue;
        seen.add(k); q.push([nx,ny]);
      }
    }
    return true;
  };
  for (const t of choke){
    if (placed.length>=nTrap) break;
    if (placed.some(q=>Math.abs(q[0]-t[0])+Math.abs(q[1]-t[1])<3)) continue;
    if (!separates(t[0],t[1])) continue;   // prefer true single-file gates
    placed.push(t);
    evs.push({x:t[0],y:t[1],type:"obstacle", kind:pick(trapKinds)});
  }
  for (const t of choke){
    if (placed.length>=nTrap) break;
    if (placed.some(q=>Math.abs(q[0]-t[0])+Math.abs(q[1]-t[1])<3)) continue;
    // fallback: any single-file corridor tile - the trap is the tile you step on
    placed.push(t);
    evs.push({x:t[0],y:t[1],type:"obstacle", kind:pick(trapKinds)});
  }
  /* ----- the floor's one landlord ----- */
  if (rooms.length>2){
    let bt=null;
    for (let i=freeTiles.length-2;i>=fi && !bt;i--){
      const t=freeTiles[i];
      const inR=rooms.find(r=>t[0]>=r.x&&t[0]<r.x+r.w&&t[1]>=r.y&&t[1]<r.y+r.h);
      if (inR && inR!==start && inR!==far) bt=t;
    }
    if (bt){
      const bpool=FLOOR_BOSSES.filter(b=>b.minTier<=tierNow);
      const bw=irnd(100);
      const sents=bpool.filter(b=>b.kind==="sentient"), beasts=bpool.filter(b=>b.kind==="beast");
      const B= (sents.length && (bw<55 || !beasts.length))? pick(sents) : (beasts.length? pick(beasts) : pick(bpool));
      const bev={ x:bt[0], y:bt[1], type:"boss", boss:B.id, kind:B.kind };
      evs.push(bev);
      floor.bossEv=bev;
    }
  }
  const lt=freeTiles.length? freeTiles[freeTiles.length-1] : null;
  if (lt) floor.lurker={ x:lt[0], y:lt[1] };
  d.floors.push(floor);
  d.floorIx=d.floors.length-1;
  d.px=start.cx; d.py=start.cy;
  d.tierNow=tierNow;
  markSeen();
}
function shuffle(a, rg){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(rg()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } }
function curFloor(){ return game.dungeon.floors[game.dungeon.floorIx]; }
function tileAt(x,y){
  const f=curFloor();
  if (x<0||y<0||x>=f.w||y>=f.h) return "#";
  return f.grid[y][x];
}
function tierEnemy(){
  const tier=game.dungeon.tierNow;
  const dep=game.dungeon.depth||1;
  let base;
  if (!game.dungeon.opening.undead && dep>=4 && Math.random()<(dep-3)*0.08){
    base=APEX_HORRORS[irnd(APEX_HORRORS.length)];
  } else base= game.dungeon.opening.undead? UNDEAD[irnd(UNDEAD.length)] : HORRORS[tier][irnd(HORRORS[tier].length)];
  const hp=ngHp(Math.max(3,Math.round(base.hp*(0.85+Math.random()*0.3))));
  return { n:base.n, mhp:hp, hp:hp, atk:base.atk+ngAtkBump(), tr:base.tr, artSeed:irnd(2147483647), human:false };
}
function markSeen(){
  const d=game.dungeon, f=curFloor();
  const R=4;
  for (let y=d.py-R;y<=d.py+R;y++) for (let x=d.px-R;x<=d.px+R;x++){
    if (x>=0&&y>=0&&x<f.w&&y<f.h && Math.hypot(x-d.px,y-d.py)<=R) f.seen.add(x+","+y);
  }
}
function tryMove(dx,dy){
  const d=game.dungeon;
  const nx=d.px+dx, ny=d.py+dy;
  if (tileAt(nx,ny)==="#") return;
  d.lastDx=dx; d.lastDy=dy;
  d.px=nx; d.py=ny; d.steps++;
  heroFace = dy>0?"dn":dy<0?"up":dx>0?"rt":"lf";
  markSeen();
  const p=game.player;
  drainStam(0.12);
  if (p.stam<=-25 && d.steps%2===0){
    if (d10()+p.wll<9){ die("The body calls the whole loan in, there in the"+pick([" dark"," water"," deep"])+" of "+d.opening.name+". The last of the credit was spent walking."); return; }
    if (p.rollHintW!==game.week){ p.rollHintW=game.week; showHint("At -25 every step is a death roll at your body's table. This one, you keep."); }
  }
  if (p.stam<=0 && d.steps%4===0){
    p.hp-=1;
    if (p.hp<=0){ die("Your body quit in the"+pick([" dark"," water"," deep"])+" of "+d.opening.name+"."); return; }
  }
  const f=curFloor();
  const room=f.rooms.find(r=>nx>=r.x&&nx<r.x+r.w&&ny>=r.y&&ny<r.y+r.h);
  if (room && !f.visitedRooms.has(room.x+":"+room.y)){
    f.visitedRooms.add(room.x+":"+room.y);
    const evHere=f.events.find(e=>e.x===nx&&e.y===ny);
    if (!evHere && Math.random()<0.30){
      const roll=Math.random();
      if (crownStageNum()>=4 && !game.flags.crownWaned && Math.random()<0.30) meetCommando();
      else if (roll<0.55) startCombat(tierEnemy());
      else if (roll<0.80) meetAdventurer();
    }
  }
  const ev=f.events.find(e=>e.x===nx&&e.y===ny);
  if (ev && !ev.done) triggerEvent(ev);
}
function stepBack(){
  const d=game.dungeon;
  if (d.lastDx!==undefined){ d.px-=d.lastDx; d.py-=d.lastDy; }
  else d.px-=1;
}

/* ----- dungeon events ----- */
function triggerEvent(ev){
  switch (ev.type){
    case "loot": {
      ev.done=true;
      const got=[];
      if (game.dungeon && game.dungeon.depth>=5) ev.items.forEach(it=>{ it.v=Math.round(it.v*1.5); });
      takeMany(ev.items, (it)=>{
          got.push(it.n);
          const r=lootRarity(it.v);
          addFloat(it.n+" - "+r.t, r.col, W/2+(irnd(96)-48), 76);
          sfx("loot"); sparkBurst(W/2, 76, r.col, 10, 1.1);
          if (r.t==="RELIC"){ kicker(8); setBanner(["A RELIC FROM THE DARK","The "+it.n+". Word of it will reach the market."]); sparkBurst(W/2, 76, "#c99df5", 30, 1.8); }
        }, ()=>{
          if (got.length){ say(["Wedged in the dark: "+got.join(", ")+"."], ()=>temptMore()); }
          else { temptMore(); }
        });
      break; }
    case "obstacle": obstacleEvent(ev); break;
    case "puzzle": puzzleEvent(ev); break;
    case "corpse": corpseEvent(ev); break;
    case "shrine": shrineEvent(ev); break;
    case "bait": baitEvent(ev); break;
    case "whimper": whimperEvent(ev); break;
    case "secret": secretEvent(ev); break;
    case "boss": bossEvent(ev); break;
  }
}
function secretEvent(ev){
  const d=game.dungeon;
  if (ev.kind==="stair"){
    showText(["A stair that should not exist: a sealed run of steps behind a wall of veined plaster, going down past the bottom of anyone's map."], ()=>{
      showMenu("A SEALED STAIR", [
        { t:"Break it open (Strength)", fn:()=>{ ev.done=true;
            if (check("str",10)){ fallThrough(d); }
            else { hurt(4,"The plaster holds. Your shoulder pays first."); saveGame(); } } },
        ...(countItem("Rope & Hook")? [{ t:"Descend with Rope & Hook", fn:()=>{ ev.done=true;
            useFromInv("Rope & Hook",1); fallThrough(d); } }]:[]),
        { t:"Leave the wall as it is", fn:()=>{ ev.done=true; stepBack(); } }
      ]);
    });
  } else {
    const undiscovered=SECRET_OPENINGS.filter(o=>!game.flags.secrets || game.flags.secrets.indexOf(o.name)<0);
    const sec= undiscovered.length? pick(undiscovered) : pick(SECRET_OPENINGS);
    showText(["A door with no wall around it, set into the dark itself. The seams around it breathe.","Beyond it, something vast counts slowly, like a ledger."], ()=>{
      showMenu("A DOOR OUT OF THE MAP", [
        { t:"Force your way in (Will)", fn:()=>{ ev.done=true;
            if (check("wll",11)){ addSecret(sec,false); startFresh(sec); }
            else { hurt(3,"The door declines you politely, like a club with standards."); saveGame(); } } },
        { t:"Mark the door. Come back with more.", fn:()=>{ ev.done=true; addSecret(sec,true); saveGame(); } },
        { t:"Leave it unlit", fn:()=>{ ev.done=true; stepBack(); } }
      ]);
    });
  }
}
function fallThrough(d){
  d.depth+=2;
  game.player.deep=Math.max(game.player.deep,d.depth);
  maybeDepthLore(d.depth);
  droneHush();
  genFloor(d);
  advanceWeeks(1);
  say(["The stair goes down and keeps going. You skip a level the city would have charged you for.",
       "Deeper now. Two floors, paid for with one step."]);
  saveGame();
}
function addSecret(sec, mark){
  if (!sec) return;
  if (!game.flags.secrets) game.flags.secrets=[];
  const fresh=game.flags.secrets.indexOf(sec.name)<0;
  if (fresh) game.flags.secrets.push(sec.name);
  sfx("bell");
  if (mark){
    setBanner(["A HIDDEN OPENING MARKED", sec.name+" is chalked into your map of the Gate."]);
    if (fresh) findLore("bellhymn","a door the city mislaid");
    say(["You chalk the seam and step away quietly.","The Gate will remember it. The Gate remembers everything."]);
  } else {
    setBanner(["YOU FOUND A HIDDEN OPENING", "Behind a door with no wall: "+sec.name+"."]);
  }
}
function startFresh(sec){
  game.dungeon=null; walkPath=null; walkCb=null;
  launchDelve(sec);
}
/* the chasm is a decision, not a wall: what you jump you leave behind,
   what you climb into takes you down a floor - depth is the reward */
function chasmGo(msgs){
  const d=game.dungeon;
  d.depth++;
  game.player.deep=Math.max(game.player.deep,d.depth);
  maybeDepthLore(d.depth);
  droneHush();
  genFloor(d);
  advanceWeeks(1);
  saveGame();
  say(msgs);
}

  } else if (ev.kind==="gas"){

            else hurt(3,"The plate sighs under your heel. Above the arch, something old lets go of a spring. The floor is no quieter for it.");
            saveGame(); } },
        { t:"Hunt the lever and pry it over (Strength)", fn:()=>{
            if (check("str",9)){ ev.done=true;

                   "You lean your weight into it. Somewhere, a spring gives up its ambition. The plate is furniture now."]); }
            else { hurt(1,"The lever locks; the mechanism notices the interest. A dart, old but willing, finds your forearm."); }
            saveGame(); } },
        ...(countItem("Rope & Hook")? [{ t:"Use Rope & Hook", fn:()=>{ ev.done=true;

            say(["You weight the trigger with the hook and step past your own funeral."]);

        { t:"Back off", fn:()=>{ stepBack(); } }
      ]);
    });
  } else {
